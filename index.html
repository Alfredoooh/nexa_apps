<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Vibely Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F5;
    --surface2: #ECECEE;
    --floating: #FFFFFF;
    --popup: #FFFFFF;
    --text: #1C1C1E;
    --text2: #6E6E73;
    --accent: #2596be;
    --accent-rgb: 37,150,190;
    --on-accent: #FFFFFF;
    --accent-container: rgba(37,150,190,0.16);
    --border: #ECECEE;
    --outline: #DCDCE0;
    --danger: #FF3B30;
    --shadow-strong: 0 2px 10px rgba(0,0,0,0.08);
    --popup-shadow: 0 6px 24px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --top-extra: 46px;
    --bar-h: 62px;
    --kb: 0px;
    --emphasized: cubic-bezier(0.2, 0, 0, 1);
    --emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
    --emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
    --ios: cubic-bezier(0.32, 0.72, 0, 1);
    --np-c1: #2596be;
    --np-c2: #16607a;
    --dom: #2596be;
    --sheet-r: 34px;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --surface: #1F1F1F;
    --surface2: #2A2A2C;
    --floating: #1F1F1F;
    --popup: #1F1F1F;
    --text: #F2F2F2;
    --text2: #9B9B9F;
    --on-accent: #FFFFFF;
    --border: #3A3A3C;
    --outline: #48484A;
    --danger: #FF453A;
    --shadow-strong: 0 4px 16px rgba(0,0,0,0.35);
    --popup-shadow: 0 8px 28px rgba(0,0,0,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html, body {
    height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
    overscroll-behavior:none;
  }
  button { font-family:inherit; cursor:pointer; }
  ion-icon { pointer-events:none; }
  input { -webkit-user-select:text; user-select:text; }

  .tap { transition:transform .2s var(--emphasized), opacity .2s ease; }
  .tap:active { transform:scale(.95); opacity:.85; }

  #app { position:fixed; inset:0; background:var(--bg); overflow:hidden; }

  #root {
    position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
    transition:transform .42s var(--ios);
    will-change:transform;
  }
  #root.pushed { transform:translate3d(-28%,0,0); }
  #root-dim {
    position:absolute; inset:0; z-index:55; background:#000; opacity:0; pointer-events:none;
    transition:opacity .42s var(--ios);
  }

  .loader { display:flex; align-items:center; justify-content:center; padding:44px 0; }
  .loader svg { width:36px; height:36px; animation:loaderRotate 1.4s linear infinite; transform-origin:center; }
  .loader circle {
    fill:none; stroke:var(--accent); stroke-width:3.4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0; animation:loaderDash 1.4s ease-in-out infinite;
  }
  .loader.small { padding:22px 0; }
  .loader.small svg { width:26px; height:26px; }
  @keyframes loaderRotate { 100% { transform:rotate(360deg); } }
  @keyframes loaderDash {
    0%   { stroke-dasharray:1, 200; stroke-dashoffset:0; }
    50%  { stroke-dasharray:90, 200; stroke-dashoffset:-35px; }
    100% { stroke-dasharray:90, 200; stroke-dashoffset:-124px; }
  }
  .btn-loader { width:22px; height:22px; animation:loaderRotate 1.4s linear infinite; }
  .btn-loader circle {
    fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0; animation:loaderDash 1.4s ease-in-out infinite;
  }

  #topbar {
    position:relative; z-index:20; flex-shrink:0;
    padding:calc(var(--safe-top) + var(--top-extra)) 20px 12px;
    display:flex; align-items:center; gap:10px; background:var(--bg);
  }
  #page-title {
    flex:1; min-width:0; font-size:30px; font-weight:800; letter-spacing:-0.9px; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .top-btn {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:var(--surface); color:var(--text); border:0;
    display:flex; align-items:center; justify-content:center;
  }
  .top-btn.plain { background:transparent; }
  .top-btn ion-icon { font-size:20px; }
  #pl-add-top { display:none; }
  #pl-add-top.show { display:flex; }

  #tabs { position:relative; flex:1; min-height:0; }
  .view {
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; overscroll-behavior-y:contain;
    padding-top:4px; padding-bottom:200px;
    visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s;
  }
  .view::-webkit-scrollbar { display:none; }
  .view.active { visibility:visible; opacity:1; pointer-events:auto; transition:opacity .28s ease, visibility 0s; }

  .section { margin-bottom:26px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px; margin-bottom:12px; }
  .section-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }

  #ptr {
    position:absolute; left:50%; top:0; z-index:30; width:44px; height:44px; margin-left:-22px;
    border-radius:50%; background:var(--popup); box-shadow:0 3px 12px rgba(0,0,0,.22);
    display:flex; align-items:center; justify-content:center;
    transform:translateY(-60px) scale(.6); opacity:0; pointer-events:none;
    transition:transform .3s var(--emphasized), opacity .2s ease;
  }
  #ptr.pulling { transition:none; }
  #ptr svg { width:24px; height:24px; transform-origin:center; }
  #ptr circle { fill:none; stroke:var(--accent); stroke-width:3.6; stroke-linecap:round; stroke-dasharray:90, 200; stroke-dashoffset:0; }
  #ptr.busy svg { animation:loaderRotate 1s linear infinite; }
  #ptr.busy circle { animation:loaderDash 1.4s ease-in-out infinite; }

  #home-filters { display:flex; gap:8px; padding:2px 20px 16px; overflow-x:auto; scrollbar-width:none; }
  #home-filters::-webkit-scrollbar { display:none; }
  .fchip {
    padding:9px 18px; border-radius:999px; border:0; flex-shrink:0;
    background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
    transition:background .25s ease, color .25s ease;
  }
  .fchip.active { background:var(--accent); color:var(--on-accent); }

  .scroll-row {
    display:flex; gap:14px; overflow-x:auto; padding:2px 20px 6px;
    scrollbar-width:none; scroll-snap-type:x proximity; scroll-padding-left:20px;
    overscroll-behavior-x:contain;
  }
  .scroll-row::-webkit-scrollbar { display:none; }
  .feed-card { flex:0 0 144px; width:144px; scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both; }
  .feed-card .thumb { width:144px; height:144px; border-radius:10px; overflow:hidden; background:var(--surface2); }
  .feed-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .feed-card .card-title {
    font-size:14px; font-weight:700; margin-top:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25;
  }
  .feed-card .card-sub { font-size:13px; color:var(--text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  .artist-head { display:flex; align-items:center; gap:12px; padding:0 20px; margin-bottom:12px; }
  .artist-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .artist-head .lbl { font-size:13px; color:var(--text2); font-weight:600; }
  .artist-head .nm { font-size:22px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist-head .see { margin-left:auto; border:0; background:transparent; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0 8px 12px; flex-shrink:0; }

  .short-card {
    flex:0 0 118px; width:118px; height:190px; border-radius:14px; overflow:hidden; position:relative;
    background:var(--surface2); scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .short-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .short-card::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.72)); }
  .short-card .sc-t { position:absolute; left:10px; right:10px; bottom:10px; z-index:2; color:#fff; font-size:13px; font-weight:700; line-height:1.2;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .short-card .sc-p { position:absolute; top:8px; right:8px; z-index:2; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; }
  .short-card .sc-p ion-icon { font-size:15px; }

  .track-list { display:flex; flex-direction:column; }
  .track-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .track-row:active { background:var(--surface); }
  .track-row.playing .tr-title { color:var(--accent); }
  .tr-thumb { width:56px; height:56px; border-radius:6px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .tr-info { flex:1; min-width:0; }
  .tr-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-sub { font-size:14px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:4px; }
  .tr-sub ion-icon { font-size:13px; flex-shrink:0; }
  .tr-more {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tr-more ion-icon { font-size:22px; }
  .tr-more:active { background:var(--surface); }
  .list-sentinel { height:1px; }
  .list-more { display:flex; justify-content:center; padding:10px 0 18px; }

  #search-row { display:flex; align-items:center; gap:6px; padding:0 8px 0 20px; margin-bottom:6px; }
  #search-fake {
    flex:1; min-width:0; display:flex; align-items:center; gap:10px;
    height:52px; padding:0 18px; border-radius:999px; background:var(--surface);
    color:var(--text2); font-size:16px; font-weight:500; border:0; text-align:left;
  }
  #search-fake ion-icon { font-size:21px; flex-shrink:0; }
  .icon-plain {
    width:48px; height:48px; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:50%;
  }
  .icon-plain ion-icon { font-size:26px; }
  .icon-plain:active { background:var(--surface); }

  #recent-artists { padding:14px 0 4px; }
  #recent-artists .ra-title { font-size:18px; font-weight:800; letter-spacing:-0.3px; padding:0 20px 12px; }
  #ra-row { display:flex; gap:16px; overflow-x:auto; padding:0 20px 6px; scrollbar-width:none; }
  #ra-row::-webkit-scrollbar { display:none; }
  .ra-item { flex:0 0 76px; width:76px; display:flex; flex-direction:column; align-items:center; gap:8px; border:0; background:transparent; color:var(--text); }
  .ra-item .av { width:72px; height:72px; border-radius:50%; overflow:hidden; background:var(--surface2); display:flex; align-items:center; justify-content:center; }
  .ra-item .av img { width:100%; height:100%; object-fit:cover; display:block; }
  .ra-item .av ion-icon { font-size:30px; color:var(--text2); }
  .ra-item .nm { font-size:12.5px; font-weight:600; max-width:76px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #cat-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; padding:18px 20px 14px; }
  #cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }
  .cat-card {
    position:relative; height:96px; border-radius:12px; overflow:hidden; border:0; text-align:left;
    color:#fff; padding:12px 14px; font-size:17px; font-weight:800; letter-spacing:-0.2px;
    animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .cat-card ion-icon { position:absolute; right:-6px; bottom:-8px; font-size:64px; opacity:.30; transform:rotate(-18deg); }

  .pl-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .pl-row:active { background:var(--surface); }
  .pl-cover {
    width:64px; height:64px; border-radius:8px; overflow:hidden; background:var(--surface2); flex-shrink:0;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; align-items:center; justify-items:center;
  }
  .pl-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .pl-cover img.full { grid-column:1 / 3; grid-row:1 / 3; }
  .pl-cover ion-icon { grid-column:1 / 3; grid-row:1 / 3; font-size:28px; color:var(--text2); }
  .pl-info { flex:1; min-width:0; }
  .pl-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-count { font-size:14px; color:var(--text2); margin-top:2px; }

  .seg-tabs { position:relative; display:flex; margin:2px 20px 12px; padding:4px; border-radius:999px; background:var(--surface); }
  .seg-tabs .seg-pill { position:absolute; top:4px; bottom:4px; left:4px; border-radius:999px; background:var(--bg); box-shadow:0 1px 6px rgba(0,0,0,.12); transition:transform .35s var(--ios), width .35s var(--ios); }
  .seg-tabs button { position:relative; z-index:1; flex:1; height:38px; border:0; background:transparent; color:var(--text2); font-size:14px; font-weight:700; transition:color .25s ease; }
  .seg-tabs button.active { color:var(--text); }

  .btn-fill {
    height:44px; padding:0 22px; border-radius:999px; border:0; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
  }
  .btn-fill ion-icon { font-size:20px; }
  .btn-outline {
    height:44px; padding:0 18px; border-radius:999px; border:1.5px solid var(--outline); background:transparent; color:var(--text);
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;
  }
  .btn-outline ion-icon { font-size:18px; }

  #view-shorts { padding:0; overflow:hidden; background:#000; }
  #shorts-scroll {
    position:absolute; inset:0; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none;
    overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
  }
  #shorts-scroll::-webkit-scrollbar { display:none; }
  .short {
    position:relative; height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; color:#fff;
    background:#111;
  }
  .short-bg { position:absolute; inset:-14%; background-size:cover; background-position:center; filter:blur(38px) saturate(1.3); transform:scale(1.15); opacity:.9; }
  .short::before { content:''; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.05) 32%, rgba(0,0,0,.70) 100%); }
  .short-art {
    position:absolute; z-index:2; left:50%; top:calc(var(--safe-top) + 78px); transform:translateX(-50%) scale(.94);
    width:min(78vw, 46vh); aspect-ratio:1/1; border-radius:8px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.5);
    transition:transform .5s var(--emphasized);
  }
  .short.on .short-art { transform:translateX(-50%) scale(1); }
  .short-art img { width:100%; height:100%; object-fit:cover; display:block; }
  .short-info { position:absolute; z-index:3; left:20px; right:88px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 120px); }
  .short-info .s-t { font-size:22px; font-weight:800; letter-spacing:-0.4px; line-height:1.15;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-shadow:0 2px 12px rgba(0,0,0,.45); }
  .short-info .s-a { font-size:16px; font-weight:600; opacity:.85; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .short-tag { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.2); font-size:12px; font-weight:700; margin-bottom:10px; }
  .short-tag ion-icon { font-size:14px; }
  .short-actions { position:absolute; z-index:3; right:12px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 118px); display:flex; flex-direction:column; align-items:center; gap:18px; }
  .s-act { display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:transparent; color:#fff; font-size:12px; font-weight:700; }
  .s-act .ic { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; transition:transform .25s var(--emphasized), background .2s ease; }
  .s-act:active .ic { transform:scale(.88); }
  .s-act ion-icon { font-size:24px; }
  .s-act.liked ion-icon { color:#ff4d6d; }
  .short-prog { position:absolute; z-index:3; left:20px; right:20px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 96px); height:4px; border-radius:99px; background:rgba(255,255,255,.28); overflow:hidden; }
  .short-prog i { display:block; height:100%; width:0%; background:#fff; border-radius:99px; }
  .short-hint { position:absolute; z-index:3; left:0; right:0; bottom:calc(var(--bar-h) + var(--safe-bottom) + 66px); text-align:center; font-size:12px; font-weight:700; opacity:.7; letter-spacing:.3px; }

  .page {
    position:absolute; inset:0; z-index:60; background:var(--bg); overflow:hidden;
    display:flex; flex-direction:column;
    transform:translate3d(100%,0,0); visibility:hidden;
    transition:transform .42s var(--ios), visibility 0s linear .42s;
    box-shadow:-10px 0 28px rgba(0,0,0,.14);
    will-change:transform; contain:layout paint;
  }
  .page.open { transform:translate3d(0,0,0); visibility:visible; transition:transform .42s var(--ios), visibility 0s; }
  .page.behind { transform:translate3d(-28%,0,0); visibility:visible; }
  .page.leaving { transform:translate3d(100%,0,0); visibility:visible; transition:transform .36s var(--ios), visibility 0s linear .36s; }
  .page.dragging, #root.dragging { transition:none !important; }
  .page-bar {
    flex-shrink:0; padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;
    display:flex; align-items:center; gap:4px; background:var(--bg);
  }
  .page-back {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .page-back ion-icon { font-size:26px; }
  .page-back:active { background:var(--surface); }
  .page-title { font-size:26px; font-weight:800; letter-spacing:-0.6px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .page-body { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:140px; overscroll-behavior-y:contain; }
  .page-body::-webkit-scrollbar { display:none; }
  #swipe-edge { position:absolute; left:0; top:0; bottom:0; width:22px; z-index:65; display:none; touch-action:none; }
  #swipe-edge.on { display:block; }

  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 32px; text-align:center; color:var(--text2); }
  .empty-state ion-icon { font-size:52px; opacity:.35; margin-bottom:14px; }
  .empty-state .es-t { font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .empty-state .es-s { font-size:14px; line-height:1.4; max-width:260px; }
  .empty-state .btn-fill { margin-top:18px; }

  #page-detail { background:var(--bg); }
  #det-hero {
    position:absolute; left:0; right:0; top:0; z-index:3; overflow:hidden;
    height:var(--hero-h, 340px); background:var(--dc, #2596be);
    will-change:transform;
  }
  #det-cover-bg { position:absolute; inset:-10%; background-size:cover; background-position:center; filter:blur(30px) saturate(1.25); opacity:.55; transform:scale(1.1); }
  #det-cover { position:absolute; left:50%; top:calc(var(--safe-top) + 62px); width:min(56vw, 210px); height:min(56vw, 210px); margin-left:calc(min(56vw, 210px) / -2); overflow:hidden; background:var(--surface2); box-shadow:0 14px 36px rgba(0,0,0,.34); will-change:transform, opacity; transform-origin:50% 0%; }
  #det-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  #det-cover.round { border-radius:50%; }

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function load(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; } }
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function loadNativePrefs() {
  if (isApp && typeof Android.getPreferences === 'function') {
    try {
      const native = JSON.parse(Android.getPreferences());
      return {
        theme: native.theme || undefined,
        lang: native.lang || undefined,
        quality: native.quality || undefined,
        dlQuality: native.dlQuality || undefined,
        wifiOnly: native.wifiOnly === 'true',
        saveData: native.saveData === 'true',
      };
    } catch (e) { return {}; }
  }
  return {};
}

const DEFAULTS = {
  theme:'system', lang:'pt', dominant:false, quality:'auto', crossfade:0, autoplay:true, normalize:false,
  gapless:true, wifiOnly:false, dlQuality:'normal', saveData:false, shareCast:true,
};
const nativePrefs = loadNativePrefs();
let settings = Object.assign({}, DEFAULTS, load('settings', {}), Object.fromEntries(Object.entries(nativePrefs).filter(([,v]) => v !== undefined)));

function setSetting(k, v) {
  settings[k] = v; save('settings', settings);
  if (isApp && typeof Android.setPreference === 'function') {
    const nativeKeys = ['theme', 'lang', 'quality', 'dlQuality', 'wifiOnly', 'saveData'];
    if (nativeKeys.includes(k)) { try { Android.setPreference(k, String(v)); } catch (_) {} }
  }
}

async function loadLanguage(code) {
  if (code === 'pt') { LANG_STRINGS = {}; return true; }
  try {
    const cached = load('langpack_' + code, null);
    if (cached && cached.__v === 1) LANG_STRINGS = cached;
    const res = await fetch('lang/' + code + '.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    data.__v = 1;
    LANG_STRINGS = data;
    save('langpack_' + code, data);
    return true;
  } catch (e) {
    return !!LANG_STRINGS && Object.keys(LANG_STRINGS).length > 0;
  }
}

  pageStack.forEach((id, i) => {

(function () {

    top = $(pageStack[pageStack.length - 1]);

const sheetHost = $('sheet-host');

const SHEET_ANIM = 440;

function openSheet(html) {

  sheetHost.appendChild(layer);

  const idx = sheetStack.indexOf(entry);
  if (idx < 0) { if (done) done(); return; }
  sheetStack.splice(idx, 1);
  entry.panel.classList.remove('dragging');
  entry.panel.style.transform = '';
  entry.layer.style.background = '';
  entry.layer.classList.remove('open');
  entry.layer.classList.add('closing');

function bindSheetDrag(entry) {
  const { panel, layer, content, handle } = entry;
  let startY = 0, dy = 0, lastY = 0, lastT = 0, vel = 0, drag = false, fromContent = false;
  function begin(y, fc) { startY = lastY = y; dy = 0; vel = 0; lastT = performance.now(); drag = true; fromContent = fc; }
  function move(y, ev) {
    if (!drag) return;
    const delta = y - startY;
    if (fromContent) { if (content.scrollTop > 0 || delta <= 0) { startY = y; return; } }
    if (delta <= 0) { dy = 0; panel.style.transform = ''; return; }
    if (ev.cancelable) ev.preventDefault();
    panel.classList.add('dragging');
    const now = performance.now();
    vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    dy = delta;
    panel.style.transform = `translate3d(0,${dy}px,0)`;

  }

/* ═══════════════════════════════════════════════════════════
   SCROLL INFINITO
   ═══════════════════════════════════════════════════════════ */
function makeInfinite(opts) {
  // opts: { root, listEl, moreEl, all, fetchMore(): Promise<Array>, getQueue, listOpts, pageSize }
  const state = { all: opts.all.slice(), shown: 0, loading: false, done: false, obs: null };
  const size = opts.pageSize || 30;
  const seen = new Set(state.all.map(x => x.id));
  function renderFirst() {
    const first = state.all.slice(0, size);
    state.shown = first.length;
    bindTrackList(opts.listEl, first, () => state.all, opts.listOpts);
    opts.getQueueRef && opts.getQueueRef(() => state.all);
    ensureSentinel();
  }
  function ensureSentinel() {
    opts.moreEl.innerHTML = '<div class="list-sentinel"></div>';

    state.obs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadNext(); }, { root: opts.root, rootMargin: '600px 0px' });
    state.obs.observe(opts.moreEl.firstChild);

    if (state.loading || state.done) return;
    state.loading = true;

      if (state.shown >= state.all.length) {
        opts.moreEl.innerHTML = LOADER_SMALL;
        const more = opts.fetchMore ? await opts.fetchMore(state.all.length) : [];
        const fresh = (more || []).filter(x => x && x.id && !seen.has(x.id) && seen.add(x.id));
        if (!fresh.length) { state.done = true; opts.moreEl.innerHTML = ''; state.loading = false; return; }
        state.all = state.all.concat(fresh);
      }
      const from = state.shown;
      const next = state.all.slice(from, from + size);
      opts.listOpts = opts.listOpts || {};
      appendTrackList(opts.listEl, state.all.slice(0, from + next.length), from, () => state.all, opts.listOpts);
      state.shown = from + next.length;
      if (opts.onGrow) opts.onGrow(state.all);

}

async function shareTo(app, track, entry) {
  const url = trackLink(track), text = shareText(track);
  const enc = encodeURIComponent;
  if (app === 'copy') {
    try { await navigator.clipboard.writeText(url); }
    catch { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
    closeSheet(entry); toast(t('copied')); return;
  }
  // Tenta partilhar a IMAGEM (com o QR) diretamente, quando o WebView suporta ficheiros.
  let blob = null;
  try { blob = await buildShareImage(track); } catch (_) {}
  if (blob && navigator.canShare) {
    try {
      const file = new File([blob], 'vibely-' + track.id + '.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: track.title, text });
        closeSheet(entry); return;
      }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  // Fallback nativo: envia a imagem em base64 para o Android (se disponível) ou só o texto.
  if (isApp && blob && typeof Android.shareImage === 'function') {
    try {
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
      Android.shareImage(app, track.title || '', text, b64); closeSheet(entry); return;
    } catch (_) {}
  }
  if (isApp && typeof Android.shareTo === 'function') { try { Android.shareTo(app, track.title, track.artist, url); closeSheet(entry); return; } catch (_) {} }
  const links = {
    whatsapp: 'https://wa.me/?text=' + enc(text),
    telegram: 'https://t.me/share/url?url=' + enc(url) + '&text=' + enc(track.title + ' • ' + track.artist),
    x:        'https://twitter.com/intent/tweet?text=' + enc(track.title + ' • ' + track.artist) + '&url=' + enc(url),
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url),
    sms:      'sms:?body=' + enc(text),
    instagram:'https://www.instagram.com/',
  };
  if (app === 'more' || !links[app]) {
    if (navigator.share) { try { await navigator.share({ title: track.title, text: track.title + ' • ' + track.artist, url }); closeSheet(entry); } catch (_) {} }
    else toast(t('shareUnavailable'));
    return;
  }
  closeSheet(entry);
  if (isApp && typeof Android.openUrl === 'function') { try { Android.openUrl(links[app]); return; } catch (_) {} }
  window.open(links[app], '_blank');
}

let scannerOpen = false, scanStream = null, scanTimer = null, scanDetector = null, scanBusy = false;
const scannerEl = $('scanner'), scanVideo = $('scan-video');

async function openScanner() {
  if (scannerOpen) return;

  scannerEl.classList.add('open');
  $('scan-found').innerHTML = '';
  $('scan-msg').textContent = t('scanHint');
  try { history.pushState({ scan: 1 }, ''); } catch (_) {}
  if (!('BarcodeDetector' in window)) { $('scan-msg').textContent = t('scanNoDetector'); return; }
  try {
    scanDetector = new BarcodeDetector({ formats: ['qr_code'] });
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    scanVideo.srcObject = scanStream;
    await scanVideo.play().catch(() => {});
    scanBusy = false;
    scanTimer = setInterval(scanTick, 260);
  } catch (e) { $('scan-msg').textContent = t('scanNoCam'); }
}
async function scanTick() {

  scanBusy = true;

    const codes = await scanDetector.detect(scanVideo);
    if (codes && codes.length) { const id = parseVibelyPayload(codes[0].rawValue); if (id) { await onScanned(id); } else { $('scan-msg').textContent = t('scanInvalid'); } }
  } catch (_) {}

}
function stopScan() {

/* O QR só traz o ID: o app busca o título, artista e capa e mostra a música pronta. */

    const res = await fetch(BASE + '/search?q=' + encodeURIComponent(id) + '&limit=10');
    const arr = await res.json();
    if (Array.isArray(arr)) { const exact = arr.find(x => x.id === id); if (exact) return exact; }
  } catch (_) {}
  try {
    const res = await fetch(BASE + '/related?id=' + encodeURIComponent(id));
    await res.json();
  } catch (_) {}
  return { id, title: id, artist: 'YouTube', thumbnail: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg', duration: 0 };
}

    <button class="fc-btn tap" id="fc-play" aria-label="Tocar"><ion-icon name="play"></ion-icon></button></div>`;

$('scan-torch').addEventListener('click', async () => {

let heroMax = 340, heroMin = 0, detTitleEl = $('det-title');

function fmtTotal(tracks) {

  if (!s) return '';
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);

}
function setDetailColor(rgbArr) {

/* Collapse: tudo por transform/opacity → sem reflow, 60fps. A altura do herói NÃO muda. */
let heroTick = false, heroLastY = -1;
function applyHero(y) {

  detCover.style.transform = `translate3d(0,${Math.min(y, range) * 0.55}px,0) scale(${1 - eased * 0.34})`;

const searchCache = {};
async function apiSearch(q, limit) {
  const key = q + '|' + (limit || 100);
  if (searchCache[key]) return searchCache[key];
  const res = await fetch(BASE + '/search?q=' + encodeURIComponent(q) + '&limit=' + (limit || 100));
  const data = await res.json();
  const arr = Array.isArray(data) ? data : [];
  if (arr.length) searchCache[key] = arr;
  return arr;
}
const normTitle = s => (s || '').toLowerCase().replace(/[\(\[].*?[\)\]]/g, '').replace(/[^a-z0-9à-ú ]/gi, '').replace(/\s+/g, ' ').trim();
async function deepSearch(q, minResults) {
  minResults = minResults || 100;
  const variants = [q, q + ' official audio', q + ' músicas', q + ' mix', q + ' hits', q + ' live'];
  const first = await apiSearch(q, minResults).catch(() => []);
  let batches = [first];
  if (first.length < minResults) batches = batches.concat(await Promise.all(variants.slice(1).map(v => apiSearch(v, 40).catch(() => []))));
  const seenId = new Set(), seenTitle = new Set(), out = [], ql = q.toLowerCase();
  batches.forEach((list, bi) => {
    list.forEach((tr, idx) => {
      if (!tr || !tr.id || seenId.has(tr.id)) return;
      const nt = normTitle(tr.title); if (seenTitle.has(nt)) return;
      seenId.add(tr.id); seenTitle.add(nt);
      const hay = ((tr.title || '') + ' ' + (tr.artist || '')).toLowerCase();
      let score = 100 - bi * 12 - idx;
      if (hay.includes(ql)) score += 30;
      ql.split(/\s+/).forEach(w => { if (w.length > 2 && hay.includes(w)) score += 6; });
      out.push({ tr, score });
    });
  });
  out.sort((a, b) => b.score - a.score);
  return out.map(o => o.tr);
}

      }
    } catch (_) {}
  }
  const q = settings.saveData ? 'low' : settings.quality;
  const res = await fetch(BASE + '/stream?id=' + encodeURIComponent(id) + '&quality=' + encodeURIComponent(q));
  return (await res.json()).streamUrl;
}
async function startStream(track, token) {
  try {
    const streamUrl = await streamFor(track.id);
    if (token !== playToken) return;
    if (!streamUrl) throw new Error('sem stream');
    audio.pause(); audio.src = streamUrl; audio.load(); await audio.play();
  } catch (e) { if (token !== playToken) return; console.error('Erro stream:', e); retryOrFail(token); }
}
function retryOrFail(token) {
  if (token !== playToken || !currentTrack) return;
  if (retryCount >= MAX_RETRIES) { setPlayIcon('play'); setSpinning(false); toast(t('cantPlay')); return; }
  retryCount++;
  const resumeAt = audio.currentTime || 0;
  setPlayIcon('loading');
  setTimeout(async () => {
    if (token !== playToken) return;
    try {
      const streamUrl = await streamFor(currentTrack.id);
      if (token !== playToken || !streamUrl) return;
      audio.src = streamUrl; audio.load();
      if (resumeAt > 0) audio.addEventListener('loadedmetadata', function once() { audio.removeEventListener('loadedmetadata', once); try { audio.currentTime = resumeAt; } catch (_) {} });
      await audio.play();
    } catch (e) { retryOrFail(token); }
  }, 800 * retryCount);
}
async function autoContinue() {
  if (!settings.autoplay || !currentTrack || !isApp || currentTrack.isLocal) { setPlayIcon('play'); setSpinning(false); return; }
  try {
    const res = await fetch(BASE + '/related?id=' + encodeURIComponent(currentTrack.id));
    const data = await res.json();
    if (Array.isArray(data) && data.length) { currentQueue = data; currentQueueIndex = 0; play(data[0], 0); return; }
  } catch (_) {}
  setPlayIcon('play'); setSpinning(false);
}
async function autoContinueForce() {
  if (!currentTrack || !isApp || currentTrack.isLocal) { toast(t('noMoreQueue')); return; }
  try {
    const res = await fetch(BASE + '/related?id=' + encodeURIComponent(currentTrack.id));
    const data = await res.json();
    const seen = new Set([currentTrack.id]);
    const extra = (Array.isArray(data) ? data : []).filter(x => x && x.id && !seen.has(x.id) && seen.add(x.id));
    if (extra.length) {
      currentQueue = [currentTrack].concat(extra);
      currentQueueIndex = 1;
      play(currentQueue[1], 1);
      return;
    }
  } catch (_) {}
  toast(t('noMoreQueue'));
}
function nextTrack(auto) {
  if (!currentQueue.length) return;
  if (auto && repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (currentQueue.length === 1 && !(auto && repeatMode === 1)) { autoContinueForce(); return; }
  if (shuffleOn && currentQueue.length > 1) {
    let n; do { n = Math.floor(Math.random() * currentQueue.length); } while (n === currentQueueIndex);
    currentQueueIndex = n;
  } else {
    if (auto && repeatMode === 0 && currentQueueIndex === currentQueue.length - 1) { autoContinue(); return; }
    currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  }
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}
function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}
function togglePlay() { if (!currentTrack) return; if (audio.paused) audio.play().catch(() => { if (!currentTrack.isLocal) retryOrFail(playToken); }); else audio.pause(); }

$('mini-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('mini-next').addEventListener('click', e => { e.stopPropagation(); nextTrack(false); });
$('np-play').addEventListener('click', togglePlay);
$('np-next').addEventListener('click', () => nextTrack(false));
$('np-prev').addEventListener('click', prevTrack);
$('np-shuffle').addEventListener('click', () => { shuffleOn = !shuffleOn; $('np-shuffle').classList.toggle('on', shuffleOn); toast(shuffleOn ? t('shuffleOn') : t('shuffleOff')); });
$('np-repeat').addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  const b = $('np-repeat');
  b.classList.toggle('on', repeatMode > 0);
  b.classList.toggle('one', repeatMode === 2);
  toast([t('repeatOff'), t('repeatQueue'), t('repeatOne')][repeatMode]);
});
$('np-share').addEventListener('click', () => { if (currentTrack && !currentTrack.isLocal) openShare(currentTrack); else toast(t('shareUnavailable')); });

audio.addEventListener('play', () => { setPlayIcon('pause'); setSpinning(true); notifyNative(true); });
audio.addEventListener('playing', () => { retryCount = 0; setPlayIcon('pause'); setSpinning(true); notifyNative(true); });
audio.addEventListener('pause', () => { if (!audio.ended) { setPlayIcon('play'); setSpinning(false); notifyNative(true); } });
audio.addEventListener('waiting', () => setPlayIcon('loading'));
audio.addEventListener('stalled', () => { const token = playToken; setTimeout(() => { if (token === playToken && audio.readyState < 3 && !audio.paused) retryOrFail(token); }, 6000); });
audio.addEventListener('error', () => {
  if (!currentTrack) return;
  if (currentTrack.isLocal) {
    setPlayIcon('play'); setSpinning(false); notifyNative(true);
    toast(t('cantPlayFile'));
    return;
  }
  retryOrFail(playToken);
});
audio.addEventListener('ended', () => nextTrack(true));

let scrubbing = false;
let lastLyricsIdx = -1;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $('mini-progress').style.width = pct + '%';
  if (!scrubbing) $('np-bar-fill').style.width = pct + '%';
  $('np-cur').textContent = fmtTime(Math.floor(audio.currentTime));
  $('np-tot').textContent = fmtTime(Math.floor(audio.duration));
  notifyNative(false);
  syncLyricsHighlight(audio.currentTime);
});
function bindSlider(bar, onChange, onStart, onEnd) {
  const getPct = e => { const r = bar.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX); return clamp((x - r.left) / r.width, 0, 1); };
  let down = false;
  const start = e => { down = true; bar.classList.add('active'); onStart && onStart(); onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const move = e => { if (!down) return; onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const end = () => { if (!down) return; down = false; bar.classList.remove('active'); onEnd && onEnd(); };
  bar.addEventListener('touchstart', start, { passive: false }); bar.addEventListener('touchmove', move, { passive: false }); bar.addEventListener('touchend', end);
  bar.addEventListener('mousedown', start); window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
}
let seekPct = 0;
bindSlider($('np-bar'), pct => { seekPct = pct; $('np-bar-fill').style.width = (pct * 100) + '%'; }, () => { scrubbing = true; },
  () => { scrubbing = false; if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekPct * audio.duration; });
bindSlider($('np-vol-bar'), pct => { audio.volume = pct; $('np-vol-fill').style.width = (pct * 100) + '%'; });

/* Mini player: deslizar para os lados troca de faixa; deslizar para BAIXO para a música e esconde o mini player. */
(function () {
  const track = $('mini-track');
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false, decided = false, mode = '', t0 = 0;
  miniPlayer.addEventListener('touchstart', e => {
    if (e.target.closest('.mini-btn')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; dy = 0; drag = true; decided = false; mode = ''; t0 = performance.now();
    track.style.transition = 'none'; miniPlayer.style.transition = 'none';
  }, { passive: true });
  miniPlayer.addEventListener('touchmove', e => {
    if (!drag) return;
    const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { decided = true; mode = Math.abs(mx) > Math.abs(my) ? 'h' : (my > 0 ? 'down' : 'up'); }
    if (mode === 'h') {
      dx = mx; track.style.transform = `translate3d(${dx}px,0,0)`; track.style.opacity = String(1 - Math.min(.6, Math.abs(dx) / 300));
    } else if (mode === 'down') {
      dy = Math.max(0, my); miniPlayer.style.transform = `translate(-50%, ${dy}px)`; miniPlayer.style.opacity = String(1 - Math.min(.85, dy / 120));
    }
  }, { passive: true });
  miniPlayer.addEventListener('touchend', () => {
    if (!drag) return; drag = false;
    const el = Math.max(1, performance.now() - t0);
    if (mode === 'down') {
      miniPlayer.style.transition = '';
      if (dy > 46 || dy / el > 0.5) { dismissMiniPlayer(); }
      else { miniPlayer.style.transform = ''; miniPlayer.style.opacity = ''; }
      mode = ''; decided = false; return;
    }
    miniPlayer.style.transition = '';
    const vel = Math.abs(dx) / el;
    track.style.transition = 'transform .28s var(--emphasized), opacity .28s ease';
    if (mode === 'h' && (Math.abs(dx) > 70 || vel > 0.5)) {
      const dir = dx < 0 ? -1 : 1;
      track.style.transform = `translate3d(${dir * 120}%,0,0)`; track.style.opacity = '0';
      setTimeout(() => {
        if (dir < 0) nextTrack(false); else prevTrackForce();
        track.style.transition = 'none'; track.style.transform = `translate3d(${-dir * 60}%,0,0)`; track.style.opacity = '0';
        raf(() => raf(() => { track.style.transition = 'transform .32s var(--emphasized-decel), opacity .25s ease'; track.style.transform = ''; track.style.opacity = '1'; }));
      }, 200);
    } else {
      track.style.transform = ''; track.style.opacity = '1';
      if (!mode && Math.abs(dx) < 6) openNowPlaying();
    }
    mode = ''; decided = false;
  });
})();
function dismissMiniPlayer() {
  try { audio.pause(); } catch (_) {}
  playToken++;
  miniPlayer.style.transform = ''; miniPlayer.style.opacity = '';
  miniPlayer.classList.remove('active');
  currentTrack = null; setSpinning(false); markPlaying();
  if (isApp && typeof Android.updateNowPlaying === 'function') { try { Android.updateNowPlaying('', '', '', false, 0, 0); } catch (_) {} }
}
function prevTrackForce() {
  if (!currentQueue.length) return;
  if (currentQueue.length === 1) { try { audio.currentTime = 0; audio.play(); } catch (_) {} return; }
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}

window.nativeMediaCommand = function (cmd) {
  if (!cmd) return;
  if (cmd === 'play') {
    if (currentTrack) audio.play().catch(() => { if (!currentTrack.isLocal) retryOrFail(playToken); });
    return;
  }
  if (cmd === 'pause') { audio.pause(); return; }
  if (cmd === 'next') { nextTrack(false); return; }
  if (cmd === 'prev') { prevTrackForce(); return; }
  if (cmd.indexOf('seek:') === 0) {
    const ms = parseInt(cmd.slice(5), 10);
    if (!isNaN(ms)) { try { audio.currentTime = ms / 1000; } catch (_) {} }
  }
};

/* ═══════════════════════════════════════════════════════════
   PLAYER EM ECRÃ CHEIO
   ═══════════════════════════════════════════════════════════ */
let npOpenedAt = 0;
function openNowPlaying() {
  if (!currentTrack || nowPlaying.classList.contains('open')) return;
  syncDeviceBtn();
  npOpenedAt = Date.now();
  nowPlaying.classList.add('open'); document.body.classList.add('np-open');
  try { history.pushState({ np: 1 }, ''); } catch (_) {}
}
function closeNowPlaying(fromHistory) {
  if (!nowPlaying.classList.contains('open')) return;
  nowPlaying.style.transform = ''; nowPlaying.classList.remove('open'); document.body.classList.remove('np-open');
  setNpTab('album');
  if (!fromHistory) historyBackSilently();
}
function closeAllOverlaysForNav() { closeAllSheets(); closeMenu(); closeDialog(); }

/* O botão de fechar consome o toque por completo: evita "clicar" no botão de voltar que está por trás. */
function swallow(e) { e.stopPropagation(); e.preventDefault(); }
const npClose = $('np-close');
npClose.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
npClose.addEventListener('touchend', e => { e.stopPropagation(); if (e.cancelable) e.preventDefault(); closeNowPlaying(false); });
npClose.addEventListener('click', e => { swallow(e); if (Date.now() - npOpenedAt > 250) closeNowPlaying(false); });
$('np-more').addEventListener('click', e => { e.stopPropagation(); if (currentTrack) openTrackSheet(currentTrack, null); });

/* Tabs do player: Álbum | Letras. Em "Letras" os controlos somem e a letra ocupa o ecrã inteiro. */
function setNpTab(tab) {
  const lyr = tab === 'lyrics';
  nowPlaying.classList.toggle('lyrics', lyr);
  $('np-tab-album').classList.toggle('active', !lyr);
  $('np-tab-lyrics').classList.toggle('active', lyr);
  if (lyr && currentTrack) loadNowPlayingLyrics(currentTrack);
}
$('np-tab-album').addEventListener('click', e => { e.stopPropagation(); setNpTab('album'); });
$('np-tab-lyrics').addEventListener('click', e => {
  e.stopPropagation();
  if (!currentTrack || currentTrack.isLocal) { toast(t('lyricsNA')); return; }
  setNpTab('lyrics');
});
(function () {
  const pagesEl = $('np-pages');
  let sx = 0, sy = 0, dx = 0, decided = false, horiz = false, on = false;
  pagesEl.addEventListener('touchstart', e => {
    if (e.target.closest('#np-lyrics-full') && nowPlaying.classList.contains('lyrics')) { on = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; decided = false; horiz = false; on = true;
  }, { passive: true });
  pagesEl.addEventListener('touchmove', e => {
    if (!on) return;
    const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if (!decided && (Math.abs(mx) > 10 || Math.abs(my) > 10)) { decided = true; horiz = Math.abs(mx) > Math.abs(my); }
    if (horiz) { dx = mx; e.stopPropagation(); }
  }, { passive: true });
  pagesEl.addEventListener('touchend', () => {
    if (!on) return; on = false;
    if (horiz && Math.abs(dx) > 60) {
      if (dx < 0 && !nowPlaying.classList.contains('lyrics') && currentTrack && !currentTrack.isLocal) setNpTab('lyrics');
      else if (dx > 0 && nowPlaying.classList.contains('lyrics')) setNpTab('album');
    }
  });
})();

(function () {
  let startY = 0, dy = 0, dragging = false, lastY = 0, lastT = 0, vel = 0;
  const isInteractive = x => x.closest('#np-bar, #np-vol-bar, button, #np-lyrics-full, #np-tabs');
  nowPlaying.addEventListener('touchstart', e => {
    if (isInteractive(e.target)) return;
    startY = lastY = e.touches[0].clientY; dy = 0; vel = 0; lastT = performance.now(); dragging = true; nowPlaying.classList.add('dragging');
  }, { passive: true });
  nowPlaying.addEventListener('touchmove', e => {
    if (!dragging) return;
    const y = e.touches[0].clientY, now = performance.now();
    vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    dy = Math.max(0, y - startY);
    nowPlaying.style.transform = `translate3d(0,${dy}px,0)`;
    nowPlaying.style.borderRadius = Math.min(32, dy / 4) + 'px ' + Math.min(32, dy / 4) + 'px 0 0';
  }, { passive: true });
  nowPlaying.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false; nowPlaying.classList.remove('dragging'); nowPlaying.style.borderRadius = '';
    if (dy > 140 || vel > 0.7) closeNowPlaying(false); else nowPlaying.style.transform = '';
  });
})();

/* ═══════════════════════════════════════════════════════════
   LETRAS
   ═══════════════════════════════════════════════════════════ */
const lyricsCache = {};
async function fetchLyrics(title, artist) {
  const key = title + '|' + artist;
  if (lyricsCache[key]) return lyricsCache[key];
  if (!isApp) return { found: false };
  try {
    const res = await fetch(BASE + '/lyrics?title=' + encodeURIComponent(title) + '&artist=' + encodeURIComponent(artist));
    const data = await res.json();
    lyricsCache[key] = data;
    return data;
  } catch (e) { return { found: false }; }
}
let parsedSyncedLyrics = null;
function parseLRC(lrc) {
  if (!lrc) return null;
  const lines = lrc.split('\n').map(l => {
    const m = l.match(/^\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)$/);
    if (!m) return null;
    const time = parseInt(m[1]) * 60 + parseInt(m[2]) + (m[3] ? parseInt(m[3].padEnd(3, '0')) / 1000 : 0);
    return { time, text: m[4].trim() };
  }).filter(Boolean);
  return lines.length ? lines : null;
}
function resetLyricsView() {
  parsedSyncedLyrics = null; lastLyricsIdx = -1;
  $('np-lyrics-text').textContent = t('loadingLyrics');
  $('np-lyrics-full').scrollTop = 0;
  if (nowPlaying.classList.contains('lyrics')) { if (currentTrack && !currentTrack.isLocal) loadNowPlayingLyrics(currentTrack); else setNpTab('album'); }
}
let userScrollingLyrics = false, lyricsScrollTimer = null;
$('np-lyrics-full').addEventListener('touchstart', () => { userScrollingLyrics = true; clearTimeout(lyricsScrollTimer); }, { passive: true });
$('np-lyrics-full').addEventListener('touchend', () => { lyricsScrollTimer = setTimeout(() => { userScrollingLyrics = false; }, 2600); }, { passive: true });
function syncLyricsHighlight(tm) {
  if (!parsedSyncedLyrics || !nowPlaying.classList.contains('lyrics')) return;
  let idx = -1;
  for (let i = 0; i < parsedSyncedLyrics.length; i++) { if (parsedSyncedLyrics[i].time <= tm) idx = i; else break; }
  if (idx === lastLyricsIdx) return;
  lastLyricsIdx = idx;
  const container = $('np-lyrics-text');
  container.querySelectorAll('.np-lyr-line').forEach((el, i) => el.classList.toggle('active', i === idx));
  const activeEl = container.querySelector('.np-lyr-line.active');
  if (activeEl && !userScrollingLyrics) activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function loadNowPlayingLyrics(track) {
  $('np-lyrics-text').textContent = t('loadingLyrics');
  const data = await fetchLyrics(track.title, track.artist);
  if (!currentTrack || currentTrack.id !== track.id) return;
  const container = $('np-lyrics-text');
  if (data.found && data.syncedLyrics) {
    parsedSyncedLyrics = parseLRC(data.syncedLyrics);
    if (parsedSyncedLyrics) {
      container.innerHTML = parsedSyncedLyrics.map(l => `<div class="np-lyr-line">${esc(l.text || '♪')}</div>`).join('');
      syncLyricsHighlight(audio.currentTime);
      return;
    }
  }
  if (data.found && data.plainLyrics) {
    parsedSyncedLyrics = null;
    container.textContent = data.plainLyrics;
    return;
  }
  parsedSyncedLyrics = null;
  container.textContent = t('lyricsNA');
}
function openLyricsSheet(track) {
  const entry = openSheet(`<div class="sheet-title">${esc(t('lyrics'))}</div><div class="lyrics-box">${LOADER_HTML}</div>`);
  fetchLyrics(track.title, track.artist).then(data => {
    const el = entry.content.querySelector('.lyrics-box');
    if (!el) return;
    if (data.found && (data.plainLyrics || data.syncedLyrics)) {
      const text = data.plainLyrics || (data.syncedLyrics || '').replace(/\[\d{2}:\d{2}[.:]\d{2,3}\]/g, '');
      el.textContent = text;
    } else {
      el.innerHTML = `<div class="empty-state"><ion-icon name="text-outline"></ion-icon><div class="es-t">${esc(t('lyricsNA'))}</div></div>`;
    }
  });
}

function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: track.title || '', artist: track.artist || '', artwork: track.thumbnail ? [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }] : [] });
}
if ('mediaSession' in navigator) {
  const safeHandler = (name, fn) => { try { navigator.mediaSession.setActionHandler(name, fn); } catch (_) {} };
  safeHandler('play', () => window.nativeMediaCommand('play'));
  safeHandler('pause', () => window.nativeMediaCommand('pause'));
  safeHandler('previoustrack', () => window.nativeMediaCommand('prev'));
  safeHandler('nexttrack', () => window.nativeMediaCommand('next'));
  safeHandler('seekto', d => { if (d.seekTime != null) { try { audio.currentTime = d.seekTime; } catch (_) {} } });
}

/* Bloqueia toques "por trás" do mini player e da barra: clicar nos elementos deles nunca deve atravessar. */
['mini-player', 'bottom-bar'].forEach(id => {
  const el = $(id);
  el.addEventListener('click', e => e.stopPropagation());
  el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
});

function fmtTime(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60), sec = Math.floor(s % 60); return m + ':' + String(sec).padStart(2, '0'); }
function esc(str) { return (str == null ? '' : String(str)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
audio.volume = 1;
(async function init() {
  if (settings.lang && settings.lang !== 'pt') { await loadLanguage(settings.lang); }
  applyTheme();
  syncDominantSwitch();
  renderCategories();
  renderRecents();
  renderHomeFilters();
  renderRecentArtists();
  applyLanguage();
  syncDeviceBtn();
  movePlSeg();
  loadHomeFeed();
})();
</script>
