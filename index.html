<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Vibely Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F5;
    --surface2: #ECECEE;
    --floating: #FFFFFF;
    --popup: #FFFFFF;
    --text: #1C1C1E;
    --text2: #6E6E73;
    --accent: #2596be;
    --accent-rgb: 37,150,190;
    --on-accent: #FFFFFF;
    --accent-container: rgba(37,150,190,0.16);
    --border: #ECECEE;
    --outline: #DCDCE0;
    --danger: #FF3B30;
    --shadow-strong: 0 2px 10px rgba(0,0,0,0.08);
    --popup-shadow: 0 6px 24px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --top-extra: 46px;
    --bar-h: 62px;
    --kb: 0px;
    --emphasized: cubic-bezier(0.2, 0, 0, 1);
    --emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
    --emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
    --np-c1: #2596be;
    --np-c2: #16607a;
    --dom: #2596be;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --surface: #1F1F1F;
    --surface2: #2A2A2C;
    --floating: #1F1F1F;
    --popup: #1F1F1F;
    --text: #F2F2F2;
    --text2: #9B9B9F;
    --on-accent: #FFFFFF;
    --border: #3A3A3C;
    --outline: #48484A;
    --danger: #FF453A;
    --shadow-strong: 0 4px 16px rgba(0,0,0,0.35);
    --popup-shadow: 0 8px 28px rgba(0,0,0,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html, body {
    height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
    overscroll-behavior:none;
  }
  button { font-family:inherit; cursor:pointer; }
  ion-icon { pointer-events:none; }
  input { -webkit-user-select:text; user-select:text; }

  .tap { transition:transform .2s var(--emphasized), opacity .2s ease; }
  .tap:active { transform:scale(.95); opacity:.85; }

  #app { position:fixed; inset:0; background:var(--bg); overflow:hidden; }

  #root {
    position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg);
    transition:transform .38s var(--emphasized-decel), filter .38s ease;
    will-change:transform;
  }
  #root.pushed { transform:translateX(-28%); }
  #root-dim {
    position:absolute; inset:0; z-index:55; background:#000; opacity:0; pointer-events:none;
    transition:opacity .38s ease;
  }

  .loader { display:flex; align-items:center; justify-content:center; padding:44px 0; }
  .loader svg { width:36px; height:36px; animation:loaderRotate 1.4s linear infinite; transform-origin:center; }
  .loader circle {
    fill:none; stroke:var(--accent); stroke-width:3.4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0; animation:loaderDash 1.4s ease-in-out infinite;
  }
  @keyframes loaderRotate { 100% { transform:rotate(360deg); } }
  @keyframes loaderDash {
    0%   { stroke-dasharray:1, 200; stroke-dashoffset:0; }
    50%  { stroke-dasharray:90, 200; stroke-dashoffset:-35px; }
    100% { stroke-dasharray:90, 200; stroke-dashoffset:-124px; }
  }
  .btn-loader { width:22px; height:22px; animation:loaderRotate 1.4s linear infinite; }
  .btn-loader circle {
    fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0; animation:loaderDash 1.4s ease-in-out infinite;
  }

  #topbar {
    position:relative; z-index:20; flex-shrink:0;
    padding:calc(var(--safe-top) + var(--top-extra)) 20px 12px;
    display:flex; align-items:center; gap:10px; background:var(--bg);
  }
  #page-title {
    flex:1; min-width:0; font-size:30px; font-weight:800; letter-spacing:-0.9px; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #page-title.swap { animation:titleIn .3s var(--emphasized-decel) both; }
  @keyframes titleIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .top-btn {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:var(--surface); color:var(--text); border:0;
    display:flex; align-items:center; justify-content:center;
  }
  .top-btn ion-icon { font-size:20px; }

  #tabs { position:relative; flex:1; min-height:0; }
  .view {
    position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; overscroll-behavior-y:contain;
    padding-top:4px; padding-bottom:200px;
    visibility:hidden; opacity:0; pointer-events:none;
    transition:opacity .22s ease, visibility 0s linear .22s;
  }
  .view::-webkit-scrollbar { display:none; }
  .view.active { visibility:visible; opacity:1; pointer-events:auto; transition:opacity .28s ease, visibility 0s; }

  .section { margin-bottom:26px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px; margin-bottom:12px; }
  .section-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }

  #ptr {
    position:absolute; left:50%; top:0; z-index:30; width:44px; height:44px; margin-left:-22px;
    border-radius:50%; background:var(--popup); box-shadow:0 3px 12px rgba(0,0,0,.22);
    display:flex; align-items:center; justify-content:center;
    transform:translateY(-60px) scale(.6); opacity:0; pointer-events:none;
    transition:transform .3s var(--emphasized), opacity .2s ease;
  }
  #ptr.pulling { transition:none; }
  #ptr svg { width:24px; height:24px; transform-origin:center; }
  #ptr circle { fill:none; stroke:var(--accent); stroke-width:3.6; stroke-linecap:round; stroke-dasharray:90, 200; stroke-dashoffset:0; }
  #ptr.busy svg { animation:loaderRotate 1s linear infinite; }
  #ptr.busy circle { animation:loaderDash 1.4s ease-in-out infinite; }

  #home-filters { display:flex; gap:8px; padding:2px 20px 16px; overflow-x:auto; scrollbar-width:none; }
  #home-filters::-webkit-scrollbar { display:none; }
  .fchip {
    padding:9px 18px; border-radius:999px; border:0; flex-shrink:0;
    background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
    transition:background .25s ease, color .25s ease;
  }
  .fchip.active { background:var(--accent); color:var(--on-accent); }

  .scroll-row {
    display:flex; gap:14px; overflow-x:auto; padding:2px 20px 6px;
    scrollbar-width:none; scroll-snap-type:x proximity; scroll-padding-left:20px;
    overscroll-behavior-x:contain;
  }
  .scroll-row::-webkit-scrollbar { display:none; }
  .feed-card { flex:0 0 144px; width:144px; scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both; }
  .feed-card .thumb { width:144px; height:144px; border-radius:8px; overflow:hidden; background:var(--surface2); }
  .feed-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .feed-card .card-title {
    font-size:14px; font-weight:700; margin-top:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25;
  }
  .feed-card .card-sub { font-size:13px; color:var(--text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  .artist-head { display:flex; align-items:center; gap:12px; padding:0 20px; margin-bottom:12px; }
  .artist-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .artist-head .lbl { font-size:13px; color:var(--text2); font-weight:600; }
  .artist-head .nm { font-size:22px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .artist-head .see { margin-left:auto; border:0; background:transparent; color:var(--accent); font-size:14px; font-weight:700; padding:8px 0 8px 12px; flex-shrink:0; }

  .short-card {
    flex:0 0 118px; width:118px; height:190px; border-radius:14px; overflow:hidden; position:relative;
    background:var(--surface2); scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .short-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .short-card::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 45%, rgba(0,0,0,.72)); }
  .short-card .sc-t { position:absolute; left:10px; right:10px; bottom:10px; z-index:2; color:#fff; font-size:13px; font-weight:700; line-height:1.2;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .short-card .sc-p { position:absolute; top:8px; right:8px; z-index:2; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.45); color:#fff; display:flex; align-items:center; justify-content:center; }
  .short-card .sc-p ion-icon { font-size:15px; }

  .track-list { display:flex; flex-direction:column; }
  .track-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .track-row:active { background:var(--surface); }
  .track-row.playing .tr-title { color:var(--accent); }
  .tr-thumb { width:56px; height:56px; border-radius:4px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .tr-info { flex:1; min-width:0; }
  .tr-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-sub { font-size:14px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:4px; }
  .tr-sub ion-icon { font-size:13px; flex-shrink:0; }
  .tr-more {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tr-more ion-icon { font-size:22px; }
  .tr-more:active { background:var(--surface); }

  #search-fake {
    display:flex; align-items:center; gap:10px; margin:0 20px 6px;
    height:52px; padding:0 18px; border-radius:999px; background:var(--surface);
    color:var(--text2); font-size:16px; font-weight:500; border:0; width:calc(100% - 40px); text-align:left;
  }
  #search-fake ion-icon { font-size:21px; flex-shrink:0; }
  #cat-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; padding:18px 20px 14px; }
  #cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }
  .cat-card {
    position:relative; height:96px; border-radius:10px; overflow:hidden; border:0; text-align:left;
    color:#fff; padding:12px 14px; font-size:17px; font-weight:800; letter-spacing:-0.2px;
    animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .cat-card ion-icon { position:absolute; right:-6px; bottom:-8px; font-size:64px; opacity:.30; transform:rotate(-18deg); }

  .pl-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .pl-row:active { background:var(--surface); }
  .pl-cover {
    width:64px; height:64px; border-radius:6px; overflow:hidden; background:var(--surface2); flex-shrink:0;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; align-items:center; justify-items:center;
  }
  .pl-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .pl-cover img.full { grid-column:1 / 3; grid-row:1 / 3; }
  .pl-cover ion-icon { grid-column:1 / 3; grid-row:1 / 3; font-size:28px; color:var(--text2); }
  .pl-info { flex:1; min-width:0; }
  .pl-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-count { font-size:14px; color:var(--text2); margin-top:2px; }
  #pl-new-wrap { padding:0 20px 14px; display:flex; gap:10px; }
  .btn-fill {
    height:44px; padding:0 22px; border-radius:999px; border:0; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
  }
  .btn-fill ion-icon { font-size:20px; }
  .btn-outline {
    height:44px; padding:0 18px; border-radius:999px; border:1.5px solid var(--outline); background:transparent; color:var(--text);
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;
  }
  .btn-outline ion-icon { font-size:18px; }

  #view-shorts { padding:0; overflow:hidden; background:#000; }
  #shorts-scroll {
    position:absolute; inset:0; overflow-y:auto; scroll-snap-type:y mandatory; scrollbar-width:none;
    overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
  }
  #shorts-scroll::-webkit-scrollbar { display:none; }
  .short {
    position:relative; height:100%; width:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; color:#fff;
    background:var(--sc, #222);
  }
  .short-bg { position:absolute; inset:-8%; background-size:cover; background-position:center; filter:none; transform:scale(1.1); opacity:.55; }
  .short::before { content:''; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(0,0,0,.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.65) 100%); }
  .short-art {
    position:absolute; z-index:2; left:50%; top:calc(var(--safe-top) + 92px); transform:translateX(-50%) scale(.94);
    width:min(78vw, 46vh); aspect-ratio:1/1; border-radius:14px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,.5);
    transition:transform .5s var(--emphasized);
  }
  .short.on .short-art { transform:translateX(-50%) scale(1); }
  .short-art img { width:100%; height:100%; object-fit:cover; display:block; }
  .short-info { position:absolute; z-index:3; left:20px; right:88px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 120px); }
  .short-info .s-t { font-size:22px; font-weight:800; letter-spacing:-0.4px; line-height:1.15;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-shadow:0 2px 12px rgba(0,0,0,.45); }
  .short-info .s-a { font-size:16px; font-weight:600; opacity:.85; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .short-tag { display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.2); font-size:12px; font-weight:700; margin-bottom:10px; }
  .short-tag ion-icon { font-size:14px; }
  .short-actions { position:absolute; z-index:3; right:12px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 118px); display:flex; flex-direction:column; align-items:center; gap:18px; }
  .s-act { display:flex; flex-direction:column; align-items:center; gap:4px; border:0; background:transparent; color:#fff; font-size:12px; font-weight:700; }
  .s-act .ic { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; transition:transform .25s var(--emphasized), background .2s ease; }
  .s-act:active .ic { transform:scale(.88); }
  .s-act ion-icon { font-size:24px; }
  .s-act.liked ion-icon { color:#ff4d6d; }
  .short-prog { position:absolute; z-index:3; left:20px; right:20px; bottom:calc(var(--bar-h) + var(--safe-bottom) + 96px); height:4px; border-radius:99px; background:rgba(255,255,255,.28); overflow:hidden; }
  .short-prog i { display:block; height:100%; width:0%; background:#fff; border-radius:99px; }
  .short-hint { position:absolute; z-index:3; left:0; right:0; bottom:calc(var(--bar-h) + var(--safe-bottom) + 66px); text-align:center; font-size:12px; font-weight:700; opacity:.7; letter-spacing:.3px; }
  #shorts-topbar { position:absolute; z-index:10; left:0; right:0; top:0; padding:calc(var(--safe-top) + var(--top-extra) - 8px) 20px 8px; display:flex; align-items:center; gap:10px; color:#fff; pointer-events:none; }
  #shorts-topbar .t { font-size:24px; font-weight:800; letter-spacing:-0.6px; flex:1; text-shadow:0 2px 10px rgba(0,0,0,.4); }
  #shorts-topbar .top-btn { background:rgba(255,255,255,.2); color:#fff; pointer-events:auto; }

  .page {
    position:absolute; inset:0; z-index:60; background:var(--bg); overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .38s var(--emphasized-decel), visibility 0s linear .38s;
    box-shadow:-10px 0 28px rgba(0,0,0,.14);
    will-change:transform;
  }
  .page.open { transform:none; visibility:visible; transition:transform .38s var(--emphasized-decel), visibility 0s; }
  .page.behind { transform:translateX(-28%); }
  .page.leaving { transform:translateX(100%); visibility:visible; transition:transform .3s var(--emphasized-accel), visibility 0s linear .3s; }
  .page.dragging, #root.dragging { transition:none !important; }
  .page-bar {
    flex-shrink:0; padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;
    display:flex; align-items:center; gap:4px; background:var(--bg);
  }
  .page-back {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .page-back ion-icon { font-size:26px; }
  .page-back:active { background:var(--surface); }
  .page-title { font-size:26px; font-weight:800; letter-spacing:-0.6px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .page-body { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:140px; overscroll-behavior-y:contain; }
  .page-body::-webkit-scrollbar { display:none; }
  #swipe-edge { position:absolute; left:0; top:0; bottom:0; width:22px; z-index:65; display:none; touch-action:none; }
  #swipe-edge.on { display:block; }

  .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 32px; text-align:center; color:var(--text2); }
  .empty-state ion-icon { font-size:52px; opacity:.35; margin-bottom:14px; }
  .empty-state .es-t { font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .empty-state .es-s { font-size:14px; line-height:1.4; max-width:260px; }
  .empty-state .btn-fill { margin-top:18px; }

  #page-detail { background:var(--bg); }
  #det-hero {
    position:absolute; left:0; right:0; top:0; z-index:3; overflow:hidden;
    height:var(--hero-h, 360px); background:var(--dc, #2596be); will-change:height;
  }
  #det-collage { position:absolute; left:0; right:0; top:calc(var(--safe-top) + 34px); height:200px; display:flex; align-items:center; justify-content:center; will-change:transform, opacity; }
  #det-collage .c { position:absolute; width:190px; height:190px; overflow:hidden; background:var(--surface2); box-shadow:0 8px 24px rgba(0,0,0,.28); }
  #det-collage .c img { width:100%; height:100%; object-fit:cover; display:block; }
  #det-collage.round .c { border-radius:50%; }
  #det-collage.square .c { border-radius:6px; width:210px; height:210px; }
  #det-collage .c0 { left:50%; margin-left:-95px; z-index:3; }
  #det-collage .c1 { left:-40px; z-index:1; transform:scale(.92); }
  #det-collage .c2 { right:-40px; z-index:2; transform:scale(.92); }
  #det-collage.square .c0 { margin-left:-105px; }
  #det-fade { position:absolute; left:0; right:0; bottom:0; height:70%; background:linear-gradient(180deg, transparent, rgba(0,0,0,.35)); z-index:2; pointer-events:none; }
  #det-title-big {
    position:absolute; left:20px; right:20px; bottom:16px; z-index:4; color:#fff;
    font-size:40px; font-weight:800; letter-spacing:-1.4px; line-height:1.02; text-shadow:0 2px 14px rgba(0,0,0,.3);
    transform-origin:left bottom; will-change:transform, opacity;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
  }
  #det-bar {
    position:absolute; left:0; right:0; top:0; z-index:8; padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;
    display:flex; align-items:center; gap:4px; pointer-events:none;
  }
  #det-bar-bg { position:absolute; inset:0; background:var(--dc, #2596be); opacity:0; }
  #det-bar > * { position:relative; pointer-events:auto; }
  #det-back {
    width:44px; height:44px; border-radius:50%; border:0; background:rgba(0,0,0,.28); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  #det-back ion-icon { font-size:24px; }
  #det-bar-title { flex:1; min-width:0; font-size:18px; font-weight:800; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transform:translateY(8px); }

(function () {
  const handle = $('sheet-handle-wrap'), content = $('sheet-content');
  let startY = 0, dy = 0, lastY = 0, lastT = 0, vel = 0, drag = false, fromContent = false;
  function begin(y, fc) { startY = lastY = y; dy = 0; vel = 0; lastT = performance.now(); drag = true; fromContent = fc; }
  function move(y, ev) {
    if (!drag) return;
    const delta = y - startY;
    if (fromContent) {
      if (content.scrollTop > 0 || delta <= 0) { startY = y; return; }
    }
    if (delta <= 0) { dy = 0; sheetEl.style.transform = ''; return; }
    if (ev.cancelable) ev.preventDefault();
    sheetEl.classList.add('dragging');
    const now = performance.now();
    vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    dy = delta;
    sheetEl.style.transform = `translateY(${dy}px)`;
    sheetOverlay.style.background = `rgba(0,0,0,${.45 * (1 - clamp(dy / sheetEl.offsetHeight, 0, 1))})`;
  }
  function end() {
    if (!drag) return;
    drag = false;
    sheetEl.classList.remove('dragging');
    if (dy > sheetEl.offsetHeight * 0.32 || vel > 0.7) closeSheet();
    else { sheetEl.style.transform = ''; sheetOverlay.style.background = ''; }
  }
  handle.addEventListener('touchstart', e => begin(e.touches[0].clientY, false), { passive: true });
  content.addEventListener('touchstart', e => begin(e.touches[0].clientY, true), { passive: true });
  [handle, content].forEach(el => {
    el.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });

    el.addEventListener('touchcancel', end);

})();

function drawCode(canvas, seed) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = canvas.clientHeight || 64;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  let s = 0; for (let i = 0; i < seed.length; i++) s = (s * 31 + seed.charCodeAt(i)) >>> 0;
  const rnd = () => { s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  const bars = 27, gap = 4, bw = 5, total = bars * bw + (bars - 1) * gap;
  const x0 = w - total - 6;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.beginPath(); ctx.arc(30, h / 2, 18, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.75)';
  ctx.font = '800 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('V', 30, h / 2 + 1);
  ctx.fillStyle = '#fff';
  for (let i = 0; i < bars; i++) {
    const hh = 8 + rnd() * (h - 16);
    const x = x0 + i * (bw + gap);
    const r = bw / 2;
    ctx.beginPath();
    ctx.moveTo(x, (h - hh) / 2 + r);
    ctx.arc(x + r, (h - hh) / 2 + r, r, Math.PI, 0);
    ctx.lineTo(x + bw, (h + hh) / 2 - r);
    ctx.arc(x + r, (h + hh) / 2 - r, r, 0, Math.PI);
    ctx.closePath(); ctx.fill();
  }
}

async function shareTo(app, track) {
  const url = trackLink(track), text = shareText(track);
  const enc = encodeURIComponent;
  if (app === 'copy') {
    try { await navigator.clipboard.writeText(url); }
    catch { const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) {} ta.remove(); }
    closeSheet(); toast('Ligação copiada'); return;
  }
  if (isApp && typeof Android.shareTo === 'function') { try { Android.shareTo(app, track.title, track.artist, url); closeSheet(); return; } catch (_) {} }
  const links = {
    whatsapp: 'https://wa.me/?text=' + enc(text),
    telegram: 'https://t.me/share/url?url=' + enc(url) + '&text=' + enc(track.title + ' • ' + track.artist),
    x:        'https://twitter.com/intent/tweet?text=' + enc(track.title + ' • ' + track.artist) + '&url=' + enc(url),
    facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + enc(url),
    sms:      'sms:?body=' + enc(text),
    instagram:'https://www.instagram.com/',
  };
  if (app === 'more' || !links[app]) {
    if (navigator.share) { try { await navigator.share({ title: track.title, text: track.title + ' • ' + track.artist, url }); closeSheet(); } catch (_) {} }
    else toast('Partilha indisponível');
    return;
  }
  closeSheet();
  if (isApp && typeof Android.openUrl === 'function') { try { Android.openUrl(links[app]); return; } catch (_) {} }
  window.open(links[app], '_blank');
}

async function deepSearch(q, minResults) {
  minResults = minResults || 100;
  const variants = [q, q + ' official audio', q + ' músicas', q + ' mix', q + ' hits', q + ' live'];
  const first = await apiSearch(q, minResults).catch(() => []);
  let batches = [first];
  if (first.length < minResults) batches = batches.concat(await Promise.all(variants.slice(1).map(v => apiSearch(v, 40).catch(() => []))));
  const seenId = new Set(), seenTitle = new Set(), out = [], ql = q.toLowerCase();
  batches.forEach((list, bi) => {
    list.forEach((tr, idx) => {
      if (!tr || !tr.id || seenId.has(tr.id)) return;
      const nt = normTitle(tr.title); if (seenTitle.has(nt)) return;
      seenId.add(tr.id); seenTitle.add(nt);
      const hay = ((tr.title || '') + ' ' + (tr.artist || '')).toLowerCase();
      let score = 100 - bi * 12 - idx;
      if (hay.includes(ql)) score += 30;
      ql.split(/\s+/).forEach(w => { if (w.length > 2 && hay.includes(w)) score += 6; });
      out.push({ tr, score });

}

  $('np-title').textContent = track.title || '—'; $('np-artist').textContent = track.artist || '—';
  $('mini-img').src = ''; $('np-img').src = '';
  miniPlayer.classList.add('active');
  $('mini-progress').style.width = '0%'; $('np-bar-fill').style.width = '0%';
  $('np-cur').textContent = '0:00'; $('np-tot').textContent = fmtTime(track.duration || 0);
  audio.pause(); audio.src = track.localUri; audio.load();
  audio.play().catch(() => toast('Não foi possível tocar este ficheiro local'));
  addRecent(track); renderRecents(); markPlaying();
  applyAlbumColor(track);
  notifyNative(true);
}

async function play(track, queueIndex) {
  if (!isApp) { toast('Player só disponível no app Vibely'); return; }
  pauseShort();
  const token = ++playToken;
  retryCount = 0; currentTrack = track;
  if (queueIndex !== undefined) currentQueueIndex = queueIndex;
  $('mini-title').textContent = track.title || '—'; $('mini-artist').textContent = track.artist || '—';
  $('np-title').textContent = track.title || '—'; $('np-artist').textContent = track.artist || '—';
  $('mini-img').src = track.thumbnail || ''; $('np-img').src = track.thumbnail || '';
  miniPlayer.classList.add('active');
  setPlayIcon('loading');
  $('mini-progress').style.width = '0%'; $('np-bar-fill').style.width = '0%';
  $('np-cur').textContent = '0:00'; $('np-tot').textContent = fmtTime(track.duration || 0);
  addRecent(track); bumpArtist(track); renderRecents(); markPlaying();
  applyAlbumColor(track);
  resetLyricsView();
  await startStream(track, token);
}
async function streamFor(id) {
  if (isApp && typeof Android.isDownloaded === 'function') {
    try {
      if (Android.isDownloaded(id) && typeof Android.downloadedFileUrl === 'function') {
        const local = Android.downloadedFileUrl(id);
        if (local) return local;
      }
    } catch (_) {}
  }
  const q = settings.saveData ? 'low' : settings.quality;
  const res = await fetch(BASE + '/stream?id=' + encodeURIComponent(id) + '&quality=' + encodeURIComponent(q));
  return (await res.json()).streamUrl;
}
async function startStream(track, token) {
  try {
    const streamUrl = await streamFor(track.id);
    if (token !== playToken) return;
    if (!streamUrl) throw new Error('sem stream');
    audio.pause(); audio.src = streamUrl; audio.load(); await audio.play();
  } catch (e) { if (token !== playToken) return; console.error('Erro stream:', e); retryOrFail(token); }
}
function retryOrFail(token) {
  if (token !== playToken || !currentTrack) return;
  if (retryCount >= MAX_RETRIES) { setPlayIcon('play'); setSpinning(false); toast('Não foi possível tocar esta faixa'); return; }
  retryCount++;
  const resumeAt = audio.currentTime || 0;
  setPlayIcon('loading');
  setTimeout(async () => {
    if (token !== playToken) return;
    try {
      const streamUrl = await streamFor(currentTrack.id);
      if (token !== playToken || !streamUrl) return;
      audio.src = streamUrl; audio.load();
      if (resumeAt > 0) audio.addEventListener('loadedmetadata', function once() { audio.removeEventListener('loadedmetadata', once); try { audio.currentTime = resumeAt; } catch (_) {} });
      await audio.play();
    } catch (e) { retryOrFail(token); }
  }, 800 * retryCount);
}
async function autoContinue() {
  if (!settings.autoplay || !currentTrack || !isApp) { setPlayIcon('play'); setSpinning(false); return; }
  try {
    const res = await fetch(BASE + '/related?id=' + encodeURIComponent(currentTrack.id));
    const data = await res.json();
    if (Array.isArray(data) && data.length) { currentQueue = data; currentQueueIndex = 0; play(data[0], 0); return; }
  } catch (_) {}
  setPlayIcon('play'); setSpinning(false);
}
function nextTrack(auto) {
  if (!currentQueue.length) return;
  if (auto && repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (shuffleOn && currentQueue.length > 1) {
    let n; do { n = Math.floor(Math.random() * currentQueue.length); } while (n === currentQueueIndex);
    currentQueueIndex = n;
  } else {
    if (auto && repeatMode === 0 && currentQueueIndex === currentQueue.length - 1) { autoContinue(); return; }
    currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  }
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}
function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}
function togglePlay() { if (!currentTrack) return; if (audio.paused) audio.play().catch(() => retryOrFail(playToken)); else audio.pause(); }

$('mini-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('mini-next').addEventListener('click', e => { e.stopPropagation(); nextTrack(false); });
$('np-play').addEventListener('click', togglePlay);
$('np-next').addEventListener('click', () => nextTrack(false));
$('np-prev').addEventListener('click', prevTrack);
$('np-shuffle').addEventListener('click', () => { shuffleOn = !shuffleOn; $('np-shuffle').classList.toggle('on', shuffleOn); toast(shuffleOn ? 'Aleatório ligado' : 'Aleatório desligado'); });
$('np-repeat').addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  const b = $('np-repeat');
  b.classList.toggle('on', repeatMode > 0);
  b.classList.toggle('one', repeatMode === 2);
  toast(['Repetir desligado', 'Repetir fila', 'Repetir esta faixa'][repeatMode]);
});
$('np-share').addEventListener('click', () => { if (currentTrack && !currentTrack.isLocal) openShare(currentTrack); else toast('Partilha indisponível para ficheiros locais'); });

audio.addEventListener('play', () => { setPlayIcon('pause'); setSpinning(true); notifyNative(true); });
audio.addEventListener('playing', () => { retryCount = 0; setPlayIcon('pause'); setSpinning(true); notifyNative(true); });
audio.addEventListener('pause', () => { if (!audio.ended) { setPlayIcon('play'); setSpinning(false); notifyNative(true); } });
audio.addEventListener('waiting', () => setPlayIcon('loading'));
audio.addEventListener('stalled', () => { const token = playToken; setTimeout(() => { if (token === playToken && audio.readyState < 3 && !audio.paused) retryOrFail(token); }, 6000); });
audio.addEventListener('error', () => { if (currentTrack && !currentTrack.isLocal) retryOrFail(playToken); });
audio.addEventListener('ended', () => nextTrack(true));

let scrubbing = false;
let lastLyricsIdx = -1;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $('mini-progress').style.width = pct + '%';
  if (!scrubbing) $('np-bar-fill').style.width = pct + '%';
  $('np-cur').textContent = fmtTime(Math.floor(audio.currentTime));
  $('np-tot').textContent = fmtTime(Math.floor(audio.duration));
  notifyNative(false);
  syncLyricsHighlight(audio.currentTime);
});
function bindSlider(bar, onChange, onStart, onEnd) {
  const getPct = e => { const r = bar.getBoundingClientRect(); const x = (e.touches ? e.touches[0].clientX : e.clientX); return clamp((x - r.left) / r.width, 0, 1); };
  let down = false;
  const start = e => { down = true; bar.classList.add('active'); onStart && onStart(); onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const move = e => { if (!down) return; onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const end = () => { if (!down) return; down = false; bar.classList.remove('active'); onEnd && onEnd(); };
  bar.addEventListener('touchstart', start, { passive: false }); bar.addEventListener('touchmove', move, { passive: false }); bar.addEventListener('touchend', end);
  bar.addEventListener('mousedown', start); window.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
}
let seekPct = 0;
bindSlider($('np-bar'), pct => { seekPct = pct; $('np-bar-fill').style.width = (pct * 100) + '%'; }, () => { scrubbing = true; },
  () => { scrubbing = false; if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekPct * audio.duration; });
bindSlider($('np-vol-bar'), pct => { audio.volume = pct; $('np-vol-fill').style.width = (pct * 100) + '%'; });

(function () {
  const track = $('mini-track');
  let sx = 0, sy = 0, dx = 0, drag = false, decided = false, horizontal = false, t0 = 0;
  miniPlayer.addEventListener('touchstart', e => {
    if (e.target.closest('.mini-btn')) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; dx = 0; drag = true; decided = false; horizontal = false; t0 = performance.now();
    track.style.transition = 'none';
  }, { passive: true });
  miniPlayer.addEventListener('touchmove', e => {
    if (!drag) return;
    const mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
    if (!decided && (Math.abs(mx) > 8 || Math.abs(my) > 8)) { decided = true; horizontal = Math.abs(mx) > Math.abs(my); }
    if (!horizontal) return;
    dx = mx;
    track.style.transform = `translateX(${dx}px)`;
    track.style.opacity = String(1 - Math.min(.6, Math.abs(dx) / 300));
  }, { passive: true });
  miniPlayer.addEventListener('touchend', () => {
    if (!drag) return; drag = false;
    const vel = Math.abs(dx) / Math.max(1, performance.now() - t0);
    track.style.transition = 'transform .28s var(--emphasized), opacity .28s ease';
    if (horizontal && (Math.abs(dx) > 70 || vel > 0.5)) {
      const dir = dx < 0 ? -1 : 1;
      track.style.transform = `translateX(${dir * 120}%)`; track.style.opacity = '0';
      setTimeout(() => {
        if (dir < 0) nextTrack(false); else prevTrackForce();
        track.style.transition = 'none'; track.style.transform = `translateX(${-dir * 60}%)`; track.style.opacity = '0';
        raf(() => raf(() => { track.style.transition = 'transform .32s var(--emphasized-decel), opacity .25s ease'; track.style.transform = ''; track.style.opacity = '1'; }));
      }, 200);
    } else {
      track.style.transform = ''; track.style.opacity = '1';
      if (!horizontal && Math.abs(dx) < 6) openNowPlaying();
    }
    horizontal = false; decided = false;
  });
})();
function prevTrackForce() {
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  playAny(currentQueue[currentQueueIndex], currentQueueIndex);
}

function openNowPlaying() {
  if (!currentTrack || nowPlaying.classList.contains('open')) return;
  syncDeviceBtn();
  nowPlaying.classList.add('open'); document.body.classList.add('np-open');
  history.pushState({ np: 1 }, '');
}
function closeNowPlaying(fromHistory) {
  if (!nowPlaying.classList.contains('open')) return;
  nowPlaying.style.transform = ''; nowPlaying.classList.remove('open'); document.body.classList.remove('np-open');
  if (!fromHistory) { try { history.back(); } catch (_) {} }
}
function closeAllOverlaysForNav() {
  closeSheet(); closeMenu(); closeDialog();
}
$('np-close').addEventListener('click', () => closeNowPlaying(false));
$('np-more').addEventListener('click', () => { if (currentTrack) openTrackSheet(currentTrack, null); });
(function () {
  let startY = 0, dy = 0, dragging = false, lastY = 0, lastT = 0, vel = 0;
  const isInteractive = x => x.closest('#np-bar, #np-vol-bar, button, #np-lyrics-view');
  nowPlaying.addEventListener('touchstart', e => {
    if (isInteractive(e.target)) return;
    startY = lastY = e.touches[0].clientY; dy = 0; vel = 0; lastT = performance.now(); dragging = true; nowPlaying.classList.add('dragging');
  }, { passive: true });
  nowPlaying.addEventListener('touchmove', e => {
    if (!dragging) return;
    const y = e.touches[0].clientY, now = performance.now();
    vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now;
    dy = Math.max(0, y - startY);
    nowPlaying.style.transform = `translateY(${dy}px)`;
    nowPlaying.style.borderRadius = Math.min(28, dy / 4) + 'px ' + Math.min(28, dy / 4) + 'px 0 0';
  }, { passive: true });
  nowPlaying.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false; nowPlaying.classList.remove('dragging'); nowPlaying.style.borderRadius = '';
    if (dy > 140 || vel > 0.7) closeNowPlaying(false); else nowPlaying.style.transform = '';
  });
})();

const lyricsCache = {};
async function fetchLyrics(title, artist) {
  const key = title + '|' + artist;
  if (lyricsCache[key]) return lyricsCache[key];
  if (!isApp) return { found: false };
  try {
    const res = await fetch(BASE + '/lyrics?title=' + encodeURIComponent(title) + '&artist=' + encodeURIComponent(artist));
    const data = await res.json();
    lyricsCache[key] = data;
    return data;
  } catch (e) { return { found: false }; }
}
let parsedSyncedLyrics = null;
function parseLRC(lrc) {
  if (!lrc) return null;
  const lines = lrc.split('\n').map(l => {
    const m = l.match(/^\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\](.*)$/);
    if (!m) return null;
    const time = parseInt(m[1]) * 60 + parseInt(m[2]) + (m[3] ? parseInt(m[3].padEnd(3, '0')) / 1000 : 0);
    return { time, text: m[4].trim() };
  }).filter(Boolean);
  return lines.length ? lines : null;
}
function resetLyricsView() {
  parsedSyncedLyrics = null; lastLyricsIdx = -1;
  $('np-lyrics-text').textContent = 'A carregar letra…';
  $('np-lyrics-text').className = '';
}
function syncLyricsHighlight(t) {
  if (!parsedSyncedLyrics || !nowPlaying.classList.contains('lyrics')) return;
  let idx = -1;
  for (let i = 0; i < parsedSyncedLyrics.length; i++) { if (parsedSyncedLyrics[i].time <= t) idx = i; else break; }
  if (idx === lastLyricsIdx) return;
  lastLyricsIdx = idx;
  const container = $('np-lyrics-text');
  container.querySelectorAll('.np-lyr-line').forEach((el, i) => el.classList.toggle('active', i === idx));
  const activeEl = container.querySelector('.np-lyr-line.active');
  if (activeEl) activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function loadNowPlayingLyrics(track) {
  const data = await fetchLyrics(track.title, track.artist);
  if (!currentTrack || currentTrack.id !== track.id) return;
  const container = $('np-lyrics-text');
  if (data.found && data.syncedLyrics) {
    parsedSyncedLyrics = parseLRC(data.syncedLyrics);
    if (parsedSyncedLyrics) {
      container.innerHTML = parsedSyncedLyrics.map(l => `<div class="np-lyr-line">${esc(l.text || '♪')}</div>`).join('');
      syncLyricsHighlight(audio.currentTime);
      return;
    }
  }
  if (data.found && data.plainLyrics) {
    parsedSyncedLyrics = null;
    container.textContent = data.plainLyrics;
    return;
  }
  parsedSyncedLyrics = null;
  container.textContent = 'Letra não disponível para esta música';
}
$('np-lyrics-toggle').addEventListener('click', () => {
  if (!currentTrack || currentTrack.isLocal) { toast('Letra indisponível'); return; }
  const on = !nowPlaying.classList.contains('lyrics');
  nowPlaying.classList.toggle('lyrics', on);
  if (on) loadNowPlayingLyrics(currentTrack);
});
function openLyricsSheet(track) {
  openSheet(`<div id="sheet-title">Letra</div><div id="sheet-lyrics-box" class="lyrics-box">${LOADER_HTML}</div>`);
  fetchLyrics(track.title, track.artist).then(data => {
    const el = document.querySelector('#sheet-lyrics-box');
    if (!el) return;
    if (data.found && (data.plainLyrics || data.syncedLyrics)) {
      const text = data.plainLyrics || (data.syncedLyrics || '').replace(/\[\d{2}:\d{2}[.:]\d{2,3}\]/g, '');
      el.textContent = text;
    } else {
      el.innerHTML = `<div class="empty-state"><ion-icon name="text-outline"></ion-icon><div class="es-t">Letra não encontrada</div><div class="es-s">Não conseguimos encontrar a letra desta música.</div></div>`;
    }
  });
}

function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: track.title || '', artist: track.artist || '', artwork: track.thumbnail ? [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }] : [] });
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  navigator.mediaSession.setActionHandler('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
}

function fmtTime(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s / 60), sec = Math.floor(s % 60); return m + ':' + String(sec).padStart(2, '0'); }
function esc(str) { return (str == null ? '' : String(str)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

audio.volume = 1;
applyTheme();
syncDominantSwitch();
renderCategories();
renderRecents();
renderHomeFilters();
applyLanguage();
syncDeviceBtn();
loadHomeFeed();
</script>
