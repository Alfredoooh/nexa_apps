<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Vibely Music</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
  :root {
    --bg: #FFFFFF;
    --surface: #F5F5F5;
    --surface2: #ECECEE;
    --floating: #FFFFFF;
    --popup: #FFFFFF;
    --text: #1C1C1E;
    --text2: #6E6E73;
    --accent: #2596be;
    --accent-rgb: 37,150,190;
    --on-accent: #FFFFFF;
    --accent-container: rgba(37,150,190,0.16);
    --border: #ECECEE;
    --outline: #DCDCE0;
    --danger: #FF3B30;
    --shadow-strong: 0 2px 10px rgba(0,0,0,0.08);
    --popup-shadow: 0 6px 24px rgba(0,0,0,0.10), 0 0 0 1px rgba(0,0,0,0.04);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --top-extra: 46px;
    --emphasized: cubic-bezier(0.2, 0, 0, 1);
    --emphasized-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
    --emphasized-accel: cubic-bezier(0.3, 0, 0.8, 0.15);
    --np-c1: #2596be;
    --np-c2: #16607a;
  }
  [data-theme="dark"] {
    --bg: #0D0D0D;
    --surface: #1F1F1F;
    --surface2: #2A2A2C;
    --floating: #1F1F1F;
    --popup: #1F1F1F;
    --text: #F2F2F2;
    --text2: #9B9B9F;
    --on-accent: #FFFFFF;
    --border: #3A3A3C;
    --outline: #48484A;
    --danger: #FF453A;
    --shadow-strong: 0 4px 16px rgba(0,0,0,0.35);
    --popup-shadow: 0 8px 28px rgba(0,0,0,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
  html, body {
    height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .3s ease, color .3s ease;
  }
  button { font-family:inherit; cursor:pointer; }
  ion-icon { pointer-events:none; }

  .tap { transition:transform .2s var(--emphasized), opacity .2s ease; }
  .tap:active { transform:scale(.95); opacity:.85; }

  #app { position:relative; display:flex; flex-direction:column; height:100vh; background:var(--bg); overflow:hidden; }

  /* ─── LOADER NATIVO ─── */
  .loader { display:flex; align-items:center; justify-content:center; padding:44px 0; }
  .loader svg { width:36px; height:36px; animation:loaderRotate 1.4s linear infinite; transform-origin:center; }
  .loader circle {
    fill:none; stroke:var(--accent); stroke-width:3.4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0;
    animation:loaderDash 1.4s ease-in-out infinite;
  }
  @keyframes loaderRotate { 100% { transform:rotate(360deg); } }
  @keyframes loaderDash {
    0%   { stroke-dasharray:1, 200; stroke-dashoffset:0; }
    50%  { stroke-dasharray:90, 200; stroke-dashoffset:-35px; }
    100% { stroke-dasharray:90, 200; stroke-dashoffset:-124px; }
  }
  .btn-loader { width:22px; height:22px; animation:loaderRotate 1.4s linear infinite; }
  .btn-loader circle {
    fill:none; stroke:currentColor; stroke-width:4; stroke-linecap:round;
    stroke-dasharray:1, 200; stroke-dashoffset:0;
    animation:loaderDash 1.4s ease-in-out infinite;
  }

  /* ─── APPBAR (título muda por aba) ─── */
  #topbar {
    position:relative; z-index:20; flex-shrink:0;
    padding:calc(var(--safe-top) + var(--top-extra)) 20px 12px;
    display:flex; align-items:center; gap:10px;
  }
  #page-title {
    flex:1; min-width:0; font-size:30px; font-weight:800; letter-spacing:-0.9px; line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #page-title.swap { animation:titleIn .3s var(--emphasized-decel) both; }
  @keyframes titleIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .top-btn {
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:var(--surface); color:var(--text); border:0;
    display:flex; align-items:center; justify-content:center;
  }
  .top-btn ion-icon { font-size:20px; }

  /* ─── CONTEÚDO ─── */
  #main-content {
    position:relative; z-index:1; flex:1; overflow-y:auto; overflow-x:hidden;
    padding-top:4px; padding-bottom:200px; -webkit-overflow-scrolling:touch;
    scrollbar-width:none; overscroll-behavior-y:contain;
  }
  #main-content::-webkit-scrollbar { display:none; }

  .view { display:none; }
  .view.active { display:block; animation:viewIn .32s var(--emphasized-decel) both; }
  @keyframes viewIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

  .section { margin-bottom:26px; }
  .section-head { display:flex; align-items:center; justify-content:space-between; padding:0 20px; margin-bottom:12px; }
  .section-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .section-sub { font-size:13px; color:var(--text2); font-weight:600; }

  /* ─── PULL TO REFRESH ─── */
  #ptr {
    position:absolute; left:0; right:0; top:0; height:0; z-index:5; overflow:hidden;
    display:flex; align-items:flex-end; justify-content:center;
    transition:height .25s var(--emphasized);
  }
  #ptr.pulling { transition:none; }
  #ptr .loader { padding:10px 0; }
  #ptr .loader svg { width:28px; height:28px; }

  /* ─── FILTROS ─── */
  #home-filters { display:flex; gap:8px; padding:2px 20px 16px; overflow-x:auto; scrollbar-width:none; }
  #home-filters::-webkit-scrollbar { display:none; }
  .fchip {
    padding:9px 18px; border-radius:999px; border:0; flex-shrink:0;
    background:var(--surface); color:var(--text); font-size:14px; font-weight:600;
    transition:background .25s ease, color .25s ease;
  }
  .fchip.active { background:var(--accent); color:var(--on-accent); }

  /* ─── CARROSSEL DO FEED ─── */
  .scroll-row {
    display:flex; gap:14px; overflow-x:auto; padding:2px 20px 6px;
    scrollbar-width:none; scroll-snap-type:x proximity; scroll-padding-left:20px;
  }
  .scroll-row::-webkit-scrollbar { display:none; }
  .feed-card { flex:0 0 144px; width:144px; scroll-snap-align:start; animation:fadeUp .4s var(--emphasized-decel) both; }
  .feed-card .thumb { width:144px; height:144px; border-radius:8px; overflow:hidden; background:var(--surface2); }
  .feed-card img { width:100%; height:100%; object-fit:cover; display:block; }
  .feed-card .card-title {
    font-size:14px; font-weight:700; margin-top:10px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.25;
  }
  .feed-card .card-sub { font-size:13px; color:var(--text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* seção "Mais como {artista}" com avatar */
  .artist-head { display:flex; align-items:center; gap:12px; padding:0 20px; margin-bottom:12px; }
  .artist-avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .artist-head .lbl { font-size:13px; color:var(--text2); font-weight:600; }
  .artist-head .nm { font-size:22px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ─── LISTAS PLANAS ─── */
  #recent-list, #pl-tracks, #sp-results { display:flex; flex-direction:column; }
  .track-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .track-row:active { background:var(--surface); }
  .track-row.playing .tr-title { color:var(--accent); }
  .tr-thumb { width:56px; height:56px; border-radius:4px; object-fit:cover; background:var(--surface2); flex-shrink:0; }
  .tr-info { flex:1; min-width:0; }
  .tr-title { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-sub { font-size:14px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tr-more {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .tr-more ion-icon { font-size:22px; }
  .tr-more:active { background:var(--surface); }

  /* ─── PESQUISAR (aba) ─── */
  #search-fake {
    display:flex; align-items:center; gap:10px; margin:0 20px 6px;
    height:52px; padding:0 18px; border-radius:999px; background:var(--surface);
    color:var(--text2); font-size:16px; font-weight:500; border:0; width:calc(100% - 40px); text-align:left;
  }
  #search-fake ion-icon { font-size:21px; flex-shrink:0; }
  #cat-title { font-size:22px; font-weight:800; letter-spacing:-0.5px; padding:18px 20px 14px; }
  #cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 20px; }
  .cat-card {
    position:relative; height:96px; border-radius:10px; overflow:hidden; border:0; text-align:left;
    color:#fff; padding:12px 14px; font-size:17px; font-weight:800; letter-spacing:-0.2px;
    animation:fadeUp .4s var(--emphasized-decel) both;
  }
  .cat-card ion-icon { position:absolute; right:-6px; bottom:-8px; font-size:64px; opacity:.30; transform:rotate(-18deg); }

  /* ─── PLAYLISTS ─── */
  .pl-row {
    display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px;
    animation:fadeUp .35s var(--emphasized-decel) both; transition:background .15s ease;
  }
  .pl-row:active { background:var(--surface); }
  .pl-cover {
    width:64px; height:64px; border-radius:6px; overflow:hidden; background:var(--surface2); flex-shrink:0;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; align-items:center; justify-items:center;
  }
  .pl-cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .pl-cover img.full { grid-column:1 / 3; grid-row:1 / 3; }
  .pl-cover ion-icon { grid-column:1 / 3; grid-row:1 / 3; font-size:28px; color:var(--text2); }
  .pl-info { flex:1; min-width:0; }
  .pl-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-count { font-size:14px; color:var(--text2); margin-top:2px; }
  #pl-actions { display:flex; align-items:center; gap:12px; padding:2px 20px 14px; }
  #pl-detail-count { color:var(--text2); font-size:14px; flex:1; }
  .btn-fill {
    height:44px; padding:0 22px; border-radius:999px; border:0; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
  }
  .btn-fill ion-icon { font-size:20px; }
  .btn-tonal {
    height:44px; padding:0 20px; border-radius:999px; border:0; background:var(--surface); color:var(--text);
    display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700;
  }
  .btn-tonal ion-icon { font-size:20px; color:var(--accent); }
  #pl-new-wrap { padding:0 20px 14px; }

  /* ─── PÁGINAS PUSH (navegação nativa) ─── */
  .page {
    position:fixed; inset:0; z-index:60; background:var(--bg); overflow:hidden;
    display:flex; flex-direction:column;
    transform:translateX(100%); visibility:hidden;
    transition:transform .35s var(--emphasized-decel), visibility 0s linear .35s;
    box-shadow:-8px 0 24px rgba(0,0,0,.10);
  }
  .page.open { transform:none; visibility:visible; transition:transform .35s var(--emphasized-decel), visibility 0s; }
  .page.leaving { transform:translateX(100%); visibility:visible; transition:transform .28s var(--emphasized-accel), visibility 0s linear .28s; }
  .page-bar {
    flex-shrink:0; padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;
    display:flex; align-items:center; gap:4px;
  }
  .page-back {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .page-back ion-icon { font-size:26px; }
  .page-back:active { background:var(--surface); }
  .page-title { font-size:26px; font-weight:800; letter-spacing:-0.6px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .page-body { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:140px; }
  .page-body::-webkit-scrollbar { display:none; }

  /* página de pesquisa */
  #sp-bar { display:flex; align-items:center; gap:4px; }
  #sp-wrap {
    flex:1; min-width:0; display:flex; align-items:center; gap:8px;
    height:48px; padding:0 4px 0 16px; border-radius:999px; background:var(--surface);
  }
  #sp-wrap > ion-icon { font-size:20px; color:var(--text2); flex-shrink:0; }
  #sp-input {
    flex:1; min-width:0; height:100%; border:0; outline:0; background:transparent;
    color:var(--text); font-size:16px; font-weight:500; font-family:inherit;
    -webkit-appearance:none; appearance:none;
  }
  #sp-input::placeholder { color:var(--text2); font-weight:500; }
  #sp-input::-webkit-search-cancel-button, #sp-input::-webkit-search-decoration { -webkit-appearance:none; display:none; }
  #sp-clear {
    width:40px; height:40px; border-radius:50%; border:0; flex-shrink:0; background:transparent; color:var(--text2);
    display:none; align-items:center; justify-content:center;
  }
  #sp-clear.show { display:flex; }
  #sp-clear ion-icon { font-size:22px; }
  #sp-hist-head { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 4px; }
  #sp-hist-head .section-title { font-size:18px; }
  #sp-hist-clear { border:0; background:transparent; color:var(--accent); font-size:14px; font-weight:700; padding:8px; }
  .sug-row { display:flex; align-items:center; gap:16px; padding:12px 8px 12px 20px; transition:background .15s ease; }
  .sug-row:active { background:var(--surface); }
  .sug-row ion-icon { font-size:20px; color:var(--text2); flex-shrink:0; }
  .sug-row .sug-t { flex:1; min-width:0; font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sug-row .sug-fill { width:40px; height:40px; border:0; background:transparent; display:flex; align-items:center; justify-content:center; }
  #sp-count { padding:6px 20px 8px; font-size:13px; color:var(--text2); font-weight:600; }

  /* ─── SETTINGS ─── */
  .set-group-title { font-size:13px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--accent); padding:20px 20px 6px; }
  .set-row {
    width:100%; display:flex; align-items:center; gap:16px; padding:14px 20px; border:0; background:transparent;
    color:var(--text); text-align:left; transition:background .15s ease;
  }
  .set-row:active { background:var(--surface); }
  .set-row > ion-icon { font-size:24px; color:var(--text2); flex-shrink:0; }
  .set-txt { flex:1; min-width:0; }
  .set-t { font-size:16px; font-weight:600; }
  .set-s { font-size:13px; color:var(--text2); margin-top:2px; }
  .set-val { font-size:14px; color:var(--text2); font-weight:600; flex-shrink:0; max-width:40%; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .set-chev { font-size:18px !important; color:var(--text2); opacity:.7; }
  .set-sep { height:1px; background:var(--border); margin:6px 20px; }
  .dev-row { display:flex; align-items:center; gap:16px; padding:12px 20px; }
  .dev-row > ion-icon { font-size:24px; color:var(--accent); }
  .dev-row .set-txt { flex:1; }
  .dev-row .dev-btn { height:36px; padding:0 16px; border-radius:999px; border:0; background:var(--accent-container); color:var(--accent); font-size:14px; font-weight:700; }
  .dl-row { display:flex; align-items:center; gap:14px; padding:8px 8px 8px 20px; }
  .dl-row .tr-more { color:var(--danger); }

  /* ─── MINI PLAYER ─── */
  #mini-player {
    position:fixed; left:12px; right:12px; z-index:70;
    bottom:calc(var(--safe-bottom) + 84px);
    height:74px; border-radius:999px; padding:0 10px 0 9px;
    display:flex; align-items:center; gap:12px; overflow:hidden;
    background:var(--floating); border:1px solid var(--border);
    box-shadow:var(--shadow-strong);
    transform:translateY(140px); opacity:0; pointer-events:none;
    transition:transform .5s var(--emphasized-decel), opacity .3s ease, bottom .35s var(--emphasized);
  }
  #mini-player.active { transform:none; opacity:1; pointer-events:auto; }
  body.on-page #mini-player { bottom:calc(var(--safe-bottom) + 14px); }
  #mini-tint {
    position:absolute; inset:0; z-index:0; pointer-events:none; opacity:.22;
    background:linear-gradient(115deg, var(--np-c1), var(--np-c2)); transition:background .9s ease;
  }
  #mini-progress { position:absolute; left:0; bottom:0; height:3px; width:0%; z-index:1; background:var(--accent); border-radius:0 3px 3px 0; }
  #mini-player > *:not(#mini-tint):not(#mini-progress) { position:relative; z-index:2; }

  .disc {
    position:relative; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:#111; box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .disc img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .disc::before {
    content:''; position:absolute; inset:0; border-radius:50%; z-index:2; pointer-events:none;
    background:repeating-radial-gradient(circle at center, rgba(0,0,0,0) 0 3px, rgba(0,0,0,.10) 3px 4px);
  }
  .disc::after {
    content:''; position:absolute; z-index:3; top:50%; left:50%; transform:translate(-50%,-50%);
    width:22%; height:22%; border-radius:50%; background:var(--bg);
    border:2px solid rgba(255,255,255,.55); box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
  }
  .spin { animation:discSpin 9s linear infinite; animation-play-state:paused; }
  .spin.running { animation-play-state:running; }
  @keyframes discSpin { to { transform:rotate(360deg); } }

  #mini-disc { width:56px; height:56px; }
  #mini-info { flex:1; min-width:0; }
  #mini-title { font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:-0.2px; }
  #mini-artist { font-size:12.5px; color:var(--text2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-ctrl { display:flex; align-items:center; gap:4px; }
  .mini-btn {
    width:44px; height:44px; border-radius:50%; border:0; background:transparent; color:var(--text);
    display:flex; align-items:center; justify-content:center;
  }
  .mini-btn ion-icon { font-size:24px; }
  #mini-play { background:var(--accent); color:var(--on-accent); }
  #mini-play ion-icon { font-size:22px; }

  /* ─── BOTTOM BAR ─── */
  #bottom-bar {
    position:fixed; left:50%; z-index:50;
    bottom:calc(var(--safe-bottom) + 14px);
    transform:translateX(-50%);
    width:calc(100% - 40px); max-width:420px; height:62px;
    border-radius:999px; padding:6px;
    display:flex; align-items:center;
    background:var(--floating); border:1px solid var(--border);
    box-shadow:var(--shadow-strong);
    transition:transform .45s var(--emphasized), opacity .3s ease;
  }
  body.on-page #bottom-bar { transform:translate(-50%, 140px); opacity:0; pointer-events:none; }
  #bb-pill {
    position:absolute; top:6px; bottom:6px; left:6px; border-radius:999px; z-index:0;
    background:var(--accent-container);
    transition:transform .4s var(--emphasized), width .4s var(--emphasized), background .4s ease;
    will-change:transform;
  }
  .bb-item {
    position:relative; z-index:1; flex:1; height:100%; border:0; background:transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    color:var(--text2); transition:color .25s ease;
  }
  .bb-item ion-icon { font-size:23px; }
  .bb-item span { font-size:10.5px; font-weight:700; letter-spacing:.1px; }
  .bb-item.active { color:var(--accent); }

  /* ─── MENU POPUP ─── */
  #menu-overlay { position:fixed; inset:0; z-index:90; visibility:hidden; background:rgba(0,0,0,0); transition:background .2s linear, visibility 0s linear .2s; }
  #menu-overlay.open { visibility:visible; background:rgba(0,0,0,.32); transition:background .2s linear, visibility 0s; }
  #menu-pop {
    position:absolute; top:calc(var(--safe-top) + var(--top-extra) - 4px); right:14px; width:290px;
    padding:8px 0; border-radius:16px; transform-origin:top right;
    background:var(--popup); box-shadow:var(--popup-shadow);
    transform:scale(.85); opacity:0;
    transition:transform .15s var(--emphasized-accel), opacity .1s linear;
  }

  /* ─── BOTTOM SHEET ─── */

</style>

// ═══════════════════════════════════════════════════════════

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

const DEFAULTS = {

  shareCast: true,
};
let settings = Object.assign({}, DEFAULTS, load('settings', {}));
function setSetting(k, v) { settings[k] = v; save('settings', settings); }

// ═══════════════════════════════════════════════════════════
//  TRADUÇÕES
// ═══════════════════════════════════════════════════════════
const I18N = {
  pt: { home:'Início', search:'Pesquisar', playlists:'Playlists', settings:'Definições', forYou:'Para ti', recents:'Recentes', browseAll:'Procurar tudo',

  en: { home:'Home', search:'Search', playlists:'Playlists', settings:'Settings', forYou:'For you', recents:'Recent', browseAll:'Browse all',
        whatListen:'What do you want to listen to?', newPl:'New playlist', results:'results', history:'Recent searches', clear:'Clear' },
  es: { home:'Inicio', search:'Buscar', playlists:'Listas', settings:'Ajustes', forYou:'Para ti', recents:'Recientes', browseAll:'Explorar todo',
        whatListen:'¿Qué quieres escuchar?', newPl:'Nueva lista', results:'resultados', history:'Búsquedas recientes', clear:'Borrar' },
  fr: { home:'Accueil', search:'Rechercher', playlists:'Playlists', settings:'Réglages', forYou:'Pour toi', recents:'Récents', browseAll:'Tout parcourir',
        whatListen:'Que veux-tu écouter ?', newPl:'Nouvelle playlist', results:'résultats', history:'Recherches récentes', clear:'Effacer' },
};
const LANGS = [
  { id:'pt', name:'Português' }, { id:'en', name:'English' }, { id:'es', name:'Español' }, { id:'fr', name:'Français' },
];
const t = k => (I18N[settings.lang] && I18N[settings.lang][k]) || I18N.pt[k] || k;

function applyLanguage() {
  document.documentElement.lang = settings.lang;
  document.querySelectorAll('.bb-item[data-tab] span').forEach(sp => {
    sp.textContent = t(sp.parentElement.dataset.tab);
  });
  $('search-fake').lastChild.textContent = t('whatListen');
  $('sp-input').placeholder = t('whatListen');
  $('cat-title').textContent = t('browseAll');
  $('pl-add').lastChild.textContent = t('newPl');
  document.querySelector('#recent-section .section-title').textContent = t('recents');
  setPageTitle(activeTab);
}

// ═══════════════════════════════════════════════════════════
//  ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════
let dark = false;
let albumRgb = null;
let currentTrack = null;
let currentQueue = [];
let currentQueueIndex = 0;
let activeTab = 'home';

// ═══════════════════════════════════════════════════════════
//  COR PRIMÁRIA
// ═══════════════════════════════════════════════════════════
function setAccent(c) {
  const [r, g, b] = c;
  const root = document.documentElement.style;
  root.setProperty('--accent', `rgb(${r},${g},${b})`);
  root.setProperty('--accent-rgb', `${r},${g},${b}`);
  root.setProperty('--accent-container', `rgba(${r},${g},${b},${dark ? 0.24 : 0.16})`);
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  root.setProperty('--on-accent', lum > 175 ? '#111111' : '#FFFFFF');
}
function adaptForTheme(c) {
  const lum = 0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2];
  if (dark && lum < 110) return c.map(v => Math.min(255, Math.round(v + (110 - lum) * 1.3)));
  if (!dark && lum > 190) return c.map(v => Math.round(v * 0.72));
  return c;
}
function refreshAccent() {
  if (settings.dominant && albumRgb) setAccent(adaptForTheme(albumRgb));
  else setAccent(DEFAULT_ACCENT);
}

// ═══════════════════════════════════════════════════════════
//  NAVEGAÇÃO PUSH (pilha de páginas + botão voltar do Android)
// ═══════════════════════════════════════════════════════════
const pageStack = [];      // ids das páginas abertas, da mais antiga à mais recente
const pageHooks = {};      // callbacks ao abrir/fechar

function syncPageState() {
  document.body.classList.toggle('on-page', pageStack.length > 0);
}

function pushPage(id, opts) {
  opts = opts || {};
  if (pageStack[pageStack.length - 1] === id) return;
  const el = $(id);
  el.classList.remove('leaving');
  el.classList.add('open');
  pageStack.push(id);
  syncPageState();
  if (!opts.fromPop) history.pushState({ page: id, depth: pageStack.length }, '');
  if (pageHooks[id] && pageHooks[id].open) pageHooks[id].open();
}

function popPage(opts) {
  opts = opts || {};
  if (!pageStack.length) return false;
  const id = pageStack.pop();
  const el = $(id);
  el.classList.remove('open');
  el.classList.add('leaving');
  setTimeout(() => el.classList.remove('leaving'), 300);
  syncPageState();
  if (pageHooks[id] && pageHooks[id].close) pageHooks[id].close();
  // se foi um clique no botão da UI (não do sistema), consome a entrada de histórico
  if (!opts.fromHistory) { try { history.back(); } catch (_) {} }
  return true;
}

// Ordem de fecho ao carregar em "voltar": overlays → player → páginas → início
function handleBack() {
  if (dialogOverlay.classList.contains('open')) { closeDialog(); return true; }
  if (sheetOverlay.classList.contains('open')) { closeSheet(); return true; }
  if (menuOverlay.classList.contains('open')) { closeMenu(); return true; }
  if (nowPlaying.classList.contains('open')) { closeNowPlaying(); return true; }
  if (pageStack.length) { popPage({ fromHistory: true }); return true; }
  if (activeTab !== 'home') { switchTab('home'); return true; }
  return false; // nada para fechar: o Android pode sair da app
}

window.addEventListener('popstate', () => {
  // o sistema já recuou a entrada de histórico: fecha só o visual
  if (dialogOverlay.classList.contains('open')) { closeDialog(); history.pushState({ keep: 1 }, ''); return; }
  if (sheetOverlay.classList.contains('open')) { closeSheet(); history.pushState({ keep: 1 }, ''); return; }
  if (menuOverlay.classList.contains('open')) { closeMenu(); history.pushState({ keep: 1 }, ''); return; }
  if (nowPlaying.classList.contains('open')) { closeNowPlaying(true); history.pushState({ keep: 1 }, ''); return; }
  if (pageStack.length) { popPage({ fromHistory: true }); return; }
  if (activeTab !== 'home') { switchTab('home'); history.pushState({ keep: 1 }, ''); return; }
});
// Ponte para o Android chamar manualmente (onBackPressed → evaluateJavascript)
window.onNativeBack = function () { return handleBack(); };
// entrada base para o popstate ter sempre onde recuar
history.replaceState({ base: 1 }, '');
history.pushState({ keep: 1 }, '');

document.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => popPage()));

      else if (act === 'next') { closeSheet(); queueNext(track); }
      else if (act === 'addpl') { openPlaylistPicker(track); }

  currentQueueIndex = idx >= 0 ? idx : 0;
  currentQueue.splice(currentQueueIndex + 1, 0, track);
  toast('Vai tocar a seguir');

// ═══════════════════════════════════════════════════════════
//  API DE PESQUISA (dinâmica: várias consultas em paralelo)
// ═══════════════════════════════════════════════════════════
const searchCache = {};
async function apiSearch(q) {
  if (searchCache[q]) return searchCache[q];
  const res = await fetch(BASE + '/search?q=' + encodeURIComponent(q));
  const data = await res.json();
  const arr = Array.isArray(data) ? data : [];
  if (arr.length) searchCache[q] = arr;
  return arr;
}
function normTitle(s) { return (s || '').toLowerCase().replace(/[\(\[].*?[\)\]]/g, '').replace(/[^a-z0-9à-ú ]/gi, '').replace(/\s+/g, ' ').trim(); }

// Junta várias consultas, remove duplicados (por id e por título) e ordena por relevância
async function deepSearch(q, minResults) {
  minResults = minResults || 24;
  const variants = [q, q + ' official audio', q + ' músicas', q + ' mix', q + ' hits', q + ' live'];
  const first = await apiSearch(q).catch(() => []);
  let batches = [first];
  if (first.length < minResults) {
    const rest = await Promise.all(variants.slice(1).map(v => apiSearch(v).catch(() => [])));
    batches = batches.concat(rest);
  }
  const seenId = new Set(), seenTitle = new Set(), out = [];
  const ql = q.toLowerCase();
  batches.forEach((list, bi) => {
    list.forEach((tr, idx) => {
      if (!tr || !tr.id || seenId.has(tr.id)) return;
      const nt = normTitle(tr.title);
      if (seenTitle.has(nt)) return;
      seenId.add(tr.id); seenTitle.add(nt);
      const hay = ((tr.title || '') + ' ' + (tr.artist || '')).toLowerCase();
      let score = 100 - bi * 12 - idx;
      if (hay.includes(ql)) score += 30;
      ql.split(/\s+/).forEach(w => { if (w.length > 2 && hay.includes(w)) score += 6; });
      out.push({ tr, score });
    });
  });
  out.sort((a, b) => b.score - a.score);
  return out.map(o => o.tr);
}

let homeFilter = 'all';
let homeSeq = 0;

function shuffleArr(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function renderHomeFilters() {
  const box = $('home-filters');
  box.innerHTML = HOME_FILTERS.map(f => `<button class="fchip${f.id === homeFilter ? ' active' : ''}" data-id="${f.id}">${f.label}</button>`).join('');
  box.querySelectorAll('.fchip').forEach(b => {
    b.addEventListener('click', () => {
      if (homeFilter === b.dataset.id) return;
      homeFilter = b.dataset.id;
      renderHomeFilters();
      loadHomeFeed();
    });
  });
}

// devolve a lista de secções a carregar, sempre com um toque de aleatoriedade
function buildSections() {
  if (homeFilter !== 'all') {
    const f = HOME_FILTERS.find(x => x.id === homeFilter);
    return f.q.map((q, i) => ({ kind: 'plain', title: i === 0 ? f.label + ' em alta' : 'Mais de ' + f.label, q }));
  }
  const sections = [];
  const arts = topArtists(3);
  arts.forEach((a, i) => sections.push({ kind: 'artist', artist: a, q: a.name + (i % 2 ? ' best songs' : ' top songs') }));
  const yearTag = new Date().getFullYear();
  sections.push({ kind: 'plain', title: 'Recomendações para hoje', q: 'top music ' + yearTag });
  const picks = shuffleArr(GENRES).slice(0, arts.length ? 2 : 3);
  picks.forEach(g => sections.push({ kind: 'plain', title: 'Descobre ' + g.replace(/ hits| chill/, ''), q: g + ' ' + yearTag }));
  return sections;
}

function sectionHTML(s, data, idx) {
  const cards = data.map((tr, i) => `
    <div class="feed-card tap" data-i="${i}" style="animation-delay:${i * 40}ms">
      <div class="thumb"><img src="${tr.thumbnail}" loading="lazy" onerror="this.style.visibility='hidden'"/></div>
      <div class="card-title">${esc(tr.title)}</div>
      <div class="card-sub">${esc(tr.artist)}</div>
    </div>`).join('');
  const head = s.kind === 'artist'
    ? `<div class="artist-head"><img class="artist-avatar" src="${s.artist.thumb || ''}" onerror="this.style.visibility='hidden'"/><div style="min-width:0"><div class="lbl">Mais como</div><div class="nm">${esc(s.artist.name)}</div></div></div>`
    : `<div class="section-head"><div class="section-title">${esc(s.title)}</div></div>`;
  return `<div class="section">${head}<div class="scroll-row" data-list="${idx}">${cards}</div></div>`;
}

async function loadHomeFeed(silent) {
  const feed = $('home-feed');
  if (!isApp) { feed.innerHTML = ''; return; }
  const seq = ++homeSeq;
  if (!silent) feed.innerHTML = LOADER_HTML;
  const sections = buildSections();
  try {
    const results = await Promise.all(sections.map(s => apiSearch(s.q).catch(() => [])));
    if (seq !== homeSeq) return;
    let html = '';
    const lists = [];
    sections.forEach((s, i) => {
      let data = results[i] || [];
      if (s.kind === 'artist') {
        // evita repetir só o artista: mistura faixas dele com relacionadas
        const seen = new Set();
        data = data.filter(x => x.id && !seen.has(x.id) && seen.add(x.id));
      }
      data = shuffleArr(data.slice(0, 16)).slice(0, 12);
      if (!data.length) return;
      lists.push(data);
      html += sectionHTML(s, data, lists.length - 1);
    });
    feed.innerHTML = html;
    feed.querySelectorAll('.scroll-row').forEach(row => {
      const data = lists[+row.dataset.list];
      row.querySelectorAll('.feed-card').forEach(card => {
        card.addEventListener('click', () => { const i = +card.dataset.i; currentQueue = data; play(data[i], i); });
      });
    });
  } catch (e) { if (seq === homeSeq && !silent) feed.innerHTML = ''; }
}

// ─── Pull-to-refresh no Início ───
(function () {
  const sc = $('main-content'), ptr = $('ptr');
  let startY = 0, pull = 0, active = false, busy = false;
  sc.addEventListener('touchstart', e => {
    if (activeTab !== 'home' || sc.scrollTop > 0 || busy) return;
    startY = e.touches[0].clientY; active = true; pull = 0;
  }, { passive: true });
  sc.addEventListener('touchmove', e => {
    if (!active) return;
    pull = Math.max(0, e.touches[0].clientY - startY);
    if (pull > 0) { ptr.classList.add('pulling'); ptr.style.height = Math.min(70, pull * .45) + 'px'; }
  }, { passive: true });
  sc.addEventListener('touchend', async () => {
    if (!active) return;
    active = false;
    ptr.classList.remove('pulling');
    if (pull > 110) {
      busy = true;
      ptr.style.height = '56px';
      Object.keys(searchCache).forEach(k => delete searchCache[k]);
      await loadHomeFeed(true);
      ptr.style.height = '0px';
      busy = false;
    } else ptr.style.height = '0px';
  });
})();

function hashColor(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h % 360; }
function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
}
function extractDominant(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 24;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, 24, 24);
        const px = ctx.getImageData(0, 0, 24, 24).data;
        const buckets = {};
        for (let i = 0; i < px.length; i += 4) {
          const r = px[i], g = px[i + 1], b = px[i + 2];
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          if (max < 40 || min > 225 || sat < 0.22) continue;
          const key = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5);
          const w = 1 + sat * 2;
          if (!buckets[key]) buckets[key] = { n: 0, r: 0, g: 0, b: 0 };
          buckets[key].n += w; buckets[key].r += r * w; buckets[key].g += g * w; buckets[key].b += b * w;
        }
        let best = null;
        for (const k in buckets) if (!best || buckets[k].n > best.n) best = buckets[k];
        if (!best) return resolve(null);
        resolve([Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.b / best.n)]);
      } catch (e) { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
const shade = ([r, g, b], f) => [Math.round(r * f), Math.round(g * f), Math.round(b * f)];
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;

async function applyAlbumColor(track) {
  let base = track.thumbnail ? await extractDominant(track.thumbnail) : null;
  if (!base) base = hslToRgb(hashColor(track.id || track.title || 'x'), 62, 52);
  const lum = 0.299 * base[0] + 0.587 * base[1] + 0.114 * base[2];
  if (lum < 70) base = base.map(v => Math.min(255, Math.round(v + (70 - lum) * 1.4)));
  albumRgb = base;
  const root = document.documentElement.style;
  root.setProperty('--np-c1', rgb(base));
  root.setProperty('--np-c2', rgb(shade(base, 0.62)));
  refreshAccent();
}

// ═══════════════════════════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════════════════════════
let audio = new Audio();
audio.preload = 'auto';
let shuffleOn = false, repeatMode = 0, playToken = 0, retryCount = 0;
const MAX_RETRIES = 3;
const miniPlayer = $('mini-player');
const nowPlaying = $('now-playing');

function setPlayIcon(name) {
  const html = name === 'loading' ? BTN_LOADER_HTML : `<ion-icon name="${name}"></ion-icon>`;
  $('mini-play').innerHTML = html;
  $('np-play').innerHTML = html;
}
function setSpinning(on) {
  document.querySelectorAll('.spin').forEach(el => el.classList.toggle('running', on));
  nowPlaying.classList.toggle('playing', on);
}

async function play(track, queueIndex) {
  if (!isApp) { toast('Player só disponível no app Vibely'); return; }
  const token = ++playToken;
  retryCount = 0;
  currentTrack = track;
  if (queueIndex !== undefined) currentQueueIndex = queueIndex;

  $('mini-title').textContent = track.title || '—';
  $('mini-artist').textContent = track.artist || '—';
  $('np-title').textContent = track.title || '—';
  $('np-artist').textContent = track.artist || '—';
  $('mini-img').src = track.thumbnail || '';
  $('np-img').src = track.thumbnail || '';
  miniPlayer.classList.add('active');
  setPlayIcon('loading');
  $('mini-progress').style.width = '0%';
  $('np-bar-fill').style.width = '0%';
  $('np-cur').textContent = '0:00';
  $('np-tot').textContent = fmtTime(track.duration || 0);

  addRecent(track);
  bumpArtist(track);
  renderRecents();
  markPlaying();
  updateMediaSession(track);
  applyAlbumColor(track);
  await startStream(track, token);
}

async function streamFor(id) {
  const q = settings.saveData ? 'low' : settings.quality;
  const res = await fetch(BASE + '/stream?id=' + encodeURIComponent(id) + '&quality=' + encodeURIComponent(q));
  return (await res.json()).streamUrl;
}
async function startStream(track, token) {
  try {
    const streamUrl = await streamFor(track.id);
    if (token !== playToken) return;
    if (!streamUrl) throw new Error('sem stream');
    audio.pause(); audio.src = streamUrl; audio.load();
    await audio.play();
  } catch (e) {
    if (token !== playToken) return;
    console.error('Erro stream:', e);
    retryOrFail(token);
  }
}
function retryOrFail(token) {
  if (token !== playToken || !currentTrack) return;
  if (retryCount >= MAX_RETRIES) { setPlayIcon('play'); setSpinning(false); toast('Não foi possível tocar esta faixa'); return; }
  retryCount++;
  const resumeAt = audio.currentTime || 0;
  setPlayIcon('loading');
  setTimeout(async () => {
    if (token !== playToken) return;
    try {
      const streamUrl = await streamFor(currentTrack.id);
      if (token !== playToken || !streamUrl) return;
      audio.src = streamUrl; audio.load();
      if (resumeAt > 0) {
        audio.addEventListener('loadedmetadata', function once() {
          audio.removeEventListener('loadedmetadata', once);
          try { audio.currentTime = resumeAt; } catch (_) {}
        });
      }
      await audio.play();
    } catch (e) { retryOrFail(token); }
  }, 800 * retryCount);
}

// quando a fila acaba e "reprodução automática" está ligada, continua com músicas relacionadas
async function autoContinue() {
  if (!settings.autoplay || !currentTrack || !isApp) { setPlayIcon('play'); setSpinning(false); return; }
  try {
    const res = await fetch(BASE + '/related?id=' + encodeURIComponent(currentTrack.id));
    const data = await res.json();
    if (Array.isArray(data) && data.length) {
      currentQueue = data; currentQueueIndex = 0;
      play(data[0], 0);
      return;
    }
  } catch (_) {}
  setPlayIcon('play'); setSpinning(false);
}

function nextTrack(auto) {
  if (!currentQueue.length) return;
  if (auto && repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  if (shuffleOn && currentQueue.length > 1) {
    let n; do { n = Math.floor(Math.random() * currentQueue.length); } while (n === currentQueueIndex);
    currentQueueIndex = n;
  } else {
    if (auto && repeatMode === 0 && currentQueueIndex === currentQueue.length - 1) { autoContinue(); return; }
    currentQueueIndex = (currentQueueIndex + 1) % currentQueue.length;
  }
  play(currentQueue[currentQueueIndex], currentQueueIndex);
}
function prevTrack() {
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (!currentQueue.length) return;
  currentQueueIndex = (currentQueueIndex - 1 + currentQueue.length) % currentQueue.length;
  play(currentQueue[currentQueueIndex], currentQueueIndex);
}
function togglePlay() {
  if (!currentTrack) return;
  if (audio.paused) audio.play().catch(() => retryOrFail(playToken)); else audio.pause();
}

$('mini-play').addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
$('mini-next').addEventListener('click', e => { e.stopPropagation(); nextTrack(false); });
$('np-play').addEventListener('click', togglePlay);
$('np-next').addEventListener('click', () => nextTrack(false));
$('np-prev').addEventListener('click', prevTrack);
$('np-shuffle').addEventListener('click', () => {
  shuffleOn = !shuffleOn;
  $('np-shuffle').classList.toggle('on', shuffleOn);
  toast(shuffleOn ? 'Aleatório ligado' : 'Aleatório desligado');
});
$('np-repeat').addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  $('np-repeat').classList.toggle('on', repeatMode > 0);
  toast(['Repetir desligado', 'Repetir fila', 'Repetir esta faixa'][repeatMode]);
});

audio.addEventListener('play', () => { setPlayIcon('pause'); setSpinning(true); });
audio.addEventListener('playing', () => { retryCount = 0; setPlayIcon('pause'); setSpinning(true); });
audio.addEventListener('pause', () => { if (!audio.ended) { setPlayIcon('play'); setSpinning(false); } });
audio.addEventListener('waiting', () => setPlayIcon('loading'));
audio.addEventListener('stalled', () => {
  const token = playToken;
  setTimeout(() => { if (token === playToken && audio.readyState < 3 && !audio.paused) retryOrFail(token); }, 6000);
});
audio.addEventListener('error', () => retryOrFail(playToken));
audio.addEventListener('ended', () => nextTrack(true));

let scrubbing = false;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  $('mini-progress').style.width = pct + '%';
  if (!scrubbing) $('np-bar-fill').style.width = pct + '%';
  $('np-cur').textContent = fmtTime(Math.floor(audio.currentTime));
  $('np-tot').textContent = fmtTime(Math.floor(audio.duration));
});

function bindSlider(bar, onChange, onStart, onEnd) {
  const getPct = e => {
    const r = bar.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    return Math.min(1, Math.max(0, (x - r.left) / r.width));
  };
  let down = false;
  const start = e => { down = true; bar.classList.add('active'); onStart && onStart(); onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const move = e => { if (!down) return; onChange(getPct(e)); e.preventDefault(); e.stopPropagation(); };
  const end = () => { if (!down) return; down = false; bar.classList.remove('active'); onEnd && onEnd(); };
  bar.addEventListener('touchstart', start, { passive: false });
  bar.addEventListener('touchmove', move, { passive: false });
  bar.addEventListener('touchend', end);
  bar.addEventListener('mousedown', start);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
}
let seekPct = 0;
bindSlider($('np-bar'),
  pct => { seekPct = pct; $('np-bar-fill').style.width = (pct * 100) + '%'; },
  () => { scrubbing = true; },
  () => { scrubbing = false; if (audio.duration && isFinite(audio.duration)) audio.currentTime = seekPct * audio.duration; }
);
bindSlider($('np-vol-bar'), pct => { audio.volume = pct; $('np-vol-fill').style.width = (pct * 100) + '%'; });

// ═══════════════════════════════════════════════════════════
//  MODAL DO PLAYER (com suporte ao botão voltar)
// ═══════════════════════════════════════════════════════════
function openNowPlaying() {
  if (!currentTrack || nowPlaying.classList.contains('open')) return;
  nowPlaying.classList.add('open');
  miniPlayer.style.transform = 'translateY(140px)';
  miniPlayer.style.opacity = '0';
  history.pushState({ np: 1 }, '');
}
function closeNowPlaying(fromHistory) {
  if (!nowPlaying.classList.contains('open')) return;
  nowPlaying.style.transform = '';
  nowPlaying.classList.remove('open');
  miniPlayer.style.transform = '';
  miniPlayer.style.opacity = '';
  if (!fromHistory) { try { history.back(); } catch (_) {} }
}
miniPlayer.addEventListener('click', openNowPlaying);
$('np-close').addEventListener('click', () => closeNowPlaying(false));
$('np-more').addEventListener('click', () => { if (currentTrack) openTrackSheet(currentTrack, null); });

(function () {
  let startY = 0, dy = 0, dragging = false;
  const isInteractive = x => x.closest('#np-bar, #np-vol-bar, button');
  nowPlaying.addEventListener('touchstart', e => {
    if (isInteractive(e.target)) return;
    startY = e.touches[0].clientY; dy = 0; dragging = true;
    nowPlaying.classList.add('dragging');
  }, { passive: true });
  nowPlaying.addEventListener('touchmove', e => {
    if (!dragging) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    nowPlaying.style.transform = `translateY(${dy}px)`;
    nowPlaying.style.borderRadius = Math.min(28, dy / 4) + 'px ' + Math.min(28, dy / 4) + 'px 0 0';
  }, { passive: true });
  nowPlaying.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    nowPlaying.classList.remove('dragging');
    nowPlaying.style.borderRadius = '';
    if (dy > 140) closeNowPlaying(false); else nowPlaying.style.transform = '';
  });
})();

// ═══════════════════════════════════════════════════════════
//  NOTIFICAÇÃO DE MÍDIA
// ═══════════════════════════════════════════════════════════
function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title || '', artist: track.artist || '',
    artwork: track.thumbnail ? [{ src: track.thumbnail, sizes: '512x512', type: 'image/jpeg' }] : []
  });
}
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
  navigator.mediaSession.setActionHandler('nexttrack', () => nextTrack(false));
  navigator.mediaSession.setActionHandler('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
}

// ═══════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + String(sec).padStart(2, '0');
}
function esc(str) {
  return (str == null ? '' : String(str)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
audio.volume = 1;
applyTheme();
syncDominantSwitch();
renderCategories();
renderRecents();
renderHomeFilters();
applyLanguage();
loadHomeFeed();
</script>
