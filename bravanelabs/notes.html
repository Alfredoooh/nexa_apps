<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="theme-color" content="#FFFFFF"/>
<title>Brivane Notes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.2.2/ionicons.js"></script>
<style>
:root{
  --bg:#FFFFFF;--bg-rgb:255,255,255;--surface:#F5F5F5;--surface2:#ECECEE;--floating:#FFFFFF;--popup:#FFFFFF;
  --text:#1C1C1E;--text2:#6E6E73;--accent:#2596be;--accent-rgb:37,150,190;--on-accent:#FFFFFF;--accent-container:rgba(37,150,190,.16);
  --border:#ECECEE;--outline:#DCDCE0;--danger:#FF3B30;
  --tb-shadow:0 6px 24px rgba(0,0,0,.14);--popup-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  --snack-bg:#323232;--snack-fg:#F2F2F2;--snack-act:#7CCBEA;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --top-extra:46px;--bar-h:58px;--kb:0px;
  --emphasized:cubic-bezier(.2,0,0,1);--emphasized-decel:cubic-bezier(.05,.7,.1,1);--emphasized-accel:cubic-bezier(.3,0,.8,.15);--ios:cubic-bezier(.32,.72,0,1);
  --sheet-r:34px;
  --n-none:var(--surface);--n-red:#FDE3E1;--n-orange:#FDEBD7;--n-yellow:#FBF4CB;--n-green:#E1F3DC;--n-teal:#D7F0EE;--n-blue:#DCEBFA;--n-purple:#E9E0F8;--n-pink:#FADDEB;--n-ink:#1C1C1E;
}
[data-theme="dark"]{
  --bg:#0D0D0D;--bg-rgb:13,13,13;--surface:#1F1F1F;--surface2:#2A2A2C;--floating:#1F1F1F;--popup:#1F1F1F;
  --text:#F2F2F2;--text2:#9B9B9F;--on-accent:#FFFFFF;--border:#3A3A3C;--outline:#48484A;--danger:#FF453A;
  --tb-shadow:0 6px 24px rgba(0,0,0,.55);--popup-shadow:0 8px 28px rgba(0,0,0,.5);
  --snack-bg:#E3E3E6;--snack-fg:#1C1C1E;--snack-act:#0E6C8C;
  --n-red:#4A2624;--n-orange:#4A3320;--n-yellow:#46411D;--n-green:#24391F;--n-teal:#1E3B39;--n-blue:#1F3448;--n-purple:#35294F;--n-pink:#4C263A;--n-ink:#F2F2F2;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .3s ease,color .3s ease;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
input:focus,textarea:focus,button:focus,[contenteditable]:focus{outline:none}
ion-icon{pointer-events:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;font-family:inherit}
.tap{transition:transform .2s var(--emphasized),opacity .2s ease}
.tap:active{transform:scale(.95);opacity:.85}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#root{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .42s var(--ios);will-change:transform}
#root.pushed{transform:translate3d(-28%,0,0)}
#root-dim{position:absolute;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity .42s var(--ios)}

#topbar{position:relative;z-index:20;flex-shrink:0;padding:calc(var(--safe-top) + var(--top-extra)) 20px 12px;display:flex;align-items:center;gap:10px;background:var(--bg)}
#page-title{flex:1;min-width:0;font-size:30px;font-weight:800;letter-spacing:-.9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--surface);color:var(--text);border:0;display:flex;align-items:center;justify-content:center}
.top-btn ion-icon{font-size:20px}

#tabs{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain;padding-top:4px;padding-bottom:120px;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .22s ease,visibility 0s linear .22s}
.view::-webkit-scrollbar{display:none}
.view.active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .28s ease,visibility 0s}
.section{margin-bottom:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:12px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.5px}
.section-title.small{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text2)}

/* bottom bar normal */
#bottom-bar{position:relative;flex-shrink:0;z-index:30;display:flex;align-items:stretch;height:calc(var(--bar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg);transition:background .3s ease}
#bottom-bar::before{content:'';position:absolute;left:0;right:0;bottom:100%;height:20px;pointer-events:none;background:linear-gradient(to bottom,rgba(var(--bg-rgb),0),rgba(var(--bg-rgb),.9))}
.bb-item{flex:1;min-width:0;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text2);transition:color .2s ease,transform .2s var(--emphasized)}
.bb-item:active{transform:scale(.94)}
.bb-item ion-icon{font-size:24px}
.bb-item span{font-size:11px;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bb-item.active{color:var(--accent)}

.fchip{padding:9px 18px;border-radius:999px;border:0;flex-shrink:0;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;transition:background .25s ease,color .25s ease;display:flex;align-items:center;gap:6px}
.fchip ion-icon{font-size:16px}
.fchip.active{background:var(--accent);color:var(--on-accent)}
#home-filters{display:flex;gap:8px;padding:2px 20px 16px;overflow-x:auto;scrollbar-width:none}
#home-filters::-webkit-scrollbar{display:none}

.notes-grid{display:flex;gap:12px;padding:0 20px;align-items:flex-start}
.notes-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.notes-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.note-card{position:relative;border-radius:22px;padding:15px 15px 13px;background:var(--n-none);color:var(--n-ink);animation:fadeUp .4s var(--emphasized-decel) both;overflow:hidden;text-align:left;border:1.5px solid transparent;transition:transform .2s var(--emphasized),border-color .2s ease}
.note-card:active{transform:scale(.97)}
.note-card.sel{border-color:var(--accent)}
.note-card[data-c="red"]{background:var(--n-red)}.note-card[data-c="orange"]{background:var(--n-orange)}.note-card[data-c="yellow"]{background:var(--n-yellow)}.note-card[data-c="green"]{background:var(--n-green)}
.note-card[data-c="teal"]{background:var(--n-teal)}.note-card[data-c="blue"]{background:var(--n-blue)}.note-card[data-c="purple"]{background:var(--n-purple)}.note-card[data-c="pink"]{background:var(--n-pink)}
.nc-pin{position:absolute;top:12px;right:12px;font-size:15px;opacity:.55}
.nc-title{font-size:16px;font-weight:800;letter-spacing:-.3px;line-height:1.25;padding-right:18px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.nc-body{font-size:14px;line-height:1.4;opacity:.78;margin-top:6px;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.nc-body:first-child{margin-top:0;opacity:.9;font-size:15px}
.nc-img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:16px;margin-top:8px;background:rgba(127,127,127,.15)}
.nc-img:first-child{margin-top:0}
.nc-check{display:flex;align-items:flex-start;gap:8px;font-size:14px;line-height:1.35;margin-top:5px;opacity:.85}
.nc-check ion-icon{font-size:17px;flex-shrink:0;margin-top:1px;opacity:.7}
.nc-check.done{text-decoration:line-through;opacity:.45}
.nc-check span{min-width:0;word-break:break-word}
.nc-more{font-size:12px;font-weight:700;opacity:.55;margin-top:6px}
.nc-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.nc-tag,.nc-fold{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(127,127,127,.18);display:inline-flex;align-items:center;gap:4px}
.nc-rem{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-container);color:var(--accent);display:inline-flex;align-items:center;gap:4px}
.nc-rem ion-icon,.nc-fold ion-icon{font-size:12px}
.nc-rem.late{background:rgba(255,59,48,.15);color:var(--danger)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

#sel-bar{position:absolute;left:0;right:0;top:0;z-index:25;display:none;align-items:center;gap:2px;padding:calc(var(--safe-top) + var(--top-extra) - 6px) 10px 10px 8px;background:var(--bg)}
#sel-bar.show{display:flex}
#sel-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;padding-left:4px}
#sel-num{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1}
#sel-lbl{font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-plain{width:44px;height:44px;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.icon-plain ion-icon{font-size:24px}
.icon-plain:active{background:var(--surface)}
.icon-plain.danger{color:var(--danger)}
#sel-bar .icon-plain{width:40px;height:40px}
#sel-bar .icon-plain ion-icon{font-size:22px}

#search-row{display:flex;align-items:center;padding:0 20px;margin-bottom:6px}
#search-fake{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 18px;border-radius:999px;background:var(--surface);color:var(--text2);font-size:16px;font-weight:500;border:0;text-align:left}
#search-fake ion-icon{font-size:21px;flex-shrink:0}
#tags-strip{padding:14px 0 4px}
#tags-strip .ra-title{font-size:18px;font-weight:800;letter-spacing:-.3px;padding:0 20px 12px}
.tag-row{display:flex;gap:8px;padding:0 20px 6px;flex-wrap:wrap}
#cat-title{font-size:22px;font-weight:800;letter-spacing:-.5px;padding:18px 20px 14px}
#cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.cat-card{position:relative;height:96px;border-radius:22px;overflow:hidden;border:0;text-align:left;color:#fff;padding:14px 16px;font-size:17px;font-weight:800;letter-spacing:-.2px;animation:fadeUp .4s var(--emphasized-decel) both}
.cat-card ion-icon{position:absolute;right:-6px;bottom:-8px;font-size:64px;opacity:.3;transform:rotate(-18deg)}
.cat-card small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:3px;letter-spacing:0}

#sp-bar{padding-right:14px}
#sp-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 18px;border-radius:999px;background:var(--surface)}
#sp-wrap>ion-icon{font-size:21px;color:var(--text2);flex-shrink:0}
#sp-input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--text);font-size:16px;font-weight:500;-webkit-appearance:none;appearance:none}
#sp-input::placeholder{color:var(--text2);font-weight:500;opacity:.9}
#sp-input::-webkit-search-cancel-button,#sp-input::-webkit-search-decoration{-webkit-appearance:none;display:none}
#sp-clear{width:38px;height:38px;border-radius:50%;border:0;flex-shrink:0;background:var(--surface2);color:var(--text2);display:none;align-items:center;justify-content:center}
#sp-clear.show{display:flex}
#sp-clear ion-icon{font-size:18px}

.row-list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:10px 8px 10px 20px;animation:fadeUp .35s var(--emphasized-decel) both;transition:background .15s ease;width:100%;border:0;background:transparent;color:var(--text);text-align:left}
.row:active{background:var(--surface)}
.row-ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--accent-container);color:var(--accent)}
.row-ic ion-icon{font-size:26px}
.row-info{flex:1;min-width:0}
.row-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn-fill{height:44px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.btn-fill ion-icon{font-size:20px}
.btn-outline{height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--outline);background:transparent;color:var(--text);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.btn-outline ion-icon{font-size:18px}

#fab{position:absolute;right:20px;z-index:52;width:58px;height:58px;border-radius:50%;border:0;bottom:calc(var(--bar-h) + var(--safe-bottom) + 18px);background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:transform .45s var(--emphasized),opacity .3s ease}
#fab ion-icon{font-size:28px}
#fab:active{transform:scale(.92)}
body.snack-on:not(.on-page):not(.sel-mode) #fab{transform:translateY(-58px)}
body.on-page #fab,body.sel-mode #fab{transform:translateY(160px) scale(.6);opacity:0;pointer-events:none}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 32px;text-align:center;color:var(--text2)}
.empty-state ion-icon{font-size:52px;opacity:.35;margin-bottom:14px}
.empty-state .es-t{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state .es-s{font-size:14px;line-height:1.4;max-width:260px}
.empty-state .btn-fill{margin-top:18px}
.empty-state .btn-fill ion-icon{font-size:20px;opacity:1;margin:0}

.page{position:absolute;inset:0;z-index:60;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transform:translate3d(100%,0,0);visibility:hidden;transition:transform .42s var(--ios),visibility 0s linear .42s;box-shadow:-10px 0 28px rgba(0,0,0,.14);will-change:transform;contain:layout paint}
.page.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .42s var(--ios),visibility 0s}
.page.behind{transform:translate3d(-28%,0,0);visibility:visible}
.page.leaving{transform:translate3d(100%,0,0);visibility:visible;transition:transform .36s var(--ios),visibility 0s linear .36s}
.page.dragging,#root.dragging{transition:none!important}
.page-bar{flex-shrink:0;padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;display:flex;align-items:center;gap:4px;background:var(--bg)}
.page-back{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-back ion-icon{font-size:26px}
.page-back:active{background:var(--surface)}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:100px;overscroll-behavior-y:contain}
.page-body::-webkit-scrollbar{display:none}
#swipe-edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:65;display:none;touch-action:none}
#swipe-edge.on{display:block}

/* editor */
#page-editor{transition:transform .42s var(--ios),visibility 0s linear .42s,background .3s ease}
#page-editor.open{transition:transform .42s var(--ios),visibility 0s,background .3s ease}
#ed-bar-actions{display:flex;align-items:center;gap:2px}
#ed-scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:6px 20px calc(var(--kb) + 120px);overscroll-behavior-y:contain;scroll-padding-bottom:100px}
#ed-scroll::-webkit-scrollbar{display:none}
#ed-title{width:100%;border:0;background:transparent;color:var(--text);resize:none;overflow:hidden;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.2;padding:6px 0;display:block}
#ed-title::placeholder{color:var(--text2);opacity:.55}
#ed-meta{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 12px;align-items:center}
.meta-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:0;background:var(--surface);color:var(--text);font-size:13px;font-weight:700}
.meta-chip ion-icon{font-size:16px}
.meta-chip.accent{background:var(--accent-container);color:var(--accent)}
.meta-chip.late{background:rgba(255,59,48,.15);color:var(--danger)}
#ed-body{min-height:36vh;color:var(--text);font-size:17px;line-height:1.6;font-weight:500;padding:4px 0;word-break:break-word}
#ed-body:empty::before{content:attr(data-ph);color:var(--text2);opacity:.55;pointer-events:none}
#ed-body img{max-width:100%;height:auto;border-radius:18px;display:block;margin:10px 0}
#ed-body hr{border:0;height:2px;background:var(--outline);margin:16px 0;border-radius:2px}
#ed-body blockquote{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin:10px 0;opacity:.9}
#ed-body ul,#ed-body ol{padding-left:26px;margin:6px 0}
#ed-body a{color:var(--accent)}
#ed-body code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border-radius:8px;padding:1px 6px;font-size:.92em}
#ed-checks{display:flex;flex-direction:column}
.ck-row{display:flex;align-items:flex-start;gap:10px;padding:5px 0;animation:fadeUp .25s var(--emphasized-decel) both}
.ck-box{width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--outline);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .2s ease,border-color .2s ease,color .2s ease}
.ck-box ion-icon{font-size:17px}
.ck-row.done .ck-box{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ck-input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:17px;line-height:1.45;font-weight:500;padding:3px 0;resize:none;overflow:hidden}
.ck-row.done .ck-input{text-decoration:line-through;opacity:.45}
.ck-del{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:.6}
.ck-del ion-icon{font-size:20px}
#ck-add{display:flex;align-items:center;gap:10px;padding:8px 0;border:0;background:transparent;color:var(--text2);font-size:16px;font-weight:600;width:100%;text-align:left}
#ck-add ion-icon{font-size:22px;margin-left:2px}
#ck-done-title{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);padding:14px 0 4px}

/* toolbar flutuante do editor (estilo Looply) */
#ed-toolbar{position:absolute;left:12px;right:12px;z-index:6;bottom:calc(var(--kb) + var(--safe-bottom) + 16px);height:52px;padding:0 6px;border-radius:26px;background:var(--floating);box-shadow:var(--tb-shadow);display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;transition:bottom .25s var(--emphasized)}
#ed-toolbar::-webkit-scrollbar{display:none}
.tb-group{display:flex;align-items:center;flex-shrink:0}
.tb-pill{display:flex;align-items:center;background:var(--surface);border-radius:999px;padding:3px;flex-shrink:0;margin-right:4px}
.tb-pill .tb-btn{width:34px;height:34px}
.tb-btn{width:40px;height:40px;flex-shrink:0;border:0;background:transparent;color:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .12s ease,color .12s ease}
.tb-btn ion-icon{font-size:22px}
.tb-btn:active{background:var(--surface)}
.tb-btn.on{background:var(--accent-container);color:var(--accent)}
.tb-btn.disabled{opacity:.35}
.tb-div{width:1px;height:22px;background:var(--border);margin:0 4px;flex-shrink:0}
.tb-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--outline)}

/* desenho */
#draw-modal{position:absolute;inset:0;z-index:120;background:var(--bg);display:none;flex-direction:column}
#draw-modal.open{display:flex;animation:fadeUp .25s var(--emphasized-decel) both}
#draw-top{padding:calc(var(--safe-top) + var(--top-extra) - 6px) 12px 8px 8px;display:flex;align-items:center;gap:4px}
#draw-top .page-title{font-size:22px}
#draw-stage{flex:1;min-height:0;padding:6px 14px}
#draw-wrap{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff;border:1px solid var(--border)}
#draw-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#draw-tools{padding:10px 14px calc(var(--safe-bottom) + 14px);display:flex;flex-direction:column;gap:10px}
.fmt-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;align-items:center}
.fmt-row::-webkit-scrollbar{display:none}
.sw{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--outline)}
#draw-brush{display:flex;align-items:center;gap:12px;padding:0 10px}
#draw-brush input[type=range]{flex:1;accent-color:var(--accent);height:28px}
#draw-brush ion-icon{font-size:20px;color:var(--text2)}

/* definições */
.set-group-title{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);padding:20px 20px 6px}
.set-row{width:100%;display:flex;align-items:center;gap:16px;padding:14px 20px;border:0;background:transparent;color:var(--text);text-align:left;transition:background .15s ease}
.set-row:active{background:var(--surface)}
.set-row>ion-icon{font-size:24px;color:var(--text2);flex-shrink:0}
.set-txt{flex:1;min-width:0}
.set-t{font-size:16px;font-weight:600}
.set-s{font-size:13px;color:var(--text2);margin-top:2px}
.set-val{font-size:14px;color:var(--text2);font-weight:600;flex-shrink:0;max-width:40%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-chev{font-size:18px!important;color:var(--text2);opacity:.7}
.switch{position:relative;width:46px;height:28px;border-radius:999px;flex-shrink:0;background:var(--surface2);border:2px solid var(--outline);transition:background .2s ease,border-color .2s ease}
.switch::after{content:'';position:absolute;top:50%;left:4px;width:14px;height:14px;border-radius:50%;background:var(--text2);transform:translateY(-50%);transition:left .25s var(--emphasized),width .25s var(--emphasized),height .25s var(--emphasized),background .2s ease}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{left:20px;width:20px;height:20px;background:var(--on-accent)}

/* menu */
#menu-overlay{position:absolute;inset:0;z-index:90;visibility:hidden;background:rgba(0,0,0,0);transition:background .2s linear,visibility 0s linear .2s}
#menu-overlay.open{visibility:visible;background:rgba(0,0,0,.32);transition:background .2s linear,visibility 0s}
#menu-pop{position:absolute;top:calc(var(--safe-top) + var(--top-extra) - 4px);right:14px;width:290px;padding:8px 0;border-radius:26px;transform-origin:top right;background:var(--popup);box-shadow:var(--popup-shadow);transform:scale(.85);opacity:0;transition:transform .15s var(--emphasized-accel),opacity .1s linear}
#menu-overlay.open #menu-pop{transform:scale(1);opacity:1;transition:transform .3s var(--emphasized-decel),opacity .15s linear}
.menu-item{width:100%;display:flex;align-items:center;gap:16px;padding:14px 20px;background:transparent;border:0;color:var(--text);font-size:16px;font-weight:500;text-align:left;transition:background .15s ease}
.menu-item:active{background:var(--surface)}
.menu-item ion-icon{font-size:22px;color:var(--text2);flex-shrink:0}
.menu-item svg{flex-shrink:0;color:var(--text2)}
.menu-item .glyph{width:22px;flex-shrink:0;text-align:center;font-size:17px;font-weight:700;color:var(--text2)}
.menu-item span.grow{flex:1}
.menu-item.danger,.menu-item.danger ion-icon{color:var(--danger)}
.menu-sep{height:1px;background:var(--border);margin:6px 0}

/* sheets */
.sheet-layer{position:absolute;inset:0;z-index:100;visibility:hidden;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s}
.sheet-layer.open{visibility:visible;background:rgba(0,0,0,.45);transition:background .3s linear,visibility 0s}
.sheet-layer.closing{visibility:visible;background:rgba(0,0,0,0);transition:background .3s linear,visibility 0s linear .42s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;background:var(--popup);border-radius:var(--sheet-r) var(--sheet-r) 0 0;padding:10px 0 calc(var(--safe-bottom) + 14px);transform:translate3d(0,100%,0);transition:transform .42s var(--ios);will-change:transform}
.sheet-layer.open .sheet-panel{transform:translate3d(0,0,0)}
.sheet-layer.closing .sheet-panel{transform:translate3d(0,100%,0);transition:transform .34s var(--ios)}
.sheet-panel.dragging{transition:none!important}
.sheet-handle-wrap{padding:4px 0 12px;touch-action:none;flex-shrink:0}
.sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--outline);margin:0 auto}
.sheet-content{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.sheet-content::-webkit-scrollbar{display:none}
.sheet-head{display:flex;align-items:center;gap:14px;padding:4px 20px 12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.sheet-head .sh-ic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-container);color:var(--accent);flex-shrink:0}
.sheet-head .sh-ic ion-icon{font-size:26px}
.sheet-head .sh-t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .sh-s{font-size:14px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-title{font-size:18px;font-weight:800;padding:6px 20px 10px}
.opt-row{display:flex;align-items:center;gap:16px;padding:14px 20px;width:100%;border:0;background:transparent;color:var(--text);font-size:16px;font-weight:500;text-align:left}
.opt-row:active{background:var(--surface)}
.opt-row ion-icon{font-size:22px;color:var(--text2);flex-shrink:0}
.opt-row .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--outline);flex-shrink:0;position:relative;transition:border-color .2s ease}
.opt-row.sel .radio{border-color:var(--accent)}
.opt-row.sel .radio::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--accent)}
.opt-row .grow{flex:1}
.opt-row.check.sel .radio{background:var(--accent);border-color:var(--accent)}
.opt-row.check.sel .radio::after{display:none}
.opt-row.check.sel .radio::before{content:'';position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.color-grid{display:flex;flex-wrap:wrap;gap:12px;padding:6px 20px 14px}
.c-dot{width:46px;height:46px;border-radius:50%;border:2px solid var(--outline);display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .2s var(--emphasized),border-color .2s ease}
.c-dot:active{transform:scale(.9)}
.c-dot.sel{border-color:var(--accent);border-width:3px}
.c-dot ion-icon{font-size:22px}
.dt-wrap{padding:4px 20px 8px;display:flex;flex-direction:column;gap:12px}
.dt-field{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-radius:999px;background:var(--surface)}
.dt-field ion-icon{font-size:22px;color:var(--text2);flex-shrink:0}
.dt-field input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--text);font-size:16px;font-weight:600;-webkit-appearance:none;appearance:none;color-scheme:light}
[data-theme="dark"] .dt-field input{color-scheme:dark}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 8px}
.sheet-actions{display:flex;gap:10px;padding:10px 20px 4px}
.sheet-actions button{flex:1;justify-content:center}

/* partilha */
#share-card{margin:4px 20px 14px;border-radius:22px;padding:16px;color:var(--n-ink);overflow:hidden}
#share-card .sc-img{display:block;width:100%;max-height:150px;object-fit:cover;border-radius:16px;margin-bottom:10px}
#share-card .sc-t{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
#share-card .sc-b{font-size:14px;line-height:1.4;opacity:.78;margin-top:6px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
#share-card .sc-brand{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;font-weight:800;opacity:.55}
#share-apps{display:flex;gap:12px;overflow-x:auto;padding:4px 20px 8px;scrollbar-width:none}
#share-apps::-webkit-scrollbar{display:none}
.share-app{flex:0 0 72px;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:transparent;color:var(--text);font-size:12px;font-weight:600;text-align:center}
.share-app .ic{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.share-app .ic ion-icon{font-size:28px}

/* diálogo */
#dialog-overlay{position:absolute;inset:0;z-index:130;visibility:hidden;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(24px + var(--kb));transition:background .2s linear,padding-bottom .25s var(--emphasized),visibility 0s linear .2s}
#dialog-overlay.open{visibility:visible;background:rgba(0,0,0,.5);transition:background .2s linear,padding-bottom .25s var(--emphasized),visibility 0s}
#dialog{width:100%;max-width:340px;border-radius:30px;padding:24px 24px 16px;background:var(--popup);transform:scale(.88);opacity:0;transition:transform .15s var(--emphasized-accel),opacity .1s linear}
#dialog-overlay.open #dialog{transform:scale(1);opacity:1;transition:transform .3s var(--emphasized-decel),opacity .15s linear}
#dialog h3{font-size:22px;font-weight:700;margin-bottom:16px}
#dialog p{font-size:15px;color:var(--text2);margin-bottom:6px;line-height:1.4}
#dialog-input{width:100%;height:52px;padding:0 18px;border-radius:999px;border:2px solid var(--outline);background:transparent;color:var(--text);font-size:16px}
#dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dlg-btn{height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;color:var(--accent);font-size:15px;font-weight:700}
.dlg-btn:active{background:var(--accent-container)}
.dlg-btn.danger{color:var(--danger)}

/* snackbar nativo */
#toast{position:absolute;left:8px;right:8px;max-width:560px;margin:0 auto;z-index:140;bottom:calc(var(--bar-h) + var(--safe-bottom) + 8px);min-height:48px;padding:6px 8px 6px 16px;border-radius:4px;background:var(--snack-bg);color:var(--snack-fg);box-shadow:0 2px 6px rgba(0,0,0,.28),0 1px 2px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .25s var(--emphasized-decel),opacity .2s linear}
body.on-page #toast{bottom:calc(var(--safe-bottom) + 12px)}
body.editor-open #toast{bottom:calc(var(--kb) + var(--safe-bottom) + 16px + 52px + 10px)}
#toast.show{transform:translateY(0);opacity:1;pointer-events:auto}
#toast-msg{flex:1;min-width:0;padding:8px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#toast-act{border:0;background:transparent;color:var(--snack-act);font-size:14px;font-weight:600;padding:0 12px;height:36px;border-radius:4px;flex-shrink:0;display:none}
</style>
</head>
<body>
<div id="app">

  <div id="root">
    <div id="topbar">
      <div id="page-title">Notas</div>
      <button id="menu-btn" class="top-btn tap" aria-label="Opções"><ion-icon name="ellipsis-horizontal"></ion-icon></button>
    </div>

    <div id="sel-bar">
      <button class="icon-plain tap" id="sel-close" aria-label="Cancelar"><ion-icon name="close"></ion-icon></button>
      <div id="sel-info"><span id="sel-num">0</span><span id="sel-lbl">selecionadas</span></div>
      <button class="icon-plain tap" id="sel-all" aria-label="Selecionar tudo"><ion-icon name="checkmark-done-outline"></ion-icon></button>
      <button class="icon-plain tap" id="sel-pin" aria-label="Fixar"><ion-icon name="pin-outline"></ion-icon></button>
      <button class="icon-plain tap" id="sel-color" aria-label="Cor"><ion-icon name="color-palette-outline"></ion-icon></button>
      <button class="icon-plain tap" id="sel-archive" aria-label="Arquivar"><ion-icon name="archive-outline"></ion-icon></button>
      <button class="icon-plain danger tap" id="sel-del" aria-label="Apagar"><ion-icon name="trash-outline"></ion-icon></button>
    </div>

    <div id="tabs">
      <div id="view-home" class="view active"><div id="home-filters"></div><div id="home-pinned"></div><div id="home-notes"></div></div>
      <div id="view-search" class="view">
        <div id="search-row"><button id="search-fake" class="tap"><ion-icon name="search"></ion-icon><span id="search-fake-txt">Pesquisar nas notas</span></button></div>
        <div id="tags-strip"></div><div id="cat-title">Procurar por</div><div id="cat-grid"></div>
      </div>
      <div id="view-reminders" class="view"><div id="rem-list"></div></div>
      <div id="view-folders" class="view"><div id="folder-list"></div></div>
    </div>

    <div id="bottom-bar">
      <button class="bb-item active" data-tab="home"><ion-icon name="document-text"></ion-icon><span>Notas</span></button>
      <button class="bb-item" data-tab="search"><ion-icon name="search-outline"></ion-icon><span>Pesquisar</span></button>
      <button class="bb-item" data-tab="reminders"><ion-icon name="notifications-outline"></ion-icon><span>Lembretes</span></button>
      <button class="bb-item" data-tab="folders"><ion-icon name="folder-outline"></ion-icon><span>Pastas</span></button>
    </div>
  </div>
  <div id="root-dim"></div>

  <button id="fab" class="tap" aria-label="Nova nota"><ion-icon name="add"></ion-icon></button>

  <div class="page" id="page-search">
    <div class="page-bar" id="sp-bar">
      <button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button>
      <div id="sp-wrap">
        <ion-icon name="search"></ion-icon>
        <input type="text" id="sp-input" placeholder="Pesquisar nas notas" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" inputmode="search"/>
        <button id="sp-clear" class="tap" aria-label="Limpar"><ion-icon name="close"></ion-icon></button>
      </div>
    </div>
    <div class="page-body" id="sp-body"><div id="sp-hist"></div><div id="sp-count"></div><div id="sp-results"></div></div>
  </div>

  <div class="page" id="page-editor">
    <div class="page-bar">
      <button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button>
      <div style="flex:1"></div>
      <div id="ed-bar-actions">
        <button class="icon-plain tap" id="ed-pin" aria-label="Fixar"><ion-icon name="pin-outline"></ion-icon></button>
        <button class="icon-plain tap" id="ed-remind" aria-label="Lembrete"><ion-icon name="notifications-outline"></ion-icon></button>
        <button class="icon-plain tap" id="ed-more" aria-label="Mais"><ion-icon name="ellipsis-vertical"></ion-icon></button>
      </div>
    </div>
    <div id="ed-scroll">
      <textarea id="ed-title" rows="1" placeholder="Título" maxlength="200"></textarea>
      <div id="ed-meta"></div>
      <div id="ed-body" contenteditable="true" data-ph="Escreve aqui…" spellcheck="true"></div>
      <div id="ed-checks-wrap" style="display:none">
        <div id="ed-checks"></div>
        <button id="ck-add" class="tap"><ion-icon name="add"></ion-icon><span id="ck-add-txt">Adicionar item</span></button>
        <div id="ck-done-title" style="display:none">Concluídos</div>
        <div id="ed-checks-done"></div>
      </div>
    </div>
    <div id="ed-toolbar">
      <div class="tb-pill" id="tb-hist">
        <button class="tb-btn disabled" id="tb-undo" aria-label="Desfazer"><ion-icon name="arrow-undo-outline"></ion-icon></button>
        <button class="tb-btn disabled" id="tb-redo" aria-label="Refazer"><ion-icon name="arrow-redo-outline"></ion-icon></button>
      </div>
      <div class="tb-group" id="tb-text">
        <button class="tb-btn" id="fb-fmt" aria-label="Formatar"><ion-icon name="text"></ion-icon></button>
        <button class="tb-btn" id="fb-bold" aria-label="Negrito"><b>B</b></button>
        <button class="tb-btn" id="fb-italic" aria-label="Itálico"><i style="font-family:serif">I</i></button>
        <button class="tb-btn" id="fb-under" aria-label="Sublinhado"><u>U</u></button>
        <span class="tb-div"></span>
        <button class="tb-btn" id="fb-color" aria-label="Cor do texto"><span class="tb-dot" id="fb-color-dot" style="background:var(--text)"></span></button>
        <button class="tb-btn" id="fb-hl" aria-label="Realce"><ion-icon name="color-fill-outline"></ion-icon></button>
        <span class="tb-div"></span>
        <button class="tb-btn" id="fb-list" aria-label="Lista"><ion-icon name="list"></ion-icon></button>
      </div>
      <button class="tb-btn" id="fb-check" aria-label="Checklist"><ion-icon name="checkbox-outline"></ion-icon></button>
      <div class="tb-group" id="tb-ins">
        <button class="tb-btn" id="fb-img" aria-label="Imagem"><ion-icon name="image-outline"></ion-icon></button>
        <button class="tb-btn" id="fb-draw" aria-label="Desenho"><ion-icon name="brush-outline"></ion-icon></button>
        <button class="tb-btn" id="fb-more" aria-label="Inserir"><ion-icon name="apps-outline"></ion-icon></button>
      </div>
      <span class="tb-div"></span>
      <div class="tb-group">
        <button class="tb-btn" id="fb-bg" aria-label="Cor da nota"><ion-icon name="color-palette-outline"></ion-icon></button>
        <button class="tb-btn" id="fb-tag" aria-label="Etiquetas"><ion-icon name="pricetag-outline"></ion-icon></button>
        <button class="tb-btn" id="fb-folder" aria-label="Pasta"><ion-icon name="folder-outline"></ion-icon></button>
      </div>
    </div>
    <input type="file" id="img-input" accept="image/*" style="display:none"/>
  </div>

  <div id="draw-modal">
    <div id="draw-top">
      <button class="page-back tap" id="draw-close" aria-label="Fechar"><ion-icon name="close"></ion-icon></button>
      <div class="page-title" id="draw-title">Desenho</div>
      <button class="icon-plain tap" id="draw-undo" aria-label="Desfazer"><ion-icon name="arrow-undo-outline"></ion-icon></button>
      <button class="icon-plain tap" id="draw-clear" aria-label="Limpar"><ion-icon name="trash-outline"></ion-icon></button>
      <button class="btn-fill tap" id="draw-ok" style="margin-left:6px;height:40px;padding:0 18px">Inserir</button>
    </div>
    <div id="draw-stage"><div id="draw-wrap"><canvas id="draw-canvas"></canvas></div></div>
    <div id="draw-tools">
      <div class="fmt-row" id="draw-colors"></div>
      <div id="draw-brush"><ion-icon name="ellipse"></ion-icon><input type="range" id="draw-size" min="1" max="24" value="4"/><ion-icon name="ellipse" style="font-size:28px"></ion-icon></div>
    </div>
  </div>

  <div class="page" id="page-folder">
    <div class="page-bar">
      <button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button>
      <div class="page-title" id="folder-title">Pasta</div>
      <button class="icon-plain tap" id="folder-more" aria-label="Mais"><ion-icon name="ellipsis-vertical"></ion-icon></button>
    </div>
    <div class="page-body" id="folder-body"></div>
  </div>

  <div class="page" id="page-archive">
    <div class="page-bar"><button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button><div class="page-title" id="archive-title">Arquivo</div></div>
    <div class="page-body" id="archive-body"></div>
  </div>

  <div class="page" id="page-trash">
    <div class="page-bar">
      <button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button>
      <div class="page-title" id="trash-title">Lixeira</div>
      <button class="icon-plain danger tap" id="trash-empty" aria-label="Esvaziar"><ion-icon name="trash-bin-outline"></ion-icon></button>
    </div>
    <div class="page-body" id="trash-body"></div>
  </div>

  <div class="page" id="page-settings">
    <div class="page-bar"><button class="page-back tap" data-back aria-label="Voltar"><ion-icon name="arrow-back"></ion-icon></button><div class="page-title" id="settings-title">Definições</div></div>
    <div class="page-body" id="settings-body"></div>
  </div>

  <div id="swipe-edge"></div>

  <div id="menu-overlay">
    <div id="menu-pop">
      <button class="menu-item" id="mi-view"><ion-icon name="list-outline"></ion-icon><span class="grow" id="mi-view-label">Vista em lista</span></button>
      <button class="menu-item" id="mi-sort"><ion-icon name="swap-vertical-outline"></ion-icon><span class="grow">Ordenar</span></button>
      <button class="menu-item" id="mi-select"><ion-icon name="checkmark-circle-outline"></ion-icon><span class="grow">Selecionar notas</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="mi-archive"><ion-icon name="archive-outline"></ion-icon><span class="grow">Arquivo</span></button>
      <button class="menu-item" id="mi-trash"><ion-icon name="trash-outline"></ion-icon><span class="grow">Lixeira</span></button>
      <div class="menu-sep"></div>
      <button class="menu-item" id="mi-theme"><ion-icon name="moon"></ion-icon><span class="grow" id="mi-theme-label">Tema escuro</span></button>
      <button class="menu-item" id="mi-settings"><ion-icon name="settings-outline"></ion-icon><span class="grow">Definições</span></button>
    </div>
  </div>

  <div id="sheet-host"></div>

  <div id="dialog-overlay">
    <div id="dialog">

  entry.content.querySelector('[data-act="new"]').addEventListener('click', () => { closeSheet(entry); openEditor(null, { folder: f.id }); });
  entry.content.querySelector('[data-act="rename"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('renameFolder'), f.name, t('save'), name => { f.name = name; persist(); renderFolderPage(); }), 200)));
  entry.content.querySelector('[data-act="delete"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteFolder'), '', t('delete'), () => { NOTES.forEach(n => { if (n.folder === f.id) n.folder = ''; }); FOLDERS = FOLDERS.filter(x => x.id !== f.id); persist(); popPage(); renderFolders(); toast(t('folderDeleted')); }, { noInput: true, message: f.name + '?', danger: true }), 200)));
});

/* ── Arquivo / Lixeira ── */
function renderArchive() {
  const list = sortNotes(NOTES.filter(n => n.archived && !n.trashed)), body = $('archive-body');
  if (!list.length) { body.innerHTML = `<div class="empty-state"><ion-icon name="archive-outline"></ion-icon><div class="es-t">${esc(t('emptyArchive'))}</div><div class="es-s">${esc(t('emptyArchiveSub'))}</div></div>`; return; }
  renderNotesInto(body, list, { noSelect: true, showFolder: true });
}
pageHooks['page-archive'] = { open() { $('archive-title').textContent = t('archiveT'); renderArchive(); }, close() { refreshAll(); } };
function renderTrash() {
  purgeTrash(); const list = NOTES.filter(n => n.trashed).sort((a, b) => b.trashedAt - a.trashedAt), body = $('trash-body');
  $('trash-empty').style.visibility = list.length ? 'visible' : 'hidden';
  if (!list.length) { body.innerHTML = `<div class="empty-state"><ion-icon name="trash-outline"></ion-icon><div class="es-t">${esc(t('emptyTrash'))}</div><div class="es-s">${esc(t('emptyTrashSub'))}</div></div>`; return; }
  body.innerHTML = `<div class="row-list">${list.map((n, i) => { const left = Math.max(0, Math.ceil((n.trashedAt + settings.trashDays * 86400000 - Date.now()) / 86400000));
    return `<button class="row tap" data-id="${n.id}" style="animation-delay:${Math.min(i, 8) * 30}ms"><div class="row-ic" style="background:var(--surface2);color:var(--text2)"><ion-icon name="document-text"></ion-icon></div><div class="row-info"><div class="row-title">${esc(noteLabel(n))}</div><div class="row-sub">${left} ${esc(t('days'))}</div></div></button>`; }).join('')}</div>`;
  body.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
    const n = getNote(r.dataset.id); if (!n) return;
    const entry = openSheet(`<div class="sheet-head"><div class="sh-ic"><ion-icon name="document-text"></ion-icon></div><div style="min-width:0;flex:1"><div class="sh-t">${esc(noteLabel(n))}</div></div></div>${sheetItem('restore', 'arrow-undo-outline', t('restore'))}${sheetItem('del', 'trash-bin-outline', t('deleteForever'), true)}`);
    entry.content.querySelector('[data-act="restore"]').addEventListener('click', () => { closeSheet(entry); n.trashed = false; n.trashedAt = 0; persist(); renderTrash(); toast(t('restored')); });
    entry.content.querySelector('[data-act="del"]').addEventListener('click', () => closeSheet(entry, () => setTimeout(() => openDialog(t('deleteForever'), '', t('delete'), () => { NOTES = NOTES.filter(x => x.id !== n.id); persist(); renderTrash(); }, { noInput: true, message: t('deleteForeverQ'), danger: true }), 200)));
  }));
}
pageHooks['page-trash'] = { open() { $('trash-title').textContent = t('trashT'); renderTrash(); }, close() { refreshAll(); } };
$('trash-empty').addEventListener('click', () => openDialog(t('emptyTrashBtn'), '', t('delete'), () => { NOTES = NOTES.filter(n => !n.trashed); persist(); renderTrash(); toast(t('trashEmptied')); }, { noInput: true, message: t('emptyTrashQ'), danger: true }));

/* ── Definições ── */
const themeOpts = () => [{id:'system',name:t('themeAuto')},{id:'light',name:t('themeLight')},{id:'dark',name:t('themeDark')}];
const viewOpts = () => [{id:'grid',name:t('gridView')},{id:'list',name:t('listView')}];
const sortOpts = () => [{id:'edited',name:t('sortEdited')},{id:'created',name:t('sortCreated')},{id:'title',name:t('sortTitle')},{id:'color',name:t('sortColor')}];
const trashOpts = () => [7, 14, 30, 60].map(d => ({ id: d, name: d + ' ' + t('days') }));
const nameOf = (opts, id) => (opts.find(o => String(o.id) === String(id)) || opts[0]).name;
const rowLink = (id, icon, title, sub, val) => `<button class="set-row tap" data-set="${id}"><ion-icon name="${icon}"></ion-icon><div class="set-txt"><div class="set-t">${title}</div>${sub ? `<div class="set-s">${sub}</div>` : ''}</div>${val ? `<div class="set-val">${esc(val)}</div>` : ''}<ion-icon class="set-chev" name="chevron-forward"></ion-icon></button>`;
const rowSwitch = (id, icon, title, sub, on) => `<button class="set-row" data-sw="${id}"><ion-icon name="${icon}"></ion-icon><div class="set-txt"><div class="set-t">${title}</div>${sub ? `<div class="set-s">${sub}</div>` : ''}</div><div class="switch${on ? ' on' : ''}"></div></button>`;
function renderSettings() {
  $('settings-title').textContent = t('settings');
  const html = `<div class="set-group-title">${esc(t('appearance'))}</div>${rowLink('theme', 'contrast-outline', esc(t('theme')), '', nameOf(themeOpts(), settings.theme))}${rowLink('lang', 'language-outline', esc(t('language')), '', nameOf(LANGS, settings.lang))}
    <div class="set-group-title">${esc(t('notesGroup'))}</div>${rowLink('view', 'grid-outline', esc(t('defaultView')), '', nameOf(viewOpts(), settings.view))}${rowLink('sort', 'swap-vertical-outline', esc(t('defaultSort')), '', nameOf(sortOpts(), settings.sort))}
    ${rowSwitch('newChecklist', 'checkbox-outline', esc(t('newChecklistDef')), '', settings.newChecklist)}${rowSwitch('confirmDelete', 'shield-checkmark-outline', esc(t('confirmDelete')), esc(t('confirmDeleteSub')), settings.confirmDelete)}${rowLink('trashDays', 'trash-outline', esc(t('trashKeep')), '', settings.trashDays + ' ' + t('days'))}
    <div class="set-group-title">${esc(t('dataGroup'))}</div>${rowLink('export', 'share-outline', esc(t('export')), esc(t('exportSub')), '')}${rowLink('import', 'download-outline', esc(t('importT')), esc(t('importSub')), '')}${rowLink('clearAll', 'nuclear-outline', esc(t('clearAll')), '', '')}
    <div class="set-group-title">${esc(t('about'))}</div>${rowLink('about', 'information-circle-outline', 'Brivane Notes', esc(t('version')) + ' 1.2.0', '')}${rowLink('resetAll', 'warning-outline', esc(t('resetAll')), '', '')}`;
  const body = $('settings-body'), sc = body.scrollTop; body.innerHTML = html; body.scrollTop = sc;
  body.querySelectorAll('[data-sw]').forEach(row => row.addEventListener('click', () => { const k = row.dataset.sw; setSetting(k, !settings[k]); row.querySelector('.switch').classList.toggle('on', settings[k]); }));
  body.querySelectorAll('[data-set]').forEach(row => row.addEventListener('click', () => onSettingRow(row.dataset.set)));
}
async function changeLanguage(code) { toast(t('langLoading')); const ok = await loadLanguage(code); if (!ok && code !== 'pt') { toast(t('langFail')); return; } setSetting('lang', code); applyLanguage(); }
function exportNotes() { saveTextFile('brivane-notes.json', JSON.stringify({ app: 'brivane-notes', v: 2, notes: NOTES, folders: FOLDERS, tags: TAGS }, null, 2), 'application/json'); }
function importNotes() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0]; if (!f) return; const fr = new FileReader();
    fr.onload = () => { try {
      const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.notes)) throw 0;
      const ids = new Set(NOTES.map(n => n.id)); d.notes.forEach(n => { if (n && n.id && !ids.has(n.id)) NOTES.push(n); });
      (d.folders || []).forEach(x => { if (!FOLDERS.some(y => y.id === x.id)) FOLDERS.push(x); }); (d.tags || []).forEach(x => { if (!TAGS.includes(x)) TAGS.push(x); });
      persist(); refreshAll(); toast(t('imported'));
    } catch (_) { toast(t('importFail')); } };
    fr.readAsText(f);
  });
  inp.click();
}
function onSettingRow(id) {
  switch (id) {
    case 'theme': openChoice(t('theme'), themeOpts(), settings.theme, v => { setSetting('theme', v); applyTheme(); renderSettings(); }); break;
    case 'lang': openChoice(t('language'), LANGS, settings.lang, v => changeLanguage(v)); break;
    case 'view': openChoice(t('defaultView'), viewOpts(), settings.view, v => { setSetting('view', v); renderSettings(); renderHome(); }); break;
    case 'sort': openChoice(t('defaultSort'), sortOpts(), settings.sort, v => { setSetting('sort', v); renderSettings(); }); break;
    case 'trashDays': openChoice(t('trashKeep'), trashOpts(), settings.trashDays, v => { setSetting('trashDays', v); renderSettings(); }); break;
    case 'export': exportNotes(); break; case 'import': importNotes(); break;
    case 'clearAll': openDialog(t('clearAll'), '', t('delete'), () => { NOTES = []; FOLDERS = []; TAGS = []; persist(); refreshAll(); toast(t('cleared')); }, { noInput: true, message: t('clearAllQ'), danger: true }); break;
    case 'about': openDialog('Brivane Notes', '', t('ok'), null, { noInput: true, message: t('version') + ' 1.2.0' }); break;
    case 'resetAll': openDialog(t('resetAll'), '', t('reset'), async () => { settings = Object.assign({}, DEFAULTS); save('settings', settings); await loadLanguage('pt'); applyTheme(); applyLanguage(); renderSettings(); toast(t('settingsReset')); }, { noInput: true, message: t('resetAll') + '?' }); break;
  }
}
pageHooks['page-settings'] = { open: renderSettings };

/* ── Idioma ── */
function applyLanguage() {
  document.documentElement.lang = settings.lang; document.documentElement.dir = RTL_LANGS.includes(settings.lang) ? 'rtl' : 'ltr';
  document.querySelectorAll('.bb-item[data-tab] span').forEach(sp => { const k = sp.parentElement.dataset.tab; sp.textContent = t(k === 'home' ? 'notes' : k); });
  $('search-fake-txt').textContent = t('searchNotes'); $('sp-input').placeholder = t('searchNotes'); $('cat-title').textContent = t('browseBy');
  $('mi-sort').querySelector('.grow').textContent = t('sort'); $('mi-select').querySelector('.grow').textContent = t('select');
  $('mi-archive').querySelector('.grow').textContent = t('archiveT'); $('mi-trash').querySelector('.grow').textContent = t('trashT'); $('mi-settings').querySelector('.grow').textContent = t('settings');
  $('mi-theme-label').textContent = dark ? t('lightTheme') : t('darkTheme');
  $('dialog-cancel').textContent = t('cancel'); $('dialog-input').placeholder = t('folderName');
  $('archive-title').textContent = t('archiveT'); $('trash-title').textContent = t('trashT'); $('settings-title').textContent = t('settings');
  setPageTitle(activeTab); syncEditorMode(); syncBar(); syncViewMenu();
  renderHome(); renderSearchTab(); renderReminders(); renderFolders();
  if (pageStack.includes('page-settings')) renderSettings();
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (activeTab === 'reminders') renderReminders(); if (activeTab === 'home') renderHome(); } });
$('bottom-bar').addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

/* ── Init ── */
(async function init() { if (settings.lang && settings.lang !== 'pt') await loadLanguage(settings.lang); applyTheme(); purgeTrash(); applyLanguage(); syncBar(); })();
</script>
</body>
</html>
