pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream {
            properties.load(it)
        }

        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null : "flutter.sdk não está definido em android/local.properties"
        return flutterSdkPath
    }()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // Flutter 3.50 requires AGP >= 9.1.1; use its tested 9.3.1 template version.
    id "com.android.application" version "9.3.1" apply false
    // Keep legacy KGP available for plugins that have not migrated to AGP built-in Kotlin.
    id "org.jetbrains.kotlin.android" version "2.4.20" apply false
}

include ":app"
