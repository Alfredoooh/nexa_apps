org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# Required by Google Credential Manager: OAuth Web application client ID (NOT the Android client ID).
BROWSEIT_GOOGLE_WEB_CLIENT_ID=PASTE_WEB_CLIENT_ID_HERE

# Optional Cloudflare Worker endpoint for account sync.
BROWSEIT_WORKER_URL=
