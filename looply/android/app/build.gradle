plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def readConfig = { String key, String fallback = '' ->
    def value = project.findProperty(key)
    if (value == null || value.toString().trim().isEmpty()) value = System.getenv(key)
    if (value == null || value.toString().trim().isEmpty()) value = fallback
    value.toString().trim()
}

def asBuildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'
}

def googleWebClientId = readConfig('BROWSEIT_GOOGLE_WEB_CLIENT_ID')
if (googleWebClientId == 'PASTE_WEB_CLIENT_ID_HERE') googleWebClientId = ''
def workerUrl = readConfig('BROWSEIT_WORKER_URL')
def storeFilePath = readConfig('BROWSEIT_KEYSTORE_PATH')
def storePasswordValue = readConfig('BROWSEIT_STORE_PASSWORD')
def keyPasswordValue = readConfig('BROWSEIT_KEY_PASSWORD')
def keyAliasValue = readConfig('BROWSEIT_KEY_ALIAS', 'browseit')

def signingConfigured = !storeFilePath.isBlank() &&
        !storePasswordValue.isBlank() &&
        !keyPasswordValue.isBlank() &&
        !keyAliasValue.isBlank() &&
        project.file(storeFilePath).isFile()

android {
    namespace 'com.looply.browser.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.looply.browser.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', asBuildConfigString(googleWebClientId)
        buildConfigField 'String', 'BROWSEIT_WORKER_URL', asBuildConfigString(workerUrl)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        browseitRelease {
            if (signingConfigured) {
                storeFile file(storeFilePath)
                storeType 'JKS'
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            signingConfig signingConfigured ? signingConfigs.browseitRelease : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/DEPENDENCIES', '/META-INF/LICENSE*', '/META-INF/NOTICE*']
        }
    }
}

tasks.register('verifyBrowseItReleaseSigning') {
    doLast {
        def missing = []
        if (storeFilePath.isBlank()) missing << 'BROWSEIT_KEYSTORE_PATH'
        if (storePasswordValue.isBlank()) missing << 'BROWSEIT_STORE_PASSWORD'
        if (keyPasswordValue.isBlank()) missing << 'BROWSEIT_KEY_PASSWORD'
        if (keyAliasValue.isBlank()) missing << 'BROWSEIT_KEY_ALIAS'
        if (!storeFilePath.isBlank() && !project.file(storeFilePath).isFile()) {
            missing << "keystore file not found at ${storeFilePath}"
        }
        if (!missing.isEmpty()) {
            throw new GradleException('BrowseIt release signing is incomplete: ' + missing.join(', '))
        }
    }
}

tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('release') && task.name != 'verifyBrowseItReleaseSigning') {
        task.dependsOn tasks.named('verifyBrowseItReleaseSigning')
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
}
