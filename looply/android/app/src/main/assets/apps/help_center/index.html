<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    /* Cores do looply_theme.dart — tema claro */
    --bg: #FFFFFF;              /* looplyBgLight */
    --panel: #FFFFFF;           /* looplyPanelLight */
    --panel2: #F0F1F3;          /* looplyPanel2Light */
    --soft: #F8F9FA;            /* looplySoftLight */
    --text: #202124;            /* looplyTextLight */
    --muted: #5F6368;           /* looplyMutedLight */
    --line: #E8EAED;            /* looplyLineLight */
    --outline: #E8EAED;
    --accent: #1A1A1A;          /* looplyPrimary */
    --on-accent: #FFFFFF;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181A;            /* looplyBgDark */
      --panel: #212325;         /* looplyPanelDark */
      --panel2: #2B2D30;        /* looplyPanel2Dark */
      --soft: #1D1F21;          /* looplySoftDark */
      --text: #E6E6E8;          /* looplyTextDark */
      --muted: #B2B4B8;         /* looplyMutedDark */
      --line: #34363A;          /* looplyLineDark */
      --outline: #34363A;
      --accent: #E6E6E8;
      --on-accent: #17181A;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }
  .ic-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

  /* ===== Top App Bar (padrão WeScore) ===== */
  .topbar {
    flex-shrink: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg);
  }

  .app-name {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-weight: 800;
    font-style: italic;
    font-size: 26px;
    letter-spacing: -0.5px;
    color: var(--text);
    white-space: nowrap;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .outline-btn {
    width: 40px;
    height: 40px;
    border-radius: 999px;
    border: 1.5px solid var(--outline);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1), transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
  }
  .outline-btn:active {
    background: var(--panel2);
    transform: scale(0.92);
  }

  /* settings + close NO MESMO container, separados só por divisor */
  .grouped-pill {
    display: flex;
    align-items: center;
    border-radius: 999px;
    border: 1.5px solid var(--outline);
    overflow: hidden;
  }

  .grouped-pill .pill-btn {
    width: 40px;
    height: 40px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    flex-shrink: 0;
    transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1);
  }
  .grouped-pill .pill-btn:active {
    background: var(--panel2);
  }

  .grouped-pill .pill-divider {
    width: 1.5px;
    height: 22px;
    background: var(--outline);
    flex-shrink: 0;
  }

  /* ===== Chat scroll ===== */
  .chat-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .chat-scroll::-webkit-scrollbar { width: 4px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 10px; }

  .day-chip {
    align-self: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: var(--panel2);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 2px;
  }

  .msg-row {
    display: flex;
    gap: 8px;
    max-width: 100%;
    animation: riseIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .msg-row.bot { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    background: var(--panel2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-avatar .material-symbols-rounded { font-size: 16px; color: var(--text); }

  .msg-col { display: flex; flex-direction: column; max-width: 80%; }
  .msg-row.user .msg-col { align-items: flex-end; }

  .msg-bubble {
    padding: 11px 15px;
    font-size: 14.5px;
    line-height: 1.48;
    word-wrap: break-word;
    border: 1px solid var(--line);
  }

  .msg-row.bot .msg-bubble {
    background: var(--panel2);
    color: var(--text);
    border-radius: 4px 20px 20px 20px;
    border: none;
  }

  .msg-row.user .msg-bubble {
    background: var(--accent);
    color: var(--on-accent);
    border-radius: 20px 4px 20px 20px;
    border: none;
  }

  .msg-time {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 4px;
    opacity: 0.8;
  }
  .msg-row.bot .msg-time { margin-left: 4px; }
  .msg-row.user .msg-time { margin-right: 4px; }

  /* ===== Chips de resposta rápida ===== */
  .chips-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-left: 36px;
  }

  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition:
      background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
      transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1);
  }
  .chip:active { transform: scale(0.94); }
  .chip .material-symbols-rounded { font-size: 16px; color: var(--text); }

  /* ===== Cards de tópicos (menu raiz) ===== */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding-left: 36px;
  }

  .topic-card {
    position: relative;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 13px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition:
      background-color 0.3s cubic-bezier(0.2, 0, 0, 1),
      transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1);
  }
  .topic-card:active { transform: scale(0.96); }

  .topic-card .icon-pill {
    width: 36px;
    height: 36px;
    border-radius: 999px;
    background: var(--soft);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 9px;
  }
  .topic-card .icon-pill .material-symbols-rounded { color: var(--text); font-size: 19px; }

  .topic-card-title {
    font-size: 12.8px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  /* ===== Typing indicator ===== */
  .typing-bubble {
    background: var(--panel2);
    border-radius: 4px 20px 20px 20px;
    padding: 13px 16px;
    display: flex;
    gap: 4px;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    opacity: 0.5;
    animation: typingBounce 1.1s ease-in-out infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ===== Escalonamento ===== */
  .escalate-card {
    margin-left: 36px;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 14px 15px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .escalate-card .material-symbols-rounded { color: var(--text); font-size: 24px; flex-shrink: 0; }
  .escalate-text { flex: 1; font-size: 12.8px; color: var(--text); line-height: 1.4; }
  .escalate-text strong { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .escalate-btn {
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 999px;
    padding: 9px 15px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    white-space: nowrap;
    transition: transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1);
  }
  .escalate-btn:active { transform: scale(0.92); }

  /* ===== Composer ===== */
  .composer-wrap {
    flex-shrink: 0;
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    background: var(--panel2);
    border-radius: 999px;
    padding: 6px 6px 6px 18px;
    border: 1px solid var(--line);
  }

  .composer textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.4;
    padding: 9px 0;
    max-height: 90px;
  }
  .composer textarea::placeholder { color: var(--muted); }

  .send-fab {
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition:
      transform 0.45s cubic-bezier(0.34, 1.5, 0.64, 1),
      opacity 0.25s cubic-bezier(0.2, 0, 0, 1);
  }
  .send-fab .material-symbols-rounded { color: var(--on-accent); font-size: 20px; }
  .send-fab:active { transform: scale(0.88); }
  .send-fab:disabled { opacity: 0.4; pointer-events: none; }
</style>
</head>
<body>

<!-- Top App Bar: nome + search isolado + (settings|close) agrupados -->
<div class="topbar">
  <div class="app-name">Nexa</div>
  <div class="topbar-actions">
    <button class="outline-btn" id="btnSearch">
      <span class="material-symbols-rounded">search</span>
    </button>
    <div class="grouped-pill">
      <button class="pill-btn" id="btnSettings">
        <span class="material-symbols-rounded">tune</span>
      </button>
      <div class="pill-divider"></div>
      <button class="pill-btn" id="btnClose">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </div>
</div>

<!-- Chat -->
<div class="chat-scroll" id="chatScroll"></div>

<!-- Composer -->
<div class="composer-wrap">
  <div class="composer">
    <textarea id="inputField" rows="1" placeholder="Escreve a tua pergunta..."></textarea>
    <button class="send-fab" id="sendBtn" disabled>
      <span class="material-symbols-rounded ic-fill">send</span>
    </button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const chatScroll = document.getElementById('chatScroll');
  const inputField  = document.getElementById('inputField');
  const sendBtn     = document.getElementById('sendBtn');
  const btnClose    = document.getElementById('btnClose');

  const KB = {
    root: {
      bot: "Olá! 👋 Sou o assistente virtual do Nexa. Em que posso ajudar-te hoje?",

      bot: "Tudo sobre a tua conta. Escolhe uma opção:",

      bot: "Para recuperares a palavra-passe:\n\n1️⃣ Vai a Definições → Conta\n2️⃣ Toca em \"Esqueci-me da palavra-passe\"\n3️⃣ Vais receber um código por e-mail\n4️⃣ Introduz o código e define uma nova palavra-passe\n\nSe não receberes o e-mail em 5 minutos, verifica o spam.",
      chips: [
        { icon: 'help', label: 'Não recebi o e-mail', key: 'conta_pass_email' },

      ]
    },
    conta_pass_email: {
      bot: "Sem problema! Verifica se:\n\n• O e-mail está na pasta de spam/lixo\n• O endereço associado à conta está correto\n• Aguardaste pelo menos 5 minutos\n\nSe mesmo assim não chegar, posso encaminhar-te para a nossa equipa de suporte.",
      chips: [

    },
    conta_editar: {

      chips: [{ icon: 'arrow_back', label: 'Voltar', key: 'conta' }]
    },
    conta_eliminar: {
      bot: "⚠️ Eliminar a conta é uma ação permanente e remove todos os teus dados, histórico e definições.\n\nPara continuar: Definições → Conta → Eliminar Conta → confirma com a tua palavra-passe.\n\nSe tiveres dúvidas antes de avançar, recomendo falar com o suporte primeiro.",
      chips: [
        { icon: 'headset_mic', label: 'Falar com suporte', key: 'humano' },
        { icon: 'arrow_back', label: 'Voltar', key: 'conta' },
      ]
    },
    pagamentos: {
      bot: "Posso ajudar com faturação e pagamentos:",
      chips: [
        { icon: 'receipt_long', label: 'Ver faturas', key: 'pag_faturas' },
        { icon: 'credit_card', label: 'Alterar método de pagamento', key: 'pag_metodo' },

    },
    pag_faturas: {
      bot: "As tuas faturas estão disponíveis em:\nDefinições → Faturação → Histórico\n\nPodes descarregar cada fatura em PDF tocando no ícone de download ao lado de cada registo.",
      chips: [{ icon: 'arrow_back', label: 'Voltar', key: 'pagamentos' }]

    },
    definicoes: {
      bot: "Sobre as definições da app:",
      chips: [
        { icon: 'dark_mode', label: 'Tema escuro', key: 'def_tema' },

    def_tema: {

      chips: [{ icon: 'arrow_back', label: 'Voltar', key: 'definicoes' }]
    },
    def_notif: {
      bot: "Para gerires as notificações:\nDefinições → Notificações\n\nPodes ativar/desativar por categoria: mensagens, atualizações, promoções e alertas de sistema.",

    },

      bot: "O idioma pode ser alterado em:\nDefinições → Geral → Idioma\n\nA app suporta Português, Inglês, Espanhol e Francês de momento.",

    },
    sync: {
      bot: "Problemas de sincronização costumam resolver-se assim:\n\n1️⃣ Confirma que estás com sessão iniciada na mesma conta em todos os dispositivos\n2️⃣ Verifica a ligação à internet\n3️⃣ Puxa para atualizar (pull-to-refresh) no ecrã principal\n4️⃣ Reinicia a app\n\nA sincronização pode demorar até 2 minutos em redes mais lentas.",
      chips: [
        { icon: 'headset_mic', label: 'Continua sem funcionar', key: 'humano' },

    },
    humano: {
      bot: "Sem problema, vou encaminhar-te para a nossa equipa de suporte humano. Eles costumam responder em poucos minutos durante o horário de atendimento.",

      chips: [{ icon: 'arrow_back', label: 'Voltar ao menu', key: 'root' }]
    },
    fallback: {
      bot: "Não tenho a certeza se percebi 🤔. Podes escolher um dos tópicos abaixo ou reformular a tua pergunta:",

        { icon: 'payments', label: 'Pagamentos', key: 'pagamentos' },
        { icon: 'bug_report', label: 'Reportar Problema', key: 'problema' },
        { icon: 'headset_mic', label: 'Falar com Humano', key: 'humano' },
      ]
    }
  };

  const KEYWORDS = {
    conta_pass: ['senha', 'palavra-passe', 'password', 'esqueci', 'recuperar'],
    conta_editar: ['editar perfil', 'alterar nome', 'mudar foto', 'perfil'],
    conta_eliminar: ['eliminar conta', 'apagar conta', 'deletar conta', 'cancelar conta'],
    pag_faturas: ['fatura', 'faturas', 'recibo', 'invoice'],
    pag_metodo: ['cartão', 'cartao', 'método de pagamento', 'metodo pagamento'],
    pag_cancelar: ['cancelar subscrição', 'cancelar assinatura', 'cancelar plano'],
    prob_carregar: ['não abre', 'nao abre', 'não carrega', 'nao carrega', 'travou', 'crash'],
    sync: ['sincroniza', 'sincronização', 'sync'],
    def_tema: ['tema escuro', 'modo escuro', 'dark mode'],
    def_notif: ['notificaç', 'notificacoes', 'notifications'],
    def_idioma: ['idioma', 'língua', 'language'],
    humano: ['humano', 'agente', 'pessoa real', 'suporte real', 'falar com alguém'],
    conta: ['conta', 'perfil', 'login'],
    pagamentos: ['pagamento', 'pagamentos', 'cobrança', 'preço', 'plano'],
    problema: ['problema', 'erro', 'bug', 'falha'],
    definicoes: ['definições', 'definicoes', 'configurações', 'settings'],
  };

  function matchFreeText(text) {
    const t = text.toLowerCase();
    for (const [key, words] of Object.entries(KEYWORDS)) {
      if (words.some(w => t.includes(w))) return key;
    }
    return null;
  }

  function nowTime() {
    const d = new Date();
    return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function scrollDown() {
    requestAnimationFrame(() => { chatScroll.scrollTop = chatScroll.scrollHeight; });
  }

  function addDayChip() {
    const el = document.createElement('div');
    el.className = 'day-chip';
    el.textContent = 'Hoje';
    chatScroll.appendChild(el);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function nl2br(str) {
    return escapeHtml(str).replace(/\n/g, '<br>');
  }

  function addUserMessage(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-col">
        <div class="msg-bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${nowTime()}</div>
      </div>`;
    chatScroll.appendChild(row);
    scrollDown();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="msg-avatar"><span class="material-symbols-rounded ic-fill" style="font-size:15px;">smart_toy</span></div>
      <div class="typing-bubble">
        <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
      </div>`;
    chatScroll.appendChild(row);
    scrollDown();
  }

  function removeTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
  }

  function addBotMessage(node) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="msg-avatar"><span class="material-symbols-rounded ic-fill" style="font-size:15px;">smart_toy</span></div>
      <div class="msg-col">
        <div class="msg-bubble">${nl2br(node.bot)}</div>
        <div class="msg-time">${nowTime()}</div>
      </div>`;
    chatScroll.appendChild(row);

    if (node.escalate) {
      const esc = document.createElement('div');
      esc.className = 'escalate-card';
      esc.innerHTML = `
        <span class="material-symbols-rounded ic-fill">support_agent</span>
        <div class="escalate-text">
          <strong>A encaminhar para suporte</strong>
          Tempo médio de resposta: 3 minutos
        </div>
        <button class="escalate-btn" id="escBtn">Iniciar chat</button>`;
      chatScroll.appendChild(esc);
      esc.querySelector('#escBtn').addEventListener('click', () => {
        esc.querySelector('.escalate-text').innerHTML = '<strong>Ligado a um agente 🎧</strong>Aguarda só um instante...';
        esc.querySelector('#escBtn').remove();
      });
    }

    if (node.chips) {
      const wrap = document.createElement('div');
      wrap.className = 'chips-wrap';
      node.chips.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.innerHTML = `<span class="material-symbols-rounded">${c.icon}</span>${c.label}`;
        btn.addEventListener('click', () => handleNavigate(c.key, c.label));
        wrap.appendChild(btn);
      });
      chatScroll.appendChild(wrap);
    }

    if (node.cards) {
      const grid = document.createElement('div');
      grid.className = 'card-grid';
      node.cards.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'topic-card';
        btn.innerHTML = `
          <span class="icon-pill"><span class="material-symbols-rounded">${c.icon}</span></span>
          <div class="topic-card-title">${c.label}</div>`;
        btn.addEventListener('click', () => handleNavigate(c.key, c.label));
        grid.appendChild(btn);
      });
      chatScroll.appendChild(grid);
    }

    scrollDown();
  }

  function handleNavigate(key, label) {
    if (label) addUserMessage(label);
    respond(key);
  }

  function respond(key) {
    const node = KB[key] || KB.fallback;
    showTyping();
    const delay = 480 + Math.random() * 380;
    setTimeout(() => {
      removeTyping();
      addBotMessage(node);
    }, delay);
  }

  function autoGrow() {
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 90) + 'px';
  }

  function updateSendState() {
    sendBtn.disabled = inputField.value.trim().length === 0;
  }

  function handleSend() {
    const text = inputField.value.trim();
    if (!text) return;
    addUserMessage(text);
    inputField.value = '';
    autoGrow();
    updateSendState();
    const matched = matchFreeText(text);
    respond(matched || 'fallback');
  }

  inputField.addEventListener('input', () => { autoGrow(); updateSendState(); });
  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  sendBtn.addEventListener('click', handleSend);

  btnClose.addEventListener('click', () => {
    history.back();
  });

  function init() {
    addDayChip();
    showTyping();
    setTimeout(() => {
      removeTyping();
      addBotMessage(KB.root);
    }, 600);
  }

  init();
})();
</script>

</body>
</html>
