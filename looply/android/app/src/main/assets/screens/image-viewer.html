<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Imagem · BrowseIt</title>
<style>
:root{color-scheme:light;--bg:#fff;--surface:#f6f6f7;--surface-2:#ededee;--text:#202124;--muted:#666a70;--accent:#E8890C;--line:#e2e3e5;--shadow:0 8px 28px #0002;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Roboto,"Google Sans",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--bg);z-index:5}
.icon-button{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;transition:background .16s ease,transform .16s cubic-bezier(.2,.8,.2,1)}
.icon-button:active{background:var(--surface-2);transform:scale(.92)}
.icon-button svg{width:24px;height:24px;display:block;fill:currentColor}
#back{margin-left:-6px}
#more{margin-right:-6px}
.viewer{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;background:var(--surface);touch-action:none;overscroll-behavior:contain}
#image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform:translate3d(0,0,0) scale(1);transform-origin:center center;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
.loading,.error{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.error{display:none}
.menu{position:absolute;right:12px;top:50px;z-index:20;min-width:210px;padding:6px;border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:var(--shadow);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s ease,transform .18s cubic-bezier(.2,.8,.2,1)}
.menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.menu-item{width:100%;height:48px;border:0;border-radius:13px;background:transparent;color:var(--text);display:flex;align-items:center;gap:13px;padding:0 12px;text-align:left;font:500 14px Roboto,Arial,sans-serif}
.menu-item:active{background:var(--surface-2)}
.menu-item svg{width:21px;height:21px;fill:currentColor;color:var(--muted);flex:none}
.scrim{position:fixed;inset:0;z-index:10;display:none}
.scrim.visible{display:block}
.dialog-scrim{position:fixed;inset:0;z-index:30;background:#0005;display:none;align-items:center;justify-content:center;padding:24px}
.dialog-scrim.visible{display:flex}
.info-dialog{width:min(100%,340px);border-radius:24px;background:var(--bg);padding:22px;box-shadow:var(--shadow);animation:dialog-in .2s cubic-bezier(.2,.8,.2,1)}
.info-dialog h2{margin:0 0 14px;font-size:18px;font-weight:600}
.info-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.info-row span:first-child{color:var(--muted)}.info-row span:last-child{text-align:right;overflow-wrap:anywhere}
.info-actions{display:flex;justify-content:flex-end;padding-top:16px}
.info-actions button{height:40px;padding:0 18px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-size:14px;font-weight:600}
@keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-button" id="back" type="button" aria-label="Voltar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H4m0 0 7 7m-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="icon-button" id="more" type="button" aria-label="Mais opções" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
  </button>
</header>
<div class="menu" id="menu" role="menu" aria-label="Opções de visualização">
  <button class="menu-item" type="button" data-action="fit" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM6 15v3h3v2H4v-5h2zm12 3v-3h2v5h-5v-2h3zM8 8h8v8H8z"/></svg><span>Ajustar à tela</span></button>
  <button class="menu-item" type="button" data-action="zoom" role="menuitem"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78L20 21.49 21.49 20 15.5 14zm-5 0A4.5 4.5 0 1 1 10.5 5a4.5 4.5 0 0 1 0 9zM11 7H10v2H8v1h2v2h1v-2h2V9h-2z"/></svg><span>Tamanho original / zoom</span></button>
  <button class="menu-item" type="button" data-action="info" role="menuitem"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>Informações da imagem</span></button>
</div>
<div class="scrim" id="menuScrim"></div>
<main class="viewer" id="viewer" aria-label="Visualizador de imagem">
  <div class="loading" id="loading">A carregar imagem…</div>
  <img id="image" alt="Imagem" draggable="false">
  <div class="error" id="error">Não foi possível apresentar esta imagem.</div>
</main>
<div class="dialog-scrim" id="infoScrim" role="presentation">
  <section class="info-dialog" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <h2 id="infoTitle">Informações da imagem</h2>
    <div class="info-row"><span>Nome</span><span id="infoName">—</span></div>
    <div class="info-row"><span>Dimensões</span><span id="infoDimensions">—</span></div>
    <div class="info-row"><span>Formato</span><span id="infoFormat">—</span></div>
    <div class="info-actions"><button id="infoClose" type="button">Fechar</button></div>
  </section>
</div>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const dark=q.get('theme')==='dark',pure=q.get('pure')==='1';
  const root=document.documentElement;
  const palette={
    '--bg':dark?(pure?'#000000':'#191a1c'):'#ffffff',
    '--surface':dark?(pure?'#090909':'#202124'):'#f5f5f6',
    '--surface-2':dark?(pure?'#242424':'#303236'):'#e9eaec',
    '--text':dark?'#f1f1f2':'#202124',
    '--muted':dark?'#b5b7bb':'#62666c',
    '--accent':dark?'#FF9F1C':'#E8890C',
    '--line':dark?(pure?'#292929':'#383a3e'):'#e5e6e8'
  };
  Object.entries(palette).forEach(([k,v])=>root.style.setProperty(k,v));
  const byId=id=>document.getElementById(id);
  const image=byId('image'),viewer=byId('viewer'),loading=byId('loading'),error=byId('error');
  const menu=byId('menu'),more=byId('more'),scrim=byId('menuScrim');
  const name=q.get('name')||'Imagem';
  const source=q.get('src')||'';
  let scale=1,tx=0,ty=0,lastTap=0,touchState=null;
  const close=()=>{if(window.AndroidViewer&&typeof AndroidViewer.close==='function')AndroidViewer.close();else history.back();};
  byId('back').addEventListener('click',close);
  function applyTransform(){image.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;}
  function resetView(){scale=1;tx=0;ty=0;applyTransform();}
  function clampPan(){
    const maxX=Math.max(0,(viewer.clientWidth*(scale-1))/2+viewer.clientWidth*.15);
    const maxY=Math.max(0,(viewer.clientHeight*(scale-1))/2+viewer.clientHeight*.15);
    tx=Math.max(-maxX,Math.min(maxX,tx));ty=Math.max(-maxY,Math.min(maxY,ty));
  }
  function showMenu(show){menu.classList.toggle('open',show);scrim.classList.toggle('visible',show);more.setAttribute('aria-expanded',String(show));}
  more.addEventListener('click',()=>showMenu(!menu.classList.contains('open')));
  scrim.addEventListener('click',()=>showMenu(false));
  menu.addEventListener('click',e=>{
    const button=e.target.closest('[data-action]');if(!button)return;
    const action=button.dataset.action;showMenu(false);
    if(action==='fit')resetView();
    if(action==='zoom'){scale=scale===1?2:1;if(scale===1){tx=0;ty=0;}applyTransform();}
    if(action==='info')showInfo();
  });
  function showInfo(){
    byId('infoName').textContent=name;
    byId('infoDimensions').textContent=image.naturalWidth?`${image.naturalWidth} × ${image.naturalHeight} px`:'—';
    byId('infoFormat').textContent=(name.split('.').pop()||'Imagem').toUpperCase();
    byId('infoScrim').classList.add('visible');
  }
  function hideInfo(){byId('infoScrim').classList.remove('visible');}
  byId('infoClose').addEventListener('click',hideInfo);
  byId('infoScrim').addEventListener('click',e=>{if(e.target===byId('infoScrim'))hideInfo();});
  image.addEventListener('load',()=>{loading.style.display='none';error.style.display='none';resetView();});
  image.addEventListener('error',()=>{loading.style.display='none';error.style.display='block';image.style.display='none';});
  image.src=source;
  viewer.addEventListener('touchstart',e=>{
    if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;touchState={mode:'pinch',distance:Math.hypot(dx,dy),scale,startX:(e.touches[0].clientX+e.touches[1].clientX)/2,startY:(e.touches[0].clientY+e.touches[1].clientY)/2,tx,ty};}
    else if(e.touches.length===1){const now=Date.now();if(now-lastTap<280){scale=scale===1?2.4:1;if(scale===1){tx=0;ty=0;}applyTransform();lastTap=0;touchState=null;return;}lastTap=now;touchState={mode:'pan',x:e.touches[0].clientX,y:e.touches[0].clientY,tx,ty};}
  },{passive:true});
  viewer.addEventListener('touchmove',e=>{
    if(!touchState)return;
    if(touchState.mode==='pinch'&&e.touches.length===2){e.preventDefault();const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const dist=Math.hypot(dx,dy);scale=Math.max(1,Math.min(5,touchState.scale*(dist/Math.max(1,touchState.distance))));const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;tx=touchState.tx+(mx-touchState.startX);ty=touchState.ty+(my-touchState.startY);clampPan();applyTransform();}
    else if(touchState.mode==='pan'&&e.touches.length===1&&scale>1){e.preventDefault();tx=touchState.tx+e.touches[0].clientX-touchState.x;ty=touchState.ty+e.touches[0].clientY-touchState.y;clampPan();applyTransform();}
  },{passive:false});
  viewer.addEventListener('touchend',e=>{if(e.touches.length===0)touchState=null;else if(e.touches.length===1)touchState={mode:'pan',x:e.touches[0].clientX,y:e.touches[0].clientY,tx,ty};});
  viewer.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(1,Math.min(5,scale*(e.deltaY<0?1.15:.87)));if(scale===1){tx=0;ty=0;}clampPan();applyTransform();},{passive:false});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){showMenu(false);hideInfo();}if(e.key==='Backspace')close();});
})();
</script>
</body>
</html>
