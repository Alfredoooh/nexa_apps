<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Editor de PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root {
    --primary: #1A73E8;
    --bg: #FFFFFF;
    --panel-2: #F0F1F3;
    --soft: #F8F9FA;
    --text: #202124;
    --muted: #5F6368;
    --line: #E8EAED;
    --danger: #D93025;
    --r-pill: 999px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }

  html, body, button, .pdf-icon-btn, .tool-chip, .tab-btn, .pdf-page-indicator, .msr {
    -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  }

  .text-input, .text-input::selection { -webkit-user-select: text; user-select: text; }

  html, body { height: 100%; margin: 0; overscroll-behavior: none; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans Text", -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .msr {
    font-family: "Material Symbols Rounded";
    font-weight: 500;
    font-style: normal;
    font-size: 21px;
    line-height: 1;
    display: inline-block;
    vertical-align: middle;
    font-variation-settings: 'FILL' 0, 'wght' 500, 'opsz' 24, 'GRAD' 0;
  }

  .msr.filled { font-variation-settings: 'FILL' 1, 'wght' 500, 'opsz' 24, 'GRAD' 0; }

  .topbar { flex-shrink: 0; height: calc(10px + env(safe-area-inset-top)); }

  /* ---------- Toolbar superior ---------- */

  .pdf-toolbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px 10px;
  }

  .pager { display: flex; align-items: center; gap: 4px; background: var(--panel-2); border-radius: var(--r-pill); padding: 4px 6px; }

  .pdf-icon-btn {
    width: 38px; height: 38px; border-radius: 50%; border: none; background: transparent; color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .pdf-icon-btn:active { transform: scale(0.88); }
  .pdf-icon-btn:disabled { opacity: 0.3; pointer-events: none; }

  .pdf-page-indicator { font-size: 13px; font-weight: 700; min-width: 54px; text-align: center; font-variant-numeric: tabular-nums; }

  .pdf-spacer { flex: 1; }

  /* ---------- Área de páginas ---------- */

  .pdf-canvas-wrap {
    flex: 1;
    overflow: auto;
    background: var(--soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .pdf-page-canvas { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.15), 0 1px 2px rgba(0,0,0,0.08); border-radius: 2px; max-width: 100%; touch-action: pan-y; }

  .pdf-page-shell { position: relative; display: inline-block; }
  .pdf-page-shell.selected .pdf-page-canvas { outline: 3px solid var(--primary); outline-offset: 2px; }

  .pdf-page-badge {
    position: absolute; top: 8px; left: 8px; background: rgba(32,33,36,0.72); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: var(--r-pill);
  }

  .pdf-page-check {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.9); border: 2px solid var(--line);
    display: none; align-items: center; justify-content: center;
  }
  .pdf-edit-mode .pdf-page-check { display: flex; }
  .pdf-page-shell.selected .pdf-page-check { background: var(--primary); border-color: var(--primary); color: #fff; }

  .pdf-sign-overlay {
    position: absolute;
    touch-action: none;
    cursor: grab;
    border: 1.5px dashed transparent;
  }
  .pdf-sign-overlay.editing { border-color: var(--primary); }
  .pdf-sign-overlay img, .pdf-sign-overlay span { pointer-events: none; display: block; }
  .pdf-sign-overlay span {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .pdf-empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); padding: 24px; text-align: center;
  }
  .pdf-empty-state .msr { font-size: 48px; color: var(--line); }

  .pdf-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; flex: 1; color: var(--muted); font-size: 13px; }

  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Painel contextual (acima da bottombar) ---------- */

  .tool-chip-row { flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 2px 16px 10px; display: none; }
  .tool-chip-row.visible { display: flex; }

  .tool-chip-scroll { flex: 1; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tool-chip-scroll::-webkit-scrollbar { display: none; }

  .tool-chip {
    flex-shrink: 0; height: 40px; padding: 0 18px; border-radius: var(--r-pill);
    background: transparent; border: 1.5px solid var(--line); color: var(--muted);
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease, transform 0.1s ease;
    display: flex; align-items: center; gap: 6px;
  }
  .tool-chip:active { transform: scale(0.95); }
  .tool-chip.selected { background: var(--panel-2); border-color: var(--text); color: var(--text); }
  .tool-chip.danger { color: var(--danger); border-color: var(--danger); }

  .fab-confirm {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: var(--r-pill);
    background: var(--panel-2); border: none; color: var(--text);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .fab-confirm:active { transform: scale(0.9); }
  .fab-confirm.filled { background: var(--primary); color: #fff; }

  /* ---------- Painel de texto / assinatura ---------- */

  .text-add-panel { flex-shrink: 0; padding: 2px 16px 10px; display: none; flex-direction: column; gap: 10px; }
  .text-add-panel.visible { display: flex; }

  .text-add-row { display: flex; gap: 10px; }
  .text-input { flex: 1; height: 48px; border-radius: var(--r-pill); background: var(--panel-2); border: none; color: var(--text); font-family: inherit; font-size: 14px; padding: 0 18px; outline: none; }
  .text-input::placeholder { color: var(--muted); }
  .text-add-btn { flex-shrink: 0; width: 48px; height: 48px; border-radius: var(--r-pill); background: var(--primary); border: none; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .sign-pad-wrap { display: flex; flex-direction: column; gap: 10px; }
  .sign-pad-canvas { width: 100%; height: 140px; background: var(--panel-2); border-radius: 14px; touch-action: none; }
  .sign-pad-actions { display: flex; gap: 8px; }

  /* ---------- Bottom tabbar: ferramentas de edição, pílulas sem label ---------- */

  .tabbar-wrap { flex-shrink: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }

  .tabbar { display: flex; justify-content: space-between; gap: 6px; background: var(--panel-2); border-radius: var(--r-pill); padding: 6px; }

  .tab-btn {
    position: relative; flex: 1; display: flex; align-items: center; justify-content: center; height: 46px;
    border: none; background: transparent; border-radius: var(--r-pill); color: var(--muted); cursor: pointer;
    transition: background 0.3s cubic-bezier(0.34, 1.4, 0.4, 1), color 0.25s ease, transform 0.15s cubic-bezier(.2,0,0,1);
  }
  .tab-btn .msr { font-size: 21px; }
  .tab-btn:active { transform: scale(0.88); }
  .tab-btn.active { background: var(--primary); color: #fff; }
  .tab-btn.danger.active { background: var(--danger); }

  .toast {
    position: fixed; bottom: calc(96px + env(safe-area-inset-bottom)); left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500;
    padding: 10px 18px; border-radius: var(--r-pill); z-index: 100;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex; align-items: center; gap: 7px;
  }
  .toast .msr { font-size: 18px; color: #AECBFA; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <div class="topbar"></div>

  <div class="pdf-toolbar">
    <button class="pdf-icon-btn" id="pdfModeToggle" aria-label="Selecionar páginas"><span class="msr" id="pdfModeIcon">checklist</span></button>
    <div class="pdf-spacer"></div>
    <div class="pager">
      <button class="pdf-icon-btn" id="pdfPrevBtn" aria-label="Página anterior"><span class="msr">chevron_left</span></button>
      <span class="pdf-page-indicator" id="pdfPageIndicator">–</span>
      <button class="pdf-icon-btn" id="pdfNextBtn" aria-label="Próxima página"><span class="msr">chevron_right</span></button>
    </div>
    <div class="pdf-spacer"></div>
    <button class="pdf-icon-btn" id="pdfDownloadBtn" aria-label="Descarregar"><span class="msr">download</span></button>
  </div>

  <div class="pdf-canvas-wrap" id="pdfCanvasWrap">
    <div class="pdf-loading" id="pdfLoading">
      <div class="spinner"></div>
      <span>A carregar document.pdf…</span>
    </div>
  </div>

  <!-- Chips contextuais: Selecionar páginas -->
  <div class="tool-chip-row" id="chipsSelect">
    <div class="tool-chip-scroll">
      <button class="tool-chip" id="chipRotateSel"><span class="msr" style="font-size:18px;">rotate_right</span>Girar</button>
      <button class="tool-chip" id="chipDuplicateSel"><span class="msr" style="font-size:18px;">content_copy</span>Duplicar</button>
      <button class="tool-chip" id="chipMoveUpSel"><span class="msr" style="font-size:18px;">arrow_upward</span>Mover para cima</button>
      <button class="tool-chip" id="chipMoveDownSel"><span class="msr" style="font-size:18px;">arrow_downward</span>Mover para baixo</button>
      <button class="tool-chip danger" id="chipDeleteSel"><span class="msr" style="font-size:18px;">delete</span>Eliminar</button>
    </div>
  </div>

  <!-- Chips contextuais: Girar página atual -->
  <div class="tool-chip-row" id="chipsRotate">
    <div class="tool-chip-scroll">
      <button class="tool-chip" id="chipRotateLeft"><span class="msr" style="font-size:18px;">rotate_left</span>Esquerda</button>
      <button class="tool-chip" id="chipRotateRight"><span class="msr" style="font-size:18px;">rotate_right</span>Direita</button>
      <button class="tool-chip" id="chipRotateAll">Girar todas</button>
    </div>
    <button class="fab-confirm filled" id="applyRotateBtn" aria-label="Confirmar"><span class="msr filled">check</span></button>
  </div>

  <!-- Painel: adicionar texto -->
  <div class="text-add-panel" id="panelAddText">
    <div class="text-add-row">
      <input type="text" class="text-input" id="pdfTextInput" placeholder="Escreva algo para colocar na página…">
      <button class="text-add-btn" id="pdfAddTextBtn"><span class="msr">add</span></button>
    </div>
  </div>

  <!-- Painel: assinatura -->
  <div class="text-add-panel" id="panelSign">
    <div class="sign-pad-wrap">
      <canvas class="sign-pad-canvas" id="signPadCanvas"></canvas>
      <div class="sign-pad-actions">
        <button class="tool-chip" id="signClearBtn" style="flex:1; justify-content:center;">Limpar</button>
        <button class="tool-chip" id="signPlaceBtn" style="flex:1; justify-content:center; background:var(--primary); color:#fff; border-color:var(--primary);">Colocar na página</button>
      </div>
    </div>
  </div>

  <!-- Bottom tabbar: ferramentas -->
  <div class="tabbar-wrap">
    <div class="tabbar" id="tabbar">
      <button class="tab-btn" data-tool="select" aria-label="Selecionar páginas"><span class="msr">checklist</span></button>
      <button class="tab-btn" data-tool="rotate" aria-label="Girar"><span class="msr">rotate_right</span></button>
      <button class="tab-btn" data-tool="text" aria-label="Texto"><span class="msr">title</span></button>
      <button class="tab-btn" data-tool="sign" aria-label="Assinatura"><span class="msr">draw</span></button>
      <button class="tab-btn danger" data-tool="delete" aria-label="Eliminar página"><span class="msr">delete</span></button>
      <button class="tab-btn" data-tool="save" aria-label="Guardar"><span class="msr">save</span></button>
    </div>
  </div>

  <div class="toast" id="toast"><span class="msr filled">check_circle</span><span id="toastText"></span></div>

<script>
(function () {
  'use strict';

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';
  }

  var pdfCanvasWrap = document.getElementById('pdfCanvasWrap');
  var pdfLoading = document.getElementById('pdfLoading');
  var pdfModeToggle = document.getElementById('pdfModeToggle');
  var pdfModeIcon = document.getElementById('pdfModeIcon');
  var pdfPrevBtn = document.getElementById('pdfPrevBtn');
  var pdfNextBtn = document.getElementById('pdfNextBtn');
  var pdfPageIndicator = document.getElementById('pdfPageIndicator');
  var pdfDownloadBtn = document.getElementById('pdfDownloadBtn');

  var tabbar = document.getElementById('tabbar');
  var chipsSelect = document.getElementById('chipsSelect');
  var chipsRotate = document.getElementById('chipsRotate');
  var panelAddText = document.getElementById('panelAddText');
  var panelSign = document.getElementById('panelSign');

  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');

  var state = {
    pdfBytes: null,
    pdfjsDoc: null,
    pageShells: [],
    selected: new Set(),
    editMode: false,
    currentVisiblePage: 1,
    activeTool: null,
    pendingSignatureDataUrl: null
  };

  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 1500);
  }

  function setPdfLoading(msg) {
    pdfCanvasWrap.innerHTML = '';
    pdfCanvasWrap.appendChild(pdfLoading);
    pdfLoading.querySelector('span').textContent = msg;
    pdfLoading.style.display = 'flex';
  }

  function setPdfEmpty(msg) {
    pdfCanvasWrap.innerHTML = '<div class="pdf-empty-state"><span class="msr">picture_as_pdf</span><span>' + msg + '</span></div>';
  }

  function loadPdfFromRoot() {
    setPdfLoading('A carregar document.pdf…');
    fetch('./document.pdf')
      .then(function (res) { if (!res.ok) throw new Error('not found'); return res.arrayBuffer(); })
      .then(function (buf) { state.pdfBytes = buf; return renderAllPages(buf); })
      .catch(function () { setPdfEmpty('Não encontrei document.pdf na raiz'); });
  }

  function renderAllPages(arrayBufferLike) {
    var bytesCopy = arrayBufferLike.slice(0);
    return pdfjsLib.getDocument({ data: bytesCopy }).promise.then(function (pdfDoc) {
      state.pdfjsDoc = pdfDoc;
      pdfCanvasWrap.innerHTML = '';
      state.pageShells = [];
      pdfPageIndicator.textContent = '1 / ' + pdfDoc.numPages;

      var renderChain = Promise.resolve();
      var _loop = function (pageNum) {
        renderChain = renderChain.then(function () { return renderSinglePage(pdfDoc, pageNum); });
      };
      for (var i = 1; i <= pdfDoc.numPages; i++) { _loop(i); }
      return renderChain;
    });
  }

  function renderSinglePage(pdfDoc, pageNum) {
    return pdfDoc.getPage(pageNum).then(function (page) {
      var viewport = page.getViewport({ scale: 1.4 });
      var pageCanvas = document.createElement('canvas');
      pageCanvas.className = 'pdf-page-canvas';
      pageCanvas.width = viewport.width;
      pageCanvas.height = viewport.height;
      var pctx = pageCanvas.getContext('2d');

      var shell = document.createElement('div');
      shell.className = 'pdf-page-shell';
      shell.dataset.page = pageNum;

      var badge = document.createElement('span');
      badge.className = 'pdf-page-badge';
      badge.textContent = pageNum;

      var check = document.createElement('span');
      check.className = 'pdf-page-check';
      check.innerHTML = '<span class="msr filled" style="font-size:16px;">check</span>';

      shell.appendChild(pageCanvas);
      shell.appendChild(badge);
      shell.appendChild(check);
      pdfCanvasWrap.appendChild(shell);
      state.pageShells.push(shell);

      shell.addEventListener('click', function (e) {
        if (state.editMode) { togglePageSelection(pageNum, shell); return; }
        if (state.activeTool === 'text') { placeTextAt(shell, pageCanvas, e); return; }
        if (state.activeTool === 'sign' && state.pendingSignatureDataUrl) { placeSignatureAt(shell, pageCanvas, e); return; }
      });

      return page.render({ canvasContext: pctx, viewport: viewport }).promise;
    });
  }

  function togglePageSelection(pageNum, shell) {
    if (state.selected.has(pageNum)) { state.selected.delete(pageNum); shell.classList.remove('selected'); }
    else { state.selected.add(pageNum); shell.classList.add('selected'); }
  }

  /* ---------- tabbar de ferramentas ---------- */

  function hideAllPanels() {
    chipsSelect.classList.remove('visible');
    chipsRotate.classList.remove('visible');
    panelAddText.classList.remove('visible');
    panelSign.classList.remove('visible');
    pdfCanvasWrap.classList.remove('pdf-edit-mode');
    state.editMode = false;
    pdfModeIcon.textContent = 'checklist';
  }

  function setActiveTab(tool) {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tool === tool); });
  }

  tabbar.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    var tool = btn.dataset.tool;

    if (tool === 'save') { downloadCurrentPdf(); showToast('PDF guardado'); return; }

    if (tool === 'delete') {
      state.activeTool = null;
      setActiveTab(null);
      hideAllPanels();
      state.editMode = true;
      pdfModeIcon.textContent = 'close';
      pdfCanvasWrap.classList.add('pdf-edit-mode');
      chipsSelect.classList.add('visible');
      showToast('Toque nas páginas e depois em Eliminar');
      return;
    }

    if (state.activeTool === tool) {
      state.activeTool = null;
      setActiveTab(null);
      hideAllPanels();
      return;
    }

    state.activeTool = tool;
    setActiveTab(tool);
    hideAllPanels();

    if (tool === 'select') {
      state.editMode = true;
      pdfModeIcon.textContent = 'close';
      pdfCanvasWrap.classList.add('pdf-edit-mode');
      chipsSelect.classList.add('visible');
    } else if (tool === 'rotate') {
      chipsRotate.classList.add('visible');
    } else if (tool === 'text') {
      panelAddText.classList.add('visible');
      showToast('Toque numa página para colocar o texto');
    } else if (tool === 'sign') {
      panelSign.classList.add('visible');
      initSignPad();
    }
  });

  pdfModeToggle.addEventListener('click', function () {
    if (state.editMode) {
      hideAllPanels();
      state.activeTool = null;
      setActiveTab(null);
      state.selected.clear();
      state.pageShells.forEach(function (s) { s.classList.remove('selected'); });
    } else {
      state.activeTool = 'select';
      setActiveTab('select');
      hideAllPanels();
      state.editMode = true;
      pdfModeIcon.textContent = 'close';
      pdfCanvasWrap.classList.add('pdf-edit-mode');
      chipsSelect.classList.add('visible');
    }
  });

  /* ---------- paginação ---------- */

  function scrollToPage(num) {
    var shell = state.pageShells[num - 1];
    if (shell) shell.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  pdfPrevBtn.addEventListener('click', function () {
    if (state.currentVisiblePage > 1) { state.currentVisiblePage--; updatePageIndicator(); scrollToPage(state.currentVisiblePage); }
  });
  pdfNextBtn.addEventListener('click', function () {
    if (state.pdfjsDoc && state.currentVisiblePage < state.pdfjsDoc.numPages) { state.currentVisiblePage++; updatePageIndicator(); scrollToPage(state.currentVisiblePage); }
  });

  function updatePageIndicator() {
    if (!state.pdfjsDoc) return;
    pdfPageIndicator.textContent = state.currentVisiblePage + ' / ' + state.pdfjsDoc.numPages;
  }

  pdfCanvasWrap.addEventListener('scroll', function () {
    if (!state.pageShells.length) return;
    var wrapTop = pdfCanvasWrap.getBoundingClientRect().top;
    var closest = 1, closestDist = Infinity;
    state.pageShells.forEach(function (shell, idx) {
      var dist = Math.abs(shell.getBoundingClientRect().top - wrapTop);
      if (dist < closestDist) { closestDist = dist; closest = idx + 1; }
    });
    state.currentVisiblePage = closest;
    updatePageIndicator();
  });

  /* ---------- rebuild depois de cada edição via pdf-lib ---------- */

  function rebuildFromLib(pdfLibDoc) {
    return pdfLibDoc.save().then(function (bytes) {
      state.pdfBytes = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
      return renderAllPages(state.pdfBytes);
    });
  }

  function clearSelectionUi() {
    state.selected.clear();
    hideAllPanels();
    state.activeTool = null;
    setActiveTab(null);
  }

  /* ---------- chips: seleção de páginas ---------- */

  document.getElementById('chipDeleteSel').addEventListener('click', function () {
    if (!state.selected.size || !state.pdfBytes) { showToast('Selecione páginas primeiro'); return; }
    var toDelete = Array.from(state.selected).sort(function (a, b) { return b - a; });
    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      if (doc.getPageCount() - toDelete.length < 1) { showToast('Não é possível eliminar todas as páginas'); return; }
      toDelete.forEach(function (pageNum) { doc.removePage(pageNum - 1); });
      return rebuildFromLib(doc).then(function () { clearSelectionUi(); showToast('Páginas eliminadas'); });
    });
  });

  document.getElementById('chipRotateSel').addEventListener('click', function () {
    if (!state.selected.size || !state.pdfBytes) { showToast('Selecione páginas primeiro'); return; }
    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      var pages = doc.getPages();
      state.selected.forEach(function (pageNum) {
        var p = pages[pageNum - 1];
        var current = p.getRotation().angle;
        p.setRotation(PDFLib.degrees((current + 90) % 360));
      });
      return rebuildFromLib(doc).then(function () { showToast('Páginas giradas'); });
    });
  });

  document.getElementById('chipDuplicateSel').addEventListener('click', function () {
    if (!state.selected.size || !state.pdfBytes) { showToast('Selecione páginas primeiro'); return; }
    var toDuplicate = Array.from(state.selected).sort(function (a, b) { return a - b; });
    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      return doc.copyPages(doc, toDuplicate.map(function (n) { return n - 1; })).then(function (copied) {
        copied.forEach(function (p, i) { doc.insertPage(toDuplicate[i], p); });
        return rebuildFromLib(doc).then(function () { clearSelectionUi(); showToast('Páginas duplicadas'); });
      });
    });
  });

  document.getElementById('chipMoveUpSel').addEventListener('click', function () {
    if (state.selected.size !== 1 || !state.pdfBytes) { showToast('Selecione apenas uma página'); return; }
    var pageNum = Array.from(state.selected)[0];
    if (pageNum <= 1) return;
    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      var indices = doc.getPageIndices();
      var newOrder = indices.slice();
      var idx = pageNum - 1;
      var tmp = newOrder[idx - 1]; newOrder[idx - 1] = newOrder[idx]; newOrder[idx] = tmp;
      return reorderPages(doc, newOrder).then(function () { showToast('Página movida'); });
    });
  });

  document.getElementById('chipMoveDownSel').addEventListener('click', function () {
    if (state.selected.size !== 1 || !state.pdfBytes) { showToast('Selecione apenas uma página'); return; }
    var pageNum = Array.from(state.selected)[0];
    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      if (pageNum >= doc.getPageCount()) return;
      var indices = doc.getPageIndices();
      var newOrder = indices.slice();
      var idx = pageNum - 1;
      var tmp = newOrder[idx + 1]; newOrder[idx + 1] = newOrder[idx]; newOrder[idx] = tmp;
      return reorderPages(doc, newOrder).then(function () { showToast('Página movida'); });
    });
  });

  function reorderPages(originalDoc, newOrder) {
    return PDFLib.PDFDocument.create().then(function (newDoc) {
      return newDoc.copyPages(originalDoc, newOrder).then(function (pages) {
        pages.forEach(function (p) { newDoc.addPage(p); });
        return rebuildFromLib(newDoc).then(function () { clearSelectionUi(); });
      });
    });
  }

  /* ---------- chips: girar página atual ---------- */

  document.getElementById('chipRotateLeft').addEventListener('click', function () { this.classList.toggle('selected'); document.getElementById('chipRotateRight').classList.remove('selected'); });
  document.getElementById('chipRotateRight').addEventListener('click', function () { this.classList.toggle('selected'); document.getElementById('chipRotateLeft').classList.remove('selected'); });
  document.getElementById('chipRotateAll').addEventListener('click', function () { this.classList.toggle('selected'); });

  document.getElementById('applyRotateBtn').addEventListener('click', function () {
    if (!state.pdfBytes) return;
    var dir = document.getElementById('chipRotateLeft').classList.contains('selected') ? -90
            : document.getElementById('chipRotateRight').classList.contains('selected') ? 90 : null;
    if (dir === null) { showToast('Escolha uma direção'); return; }
    var all = document.getElementById('chipRotateAll').classList.contains('selected');

    PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      var pages = doc.getPages();
      var targets = all ? pages : [pages[state.currentVisiblePage - 1]];
      targets.forEach(function (p) {
        var current = p.getRotation().angle;
        p.setRotation(PDFLib.degrees(((current + dir) % 360 + 360) % 360));
      });
      return rebuildFromLib(doc).then(function () { showToast('Rotação aplicada'); });
    });
  });

  /* ---------- texto na página ---------- */

  document.getElementById('pdfAddTextBtn').addEventListener('click', function () {
    var val = document.getElementById('pdfTextInput').value.trim();
    if (!val) { showToast('Escreva algo primeiro'); return; }
    showToast('Toque na página para colocar: "' + val + '"');
  });

  function placeTextAt(shell, pageCanvas, clickEvent) {
    var val = document.getElementById('pdfTextInput').value.trim();
    if (!val) { showToast('Escreva algo primeiro'); return; }

    var rect = pageCanvas.getBoundingClientRect();
    var relX = clickEvent.clientX - rect.left;
    var relY = clickEvent.clientY - rect.top;

    var overlay = document.createElement('div');
    overlay.className = 'pdf-sign-overlay';
    overlay.style.left = relX + 'px';
    overlay.style.top = relY + 'px';
    overlay.dataset.kind = 'text';
    overlay.dataset.value = val;
    overlay.dataset.pdfX = (relX / rect.width).toFixed(4);
    overlay.dataset.pdfY = (relY / rect.height).toFixed(4);

    var span = document.createElement('span');
    span.textContent = val;
    overlay.appendChild(span);
    shell.appendChild(overlay);
    makeOverlayDraggable(overlay, shell);

    document.getElementById('pdfTextInput').value = '';
    showToast('Texto colocado — arraste para ajustar');
  }

  /* ---------- assinatura via canvas ---------- */

  var signCtx = null;
  var signDrawing = false;
  var signHasStroke = false;

  function initSignPad() {
    var c = document.getElementById('signPadCanvas');
    var ratio = window.devicePixelRatio || 1;
    c.width = c.clientWidth * ratio;
    c.height = c.clientHeight * ratio;
    signCtx = c.getContext('2d');
    signCtx.scale(ratio, ratio);
    signCtx.lineJoin = 'round';
    signCtx.lineCap = 'round';
    signCtx.lineWidth = 3;
    signCtx.strokeStyle = '#202124';
    signHasStroke = false;

    c.ontouchstart = function (e) {
      signDrawing = true;
      var p = signPt(c, e.touches[0]);
      signCtx.beginPath();
      signCtx.moveTo(p.x, p.y);
    };
    c.ontouchmove = function (e) {
      if (!signDrawing) return;
      var p = signPt(c, e.touches[0]);
      signCtx.lineTo(p.x, p.y);
      signCtx.stroke();
      signHasStroke = true;
    };
    c.ontouchend = function () { signDrawing = false; };
  }

  function signPt(c, touch) {
    var rect = c.getBoundingClientRect();
    return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
  }

  document.getElementById('signClearBtn').addEventListener('click', function () {
    var c = document.getElementById('signPadCanvas');
    signCtx.clearRect(0, 0, c.width, c.height);
    signHasStroke = false;
  });

  document.getElementById('signPlaceBtn').addEventListener('click', function () {
    if (!signHasStroke) { showToast('Desenhe a assinatura primeiro'); return; }
    var c = document.getElementById('signPadCanvas');
    state.pendingSignatureDataUrl = c.toDataURL('image/png');
    showToast('Toque numa página para colocar a assinatura');
  });

  function placeSignatureAt(shell, pageCanvas, clickEvent) {
    if (!state.pendingSignatureDataUrl) return;

    var rect = pageCanvas.getBoundingClientRect();
    var relX = clickEvent.clientX - rect.left;
    var relY = clickEvent.clientY - rect.top;
    var boxW = 140, boxH = 60;

    var overlay = document.createElement('div');
    overlay.className = 'pdf-sign-overlay';
    overlay.style.left = (relX - boxW / 2) + 'px';
    overlay.style.top = (relY - boxH / 2) + 'px';
    overlay.style.width = boxW + 'px';
    overlay.style.height = boxH + 'px';
    overlay.dataset.kind = 'signature';
    overlay.dataset.dataUrl = state.pendingSignatureDataUrl;
    overlay.dataset.pdfX = ((relX - boxW / 2) / rect.width).toFixed(4);
    overlay.dataset.pdfY = ((relY - boxH / 2) / rect.height).toFixed(4);
    overlay.dataset.pdfW = (boxW / rect.width).toFixed(4);
    overlay.dataset.pdfH = (boxH / rect.height).toFixed(4);

    var img = document.createElement('img');
    img.src = state.pendingSignatureDataUrl;
    img.style.width = '100%';
    img.style.height = '100%';
    img.style.objectFit = 'contain';
    overlay.appendChild(img);
    shell.appendChild(overlay);
    makeOverlayDraggable(overlay, shell);

    showToast('Assinatura colocada — arraste para ajustar e guarde');
  }

  function makeOverlayDraggable(overlay, shell) {
    var state2 = null;
    overlay.addEventListener('touchstart', function (e) {
      e.stopPropagation();
      var t = e.touches[0];
      state2 = { startX: t.clientX, startY: t.clientY, originLeft: parseFloat(overlay.style.left), originTop: parseFloat(overlay.style.top) };
    }, { passive: true });

    overlay.addEventListener('touchmove', function (e) {
      if (!state2) return;
      e.stopPropagation();
      var t = e.touches[0];
      var dx = t.clientX - state2.startX;
      var dy = t.clientY - state2.startY;
      var newLeft = state2.originLeft + dx;
      var newTop = state2.originTop + dy;
      overlay.style.left = newLeft + 'px';
      overlay.style.top = newTop + 'px';

      var pageCanvas = shell.querySelector('.pdf-page-canvas');
      overlay.dataset.pdfX = (newLeft / pageCanvas.clientWidth).toFixed(4);
      overlay.dataset.pdfY = (newTop / pageCanvas.clientHeight).toFixed(4);
    }, { passive: true });

    overlay.addEventListener('touchend', function (e) { e.stopPropagation(); state2 = null; });
  }

  /* ---------- gravar overlays (texto/assinatura) no PDF real via pdf-lib ---------- */

  function bakeOverlaysIntoPdf() {
    var overlays = Array.from(document.querySelectorAll('.pdf-sign-overlay'));
    if (!overlays.length || !state.pdfBytes) return Promise.resolve();

    return PDFLib.PDFDocument.load(state.pdfBytes).then(function (doc) {
      var fontPromise = doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      var imagePromises = overlays
        .filter(function (o) { return o.dataset.kind === 'signature'; })
        .map(function (o) {
          return fetch(o.dataset.dataUrl)
            .then(function (r) { return r.arrayBuffer(); })
            .then(function (buf) { return doc.embedPng(buf).then(function (img) { o._embeddedImg = img; }); });
        });

      return Promise.all([fontPromise].concat(imagePromises)).then(function (results) {
        var font = results[0];
        var pages = doc.getPages();

        overlays.forEach(function (o) {
          var shell = o.closest('.pdf-page-shell');
          var pageNum = parseInt(shell.dataset.page, 10);
          var page = pages[pageNum - 1];
          var pdfPageHeight = page.getHeight();
          var pdfPageWidth = page.getWidth();

          var relX = parseFloat(o.dataset.pdfX);
          var relY = parseFloat(o.dataset.pdfY);

          if (o.dataset.kind === 'text') {
            var fontSize = 16;
            page.drawText(o.dataset.value, {
              x: relX * pdfPageWidth,
              y: pdfPageHeight - (relY * pdfPageHeight) - fontSize,
              size: fontSize,
              font: font,
              color: PDFLib.rgb(0.12, 0.13, 0.14)
            });
          } else if (o.dataset.kind === 'signature' && o._embeddedImg) {
            var relW = parseFloat(o.dataset.pdfW);
            var relH = parseFloat(o.dataset.pdfH);
            var drawW = relW * pdfPageWidth;
            var drawH = relH * pdfPageHeight;
            page.drawImage(o._embeddedImg, {
              x: relX * pdfPageWidth,
              y: pdfPageHeight - (relY * pdfPageHeight) - drawH,
              width: drawW,
              height: drawH
            });
          }
          o.remove();
        });

        return rebuildFromLib(doc);
      });
    });
  }

  /* ---------- download ---------- */

  function downloadCurrentPdf() {
    bakeOverlaysIntoPdf().then(function () {
      if (!state.pdfBytes) return;
      var blob = new Blob([state.pdfBytes], { type: 'application/pdf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'document.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    });
  }

  pdfDownloadBtn.addEventListener('click', downloadCurrentPdf);

  window.addEventListener('resize', function () {
    if (document.getElementById('panelSign').classList.contains('visible')) initSignPad();
  });

  loadPdfFromRoot();
})();
</script>
