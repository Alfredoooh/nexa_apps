<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Vídeo · BrowseIt</title>
<style>
:root{--bg:#fff;--surface:#f5f5f6;--panel:#ededee;--text:#202124;--muted:#62666c;--accent:#E8890C;--line:#e5e6e8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Roboto,"Google Sans",Arial,sans-serif}
body{display:flex;flex-direction:column}
header{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg)}
.icon-button{width:44px;height:44px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:var(--text);transition:background .16s,transform .16s}
.icon-button:active{background:var(--panel);transform:scale(.92)}
.icon-button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:500}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--surface)}
video{display:block;width:100%;height:100%;max-height:100%;background:#000;object-fit:contain;border-radius:16px;outline:none}
#error{display:none;position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<header>
  <button class="icon-button" id="back" type="button" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M20 12H4m0 0 7 7m-7-7 7-7"/></svg></button>
  <div id="title">Vídeo</div>
</header>
<main>
  <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  <div id="error">Não foi possível reproduzir este vídeo neste formato.</div>
</main>
<script>
(()=>{
 const q=new URLSearchParams(location.search),dark=q.get('theme')==='dark',pure=q.get('pure')==='1';
 const s=document.documentElement.style;
 s.setProperty('--bg',dark?(pure?'#000':'#191a1c'):'#fff');s.setProperty('--surface',dark?(pure?'#080808':'#202124'):'#f5f5f6');s.setProperty('--panel',dark?(pure?'#222':'#303236'):'#ededee');s.setProperty('--text',dark?'#f1f1f2':'#202124');s.setProperty('--muted',dark?'#b5b7bb':'#62666c');s.setProperty('--accent',dark?'#FF9F1C':'#E8890C');s.setProperty('--line',dark?(pure?'#292929':'#383a3e'):'#e5e6e8');
 const close=()=>{if(window.AndroidViewer&&typeof AndroidViewer.close==='function')AndroidViewer.close();else history.back();};
 document.getElementById('back').addEventListener('click',close);
 document.getElementById('title').textContent=q.get('name')||'Vídeo';
 const player=document.getElementById('player'),error=document.getElementById('error');
 player.src=q.get('src')||'';
 player.addEventListener('error',()=>{player.style.display='none';error.style.display='block';});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace')close();});
})();
</script>
</body>
</html>
