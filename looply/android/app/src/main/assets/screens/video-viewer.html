<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Vídeo · BrowseIt</title>
<style>
:root{--bg:#fff;--panel:#f0f1f3;--text:#202124;--muted:#5f6368;--accent:#1a73e8;--line:#e8eaed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Roboto,"Arial",sans-serif}
body{display:flex;flex-direction:column}
header{height:52px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:var(--bg)}
button{border:0;cursor:pointer}
#close{width:38px;height:38px;border-radius:50%;background:var(--panel);color:var(--text);font-size:24px;line-height:1}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
video{width:100%;max-height:calc(100% - 76px);background:#000;border-radius:14px;object-fit:contain}
.filename{max-width:100%;font-size:13px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
#error{display:none;color:var(--muted);font-size:14px;text-align:center;line-height:1.5;padding:20px}
</style>
</head>
<body>
<header><button id="close" aria-label="Fechar">×</button></header>
<main>
  <video id="player" controls playsinline preload="metadata"></video>
  <div class="filename" id="filename"></div>
  <div id="error">Não foi possível reproduzir este vídeo neste formato.</div>
</main>
<script>
(function(){
  const q=new URLSearchParams(location.search), dark=q.get('theme')==='dark', pure=q.get('pure')==='1';
  const css=document.documentElement.style;
  css.setProperty('--bg',dark?(pure?'#000':'#141517'):'#fff');
  css.setProperty('--panel',dark?(pure?'#191919':'#2b2d30'):'#f0f1f3');
  css.setProperty('--text',dark?'#e6e6e8':'#202124');
  css.setProperty('--muted',dark?'#b2b4b8':'#5f6368');
  css.setProperty('--accent',dark?'#8ab4f8':'#1a73e8');
  css.setProperty('--line',dark?(pure?'#292929':'#34363a'):'#e8eaed');
  const close=()=>{if(window.AndroidViewer)AndroidViewer.close();else window.close();};
  document.getElementById('close').addEventListener('click',close);
  document.getElementById('filename').textContent=q.get('name')||'';
  const player=document.getElementById('player');
  player.src=q.get('src')||'';
  player.addEventListener('error',()=>{document.getElementById('error').style.display='block';player.style.display='none';});
})();
</script>
</body>
</html>
