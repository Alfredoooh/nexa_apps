<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #FFFFFF;
    --panel2: #F0F1F3;
    --soft: #F8F9FA;
    --text: #202124;
    --muted: #5F6368;
    --line: #E8EAED;
    --outline: #E8EAED;
    --accent: #1A1A1A;
    --on-accent: #FFFFFF;
    color-scheme: light;
  }

  :root[data-app-theme="dark"] {
    --bg: #17181A;
    --panel: #212325;
    --panel2: #2B2D30;
    --soft: #1D1F21;
    --text: #E6E6E8;
    --muted: #B2B4B8;
    --line: #34363A;
    --outline: #34363A;
    --accent: #E6E6E8;
    --on-accent: #17181A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; height: 100%; overflow: hidden; }

  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }

  .app { position: relative; width: 100%; height: 100vh; height: 100dvh; }

  .canvas {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: 140px;
  }

  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    color: var(--muted);
  }

  .empty-state.visible { display: flex; }
  .empty-state .material-symbols-rounded { font-size: 32px; opacity: .5; }
  .empty-state p { margin: 0; font-size: 14px; }

  .inputbar-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
  }

  .inputbar-box {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 26px;
    border: 1.5px solid var(--outline);
    padding: 16px 16px 12px;
  }

  .input-field {
    width: 100%;
    min-height: 26px;
    max-height: 140px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.4;
    resize: none;
    overflow-y: auto;
  }

  .input-field::placeholder { color: var(--muted); }

  .inputbar-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .actions-left { display: flex; align-items: center; gap: 14px; }

  .tool-btn {
    width: 28px; height: 28px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: transform .3s cubic-bezier(.34, 1.5, .64, 1);
  }

  .tool-btn:active { transform: scale(.88); }
  .tool-btn svg { width: 20px; height: 20px; }

  .send-btn {
    width: 32px; height: 32px;
    border-radius: 999px;
    border: none;
    background: var(--panel2);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .3s cubic-bezier(.34, 1.5, .64, 1), background-color .2s ease, color .2s ease;
  }

  .send-btn:active { transform: scale(.88); }
  .send-btn.has-text { background: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<div class="app">
  <div class="canvas">
    <div class="empty-state" id="emptyState">
      <span class="material-symbols-rounded">search_off</span>
      <p>Sem resultados</p>
    </div>
  </div>
  <div class="inputbar-wrap">
    <div class="inputbar-box">
      <textarea class="input-field" id="messageInput" placeholder="Pergunte, busque ou crie qualquer coisa" rows="1"></textarea>
      <div class="inputbar-actions">
        <div class="actions-left">
          <button class="tool-btn" id="btnAdd" aria-label="Adicionar">
            <span class="material-symbols-rounded">add</span>
          </button>
          <button class="tool-btn" id="btnTune" aria-label="Ajustar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>
            </svg>
          </button>
        </div>
        <button class="send-btn" id="btnSend" aria-label="Enviar">
          <span class="material-symbols-rounded">arrow_upward</span>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
  const textarea = document.getElementById('messageInput');
  const sendBtn = document.getElementById('btnSend');
  const emptyState = document.getElementById('emptyState');

  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    sendBtn.classList.toggle('has-text', textarea.value.trim().length > 0);
  });

  function sendMessage() {
    const text = textarea.value.trim();
    if (!text) return;
    textarea.value = '';
    textarea.style.height = 'auto';
    sendBtn.classList.remove('has-text');
    emptyState.classList.add('visible');
  }

  sendBtn.addEventListener('click', sendMessage);
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
