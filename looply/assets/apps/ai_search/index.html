<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
<style>
  :root {
    /* Cores do looply_theme.dart — tema claro */
    --bg: #FFFFFF;              /* looplyBgLight */
    --panel: #FFFFFF;           /* looplyPanelLight */
    --panel2: #F0F1F3;          /* looplyPanel2Light */
    --soft: #F8F9FA;            /* looplySoftLight */
    --text: #202124;            /* looplyTextLight */
    --muted: #5F6368;           /* looplyMutedLight */
    --line: #E8EAED;            /* looplyLineLight */
    --outline: #E8EAED;
    --accent: #1A1A1A;          /* looplyPrimary */
    --on-accent: #FFFFFF;
    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181A;            /* looplyBgDark */
      --panel: #212325;         /* looplyPanelDark */
      --panel2: #2B2D30;        /* looplyPanel2Dark */
      --soft: #1D1F21;          /* looplySoftDark */
      --text: #E6E6E8;          /* looplyTextDark */
      --muted: #B2B4B8;         /* looplyMutedDark */
      --line: #34363A;          /* looplyLineDark */
      --outline: #34363A;
      --accent: #E6E6E8;        /* looplyBlueDark (ajustada p/ neutro) */
      --on-accent: #17181A;
    }
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .material-symbols-rounded {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    font-size: 22px;
    line-height: 1;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
  }

  /* ===== Canvas (resultados aparecem aqui) ===== */
  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-bottom: 140px;
  }

  .empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-align: center;
    color: var(--muted);
  }

  .empty-state.visible {
    display: flex;
  }

  .empty-state .material-symbols-rounded {
    font-size: 32px;
    opacity: 0.5;
  }

  .empty-state p {
    margin: 0;
    font-size: 14px;
  }

  /* ===== Bottom Input Bar (estilo AI chat) ===== */
  .inputbar-wrap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    z-index: 10;
  }

  .inputbar-box {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border-radius: 26px;
    border: 1.5px solid var(--outline);
    padding: 16px 16px 12px;
  }

  .input-field {
    width: 100%;
    min-height: 26px;
    max-height: 140px;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.4;
    resize: none;
    overflow-y: auto;
  }

  .input-field::placeholder {
    color: var(--muted);
  }

  .inputbar-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .actions-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .tool-btn {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1);
  }

  .tool-btn:active {
    transform: scale(0.88);
  }

  .tool-btn svg {
    width: 20px;
    height: 20px;
  }

  .send-btn {
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: none;
    background: var(--panel2);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.5, 0.64, 1), background-color 0.2s ease, color 0.2s ease;
  }

  .send-btn:active {
    transform: scale(0.88);
  }

  .send-btn.has-text {
    background: var(--accent);
    color: var(--on-accent);
  }
</style>
</head>
<body>

<div class="app">

  <!-- Canvas: mostra o estado vazio/resultados -->
  <div class="canvas">
    <div class="empty-state" id="emptyState">
      <span class="material-symbols-rounded">search_off</span>
      <p>Sem resultados</p>
    </div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="inputbar-wrap">
    <div class="inputbar-box">
      <textarea class="input-field" id="messageInput" placeholder="Pergunte, busque ou crie qualquer coisa" rows="1"></textarea>
      <div class="inputbar-actions">
        <div class="actions-left">
          <button class="tool-btn" id="btnAdd">
            <span class="material-symbols-rounded">add</span>
          </button>
          <button class="tool-btn" id="btnTune">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 17H5"/>
              <path d="M19 7h-9"/>
              <circle cx="17" cy="17" r="3"/>
              <circle cx="7" cy="7" r="3"/>
            </svg>
          </button>
        </div>
        <button class="send-btn" id="btnSend">
          <span class="material-symbols-rounded">arrow_upward</span>
        </button>
      </div>
    </div>
  </div>

</div>

<script>
  const textarea = document.getElementById('messageInput');
  const sendBtn = document.getElementById('btnSend');
  const emptyState = document.getElementById('emptyState');

  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    sendBtn.classList.toggle('has-text', textarea.value.trim().length > 0);
  });

  function sendMessage() {
    const text = textarea.value.trim();
    if (!text) return;

    // TODO: aqui entra a chamada à lógica de IA.
    // Por agora, só limpa o input e mostra "sem resultados".
    textarea.value = '';
    textarea.style.height = 'auto';
    sendBtn.classList.remove('has-text');
    emptyState.classList.add('visible');
  }

  sendBtn.addEventListener('click', sendMessage);

  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>

</body>
</html>
