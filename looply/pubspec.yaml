name: looply
description: BrowseIt — navegador rápido, seguro e personalizável.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2815.0
  cupertino_icons: ^1.0.8
  animations: any
  package_info_plus: ^10.2.2
  http: ^1.2.0
  cached_network_image: any
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.2.0
  image_picker: ^1.2.4
  material3_expressive_loading_indicator: ^0.1.2
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  flutter_svg: ^2.0.10+1
  flutter_staggered_grid_view: ^0.7.0
  material_ui: ^1.3.0
  m3e_segmented_list: ^0.0.3
  m3e_progress_indicator: ^0.0.2
  m3e_buttons: ^1.0.4
  m3e_menu: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/apps/ai_search/index.html
    - assets/images/logo.svg
    - assets/apps/ai_search/
    - assets/icons/svg/
    - assets/icons/svg/fill/
    - assets/icons/svg/regular/
    - assets/images/avatar.png
    - assets/images/looply_original_icon.png
    - assets/images/looply_icon.png
    - assets/images/looply_mark.png
    - assets/images/logo_text.svg
    - assets/images/share/whatsapp.png
    - assets/images/share/telegram.png