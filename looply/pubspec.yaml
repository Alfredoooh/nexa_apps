name: looply
description: BrowseIt — navegador rápido, seguro e personalizável.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2815.0
  cupertino_icons: ^1.0.8
  animations: any
  package_info_plus: ^10.2.2
  http: ^1.2.0
  cached_network_image: any
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  material3_expressive_loading_indicator: ^0.1.2
  path_provider: ^2.1.5
  file_picker: ^13.3.3
  flutter_svg: ^2.0.10+1
  flutter_staggered_grid_view: ^0.7.0
  material_ui: ^1.11.0
  material_3_expressive: ^1.2.1
  m3e_segmented_list: ^0.0.3
  m3e_buttons: ^1.0.4
  m3e_menu: ^0.0.1
  lottie: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/browseit_logo.json
    - assets/animations/browseit_ai_idle.json
    - assets/animations/cobalt_sprite_ai.json
    - assets/animations/activity_chart_empty.json
    - assets/animations/game-illustration-dark-lottie.json
    - assets/animations/game-illustration-light-lottie.json
    - assets/animations/analytics-illustration-dark-lottie.json
    - assets/animations/analytics-illustration-light-lottie.json
    - assets/ai_search/ai_mark.png
    - assets/ai_search/ai.png
    - assets/search_engines/
    - assets/games/
    - assets/games/covers/
    - assets/icons/svg/regular/menu-options.svg
    - assets/icons/svg/regular/tabs-counter.svg
    - assets/images/looply_icon.png
    - images/avatar.png
    - assets/icons/svg/regular/new-message.svg
    - assets/icons/svg/regular/settings.svg