name: looply
description: Looply — uma comunidade para descobrir, jogar e criar experiências.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2815.0
  flutter_inappwebview: any
  cupertino_icons: ^1.0.8
  animations: any
  http: ^1.2.0
  cached_network_image: any
  shared_preferences: ^2.3.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
