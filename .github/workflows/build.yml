name: Nexa Apps Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

# Apenas uma compilação de cada vez em todo o workflow.
concurrency:
  group: nexa-apps-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Nexa Apps APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # --------------------------------------------------
      # JAVA 17
      # --------------------------------------------------

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # FLUTTER
      # --------------------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: false

      # --------------------------------------------------
      # CONFIGURAR JAVA NO FLUTTER
      # --------------------------------------------------

      - name: Configure Flutter JDK
        shell: bash
        run: |
          set -euo pipefail

          flutter config --jdk-dir="$JAVA_HOME"

          echo "=== JAVA ==="
          java -version

          echo "=== FLUTTER ==="
          flutter --version

          echo "=== FLUTTER DOCTOR ==="
          flutter doctor -v

      # --------------------------------------------------
      # DETECTAR PROJETO
      # --------------------------------------------------

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            PROJECT_DIR="."

          elif [[ -f "nexa_apps/pubspec.yaml" ]]; then
            PROJECT_DIR="nexa_apps"

          else
            echo "ERROR: Flutter pubspec.yaml not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Flutter project: $PROJECT_DIR"

      # --------------------------------------------------
      # VERIFICAR CONFIGURAÇÃO ANDROID
      # Não executar gradlew nesta etapa.
      # O Flutter pode injetar os ficheiros ausentes.
      # --------------------------------------------------

      - name: Inspect Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          if [[ ! -d "$ANDROID_DIR" ]]; then
            echo "ERROR: Android directory not found."
            exit 1
          fi

          echo "=== ANDROID DIRECTORY ==="
          ls -la "$ANDROID_DIR"

          echo "=== GRADLE WRAPPER PROPERTIES ==="

          if [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]]; then
            cat "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          else
            echo "Gradle wrapper properties missing."
            echo "Flutter will generate the necessary wrapper configuration."
          fi

          echo "=== WRAPPER SCRIPT ==="

          if [[ -f "$ANDROID_DIR/gradlew" ]]; then
            echo "Existing gradlew detected."
            chmod +x "$ANDROID_DIR/gradlew"
          else
            echo "gradlew is missing."
            echo "Flutter will inject the missing Gradle Wrapper files during compilation."
          fi

          echo "=== JAVA ENVIRONMENT ==="
          echo "JAVA_HOME=$JAVA_HOME"

          java -version

      # --------------------------------------------------
      # DEPENDÊNCIAS
      # --------------------------------------------------

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter pub get

      # --------------------------------------------------
      # LIMPAR APENAS CONFIGURAÇÕES TEMPORÁRIAS
      # Não executa flutter clean.
      # --------------------------------------------------

      - name: Prepare Android build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          mkdir -p build

          echo "Android build environment prepared."

      # --------------------------------------------------
      # COMPILAR APK
      # Uma única execução.
      # Sem matrix e sem jobs paralelos.
      # --------------------------------------------------

      - name: Build Nexa Apps APK
        id: build
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=================================="
          echo "      NEXA APPS ANDROID BUILD"
          echo "=================================="

          flutter build apk --release --split-per-abi

          APK_DIR="build/app/outputs/flutter-apk"

          shopt -s nullglob

          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          echo "=================================="
          echo "       GENERATED APK FILES"
          echo "=================================="

          for apk in "${APKS[@]}"; do
            ls -lh "$apk"
          done

          echo "APK_COUNT=${#APKS[@]}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # VERIFICAR GRADLE WRAPPER APÓS A COMPILAÇÃO
      # --------------------------------------------------

      - name: Verify generated Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$PROJECT_DIR/android"

          echo "=== GENERATED WRAPPER FILES ==="

          for file in \
            "$ANDROID_DIR/gradlew" \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          do
            if [[ -f "$file" ]]; then
              echo "OK: $file"
            else
              echo "ERROR: Missing $file"
              exit 1
            fi
          done

          chmod +x "$ANDROID_DIR/gradlew"

          echo "Gradle Wrapper verified."

      # --------------------------------------------------
      # PREPARAR RELEASE ASSETS
      # --------------------------------------------------

      - name: Rename APKs for release
        id: rename
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"

          OUT_DIR="$APK_DIR/release-assets"

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

          shopt -s nullglob

          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No APKs available."
            exit 1
          fi

          for apk in "${APKS[@]}"; do

            name="$(basename "$apk")"

            arch="${name#app-}"
            arch="${arch%-release.apk}"

            new_name="nexa-app-${arch}.apk"

            cp "$apk" "$OUT_DIR/$new_name"

            echo "Prepared: $new_name"

          done

          echo "asset_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

          echo "=== RELEASE ASSETS ==="

          ls -lh "$OUT_DIR"

      # --------------------------------------------------
      # PUBLICAR GITHUB RELEASE
      # --------------------------------------------------

      - name: Publish Nexa Apps Release
        id: release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build

          name: "Nexa Apps Build #${{ github.run_number }}"

          body: |
            # Nexa Apps - Android

            Nova compilação automática do Nexa Apps.

            **Build:** #${{ github.run_number }}

            **Commit:** `${{ github.sha }}`

            **Branch:** `${{ github.ref_name }}`

            ## Downloads

            Escolhe o APK conforme a arquitetura do teu dispositivo:

            - `arm64-v8a` — maioria dos Android modernos.
            - `armeabi-v7a` — Android de 32 bits.
            - `x86_64` — emuladores e dispositivos compatíveis.

            ## Download direto

            [Baixar ARM64](https://github.com/${{ github.repository }}/releases/download/latest-build/nexa-app-arm64-v8a.apk)

            [Baixar ARM32](https://github.com/${{ github.repository }}/releases/download/latest-build/nexa-app-armeabi-v7a.apk)

            [Baixar x86_64](https://github.com/${{ github.repository }}/releases/download/latest-build/nexa-app-x86_64.apk)

          files: ${{ steps.rename.outputs.asset_dir }}/*.apk

          fail_on_unmatched_files: true

          make_latest: true

      # --------------------------------------------------
      # LINKS DE DOWNLOAD NO ACTIONS SUMMARY
      # --------------------------------------------------

      - name: Write APK download links
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk/release-assets"

          echo "# Nexa Apps - APK Downloads" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "**Build:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Arquitetura | Ficheiro | Download |" >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob

          APKS=("$APK_DIR"/*.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: Release APKs not found."
            exit 1
          fi

          for apk in "${APKS[@]}"; do

            name="$(basename "$apk")"

            arch="${name#nexa-app-}"
            arch="${arch%.apk}"

            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build/${name}"

            echo "| $arch | $name | [Baixar APK]($url) |" >> "$GITHUB_STEP_SUMMARY"

            echo "$name -> $url"

          done

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## GitHub Releases" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Abrir página de downloads](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-build)" >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------
      # RESUMO DE PULL REQUEST
      # --------------------------------------------------

      - name: Write Pull Request Summary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          echo "# Nexa Apps - Build concluído" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "A compilação Android foi executada com sucesso." >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Nenhum Release foi publicado porque esta execução pertence a um Pull Request." >> "$GITHUB_STEP_SUMMARY"