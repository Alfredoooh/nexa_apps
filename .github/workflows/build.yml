name: BrowseIt Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browseit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BrowseIt APK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect Android project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [[ -f "browseit/settings.gradle" || -f "browseit/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=browseit" >> "$GITHUB_ENV"
          elif [[ -f "android/settings.gradle" || -f "android/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle(.kts) not found."
            exit 1
          fi

      - name: Grant execute permission to gradlew
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$PROJECT_DIR/gradlew"

          if [[ ! -f "$GRADLEW" ]]; then
            echo "ERROR: gradlew script not found at $GRADLEW."
            exit 1
          fi

          chmod +x "$GRADLEW"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Display build environment
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version
          java -version

      - name: Configure BrowseIt release keystore
        shell: bash
        env:
          BROWSEIT_KEYSTORE_BASE64: ${{ secrets.BROWSEIT_KEYSTORE_BASE64 }}
          BROWSEIT_STORE_PASSWORD: ${{ secrets.BROWSEIT_STORE_PASSWORD }}
          BROWSEIT_KEY_PASSWORD: ${{ secrets.BROWSEIT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${BROWSEIT_KEYSTORE_BASE64:?Missing GitHub Actions secret BROWSEIT_KEYSTORE_BASE64}"
          : "${BROWSEIT_STORE_PASSWORD:?Missing GitHub Actions secret BROWSEIT_STORE_PASSWORD}"
          : "${BROWSEIT_KEY_PASSWORD:?Missing GitHub Actions secret BROWSEIT_KEY_PASSWORD}"

          KEYSTORE_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR/app/browseit-release.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$BROWSEIT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          KEY_INFO="$(keytool -list -v \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env BROWSEIT_STORE_PASSWORD \
            -alias browseit)"

          ACTUAL_SHA1="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA1:/{gsub(/[[:space:]]/, "", $2); print toupper($2); exit}')"
          EXPECTED_SHA1="D8:D2:AF:AC:01:42:68:F8:7C:42:C5:68:F6:59:DB:83:40:C9:68:6D"

          if [[ -z "$ACTUAL_SHA1" ]]; then
            echo "ERROR: Could not read SHA-1 fingerprint from BrowseIt keystore."
            exit 1
          fi

          if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "ERROR: Wrong BrowseIt keystore certificate."
            echo "Expected SHA-1: $EXPECTED_SHA1"
            echo "Found SHA-1:    $ACTUAL_SHA1"
            exit 1
          fi

          echo "BrowseIt release certificate SHA-1 verified."

          {
            echo "BROWSEIT_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "BROWSEIT_STORE_PASSWORD=$BROWSEIT_STORE_PASSWORD"
            echo "BROWSEIT_KEY_PASSWORD=$BROWSEIT_KEY_PASSWORD"
            echo "BROWSEIT_KEY_ALIAS=browseit"
          } >> "$GITHUB_ENV"

          echo "BrowseIt keystore loaded and alias verified."

      - name: Build BrowseIt APK
        shell: bash
        env:
          BROWSEIT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BROWSEIT_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail

          : "${BROWSEIT_GOOGLE_WEB_CLIENT_ID:?Missing GitHub Actions secret BROWSEIT_GOOGLE_WEB_CLIENT_ID}"

          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            -PBROWSEIT_GOOGLE_WEB_CLIENT_ID="$BROWSEIT_GOOGLE_WEB_CLIENT_ID" \
            -PBROWSEIT_STORE_FILE="$BROWSEIT_KEYSTORE_PATH" \
            -PBROWSEIT_STORE_PASSWORD="$BROWSEIT_STORE_PASSWORD" \
            -PBROWSEIT_KEY_ALIAS="$BROWSEIT_KEY_ALIAS" \
            -PBROWSEIT_KEY_PASSWORD="$BROWSEIT_KEY_PASSWORD"

          APK_DIR="app/build/outputs/apk/release"
          shopt -s nullglob
          APKS=("$APK_DIR"/*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No BrowseIt APKs were generated."
            exit 1
          fi

          echo "BrowseIt APKs successfully generated:"
          ls -lh "${APKS[@]}"

      - name: Remove temporary keystore from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$GITHUB_WORKSPACE/$PROJECT_DIR/app/browseit-release.keystore"

      - name: Rename APKs with run number
        id: rename
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"
          OUT_DIR="$PROJECT_DIR/app/build/outputs/apk/release-assets"
          mkdir -p "$OUT_DIR"

          for apk in "$APK_DIR"/*-release.apk; do
            name="$(basename "$apk")"
            new_name="browseit-${name%-release.apk}-build${{ github.run_number }}.apk"
            cp "$apk" "$OUT_DIR/$new_name"
          done

          echo "asset_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Assets prontos para release:"
          ls -lh "$OUT_DIR"

      - name: Publish release with APK assets
        id: release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "BrowseIt build #${{ github.run_number }}"
          body: |
            Build automático do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).
          files: ${{ steps.rename.outputs.asset_dir }}/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Write download links to summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          echo "## BrowseIt APKs disponíveis para download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arquivo | Link direto |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for apk in "$PROJECT_DIR"/app/build/outputs/apk/release-assets/*.apk; do
            name="$(basename "$apk")"
            url="https://github.com/${{ github.repository }}/releases/download/latest-build/${name}"
            echo "| $name | [Baixar]($url) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name -> $url"
          done