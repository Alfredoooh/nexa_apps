name: Looply Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: looply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Looply APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [[ -f "looply/pubspec.yaml" ]]; then
            echo "PROJECT_DIR=looply" >> "$GITHUB_ENV"

          else
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

      - name: Update Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLEW="$PROJECT_DIR/android/gradlew"
          TARGET_VERSION="8.14.6"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi

          if [[ ! -f "$GRADLEW" ]]; then
            echo "ERROR: gradlew script not found."
            exit 1
          fi

          sed -i \
            "s#^distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-${TARGET_VERSION}-bin.zip#" \
            "$WRAPPER"
          sed -i '/^distributionSha256Sum=/d' "$WRAPPER"

          # Este projeto usa um gradlew bootstrapper customizado com a versao
          # hardcoded em VERSION="..." (nao le o gradle-wrapper.properties).
          sed -i "s#^VERSION=\"8.13\"#VERSION=\"${TARGET_VERSION}\"#" "$GRADLEW"

          echo "=== gradle-wrapper.properties ==="
          cat "$WRAPPER"
          echo "=== gradlew VERSION ==="
          grep '^VERSION=' "$GRADLEW"

          if ! grep -q "gradle-${TARGET_VERSION}-bin.zip" "$WRAPPER"; then
            echo "ERROR: distributionUrl not updated."
            exit 1
          fi

          if ! grep -q "VERSION=\"${TARGET_VERSION}\"" "$GRADLEW"; then
            echo "ERROR: gradlew VERSION not updated."
            exit 1
          fi

      - name: Display build environment
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Looply APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info

          APK_DIR="build/app/outputs/flutter-apk"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No Looply APKs were generated."
            exit 1
          fi

          echo "APKs successfully generated:"
          ls -lh "${APKS[@]}"

      - name: Rename APKs with run number
        id: rename
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"
          OUT_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk/release-assets"
          mkdir -p "$OUT_DIR"

          for apk in "$APK_DIR"/app-*-release.apk; do
            name="$(basename "$apk")"
            arch="$(echo "$name" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            new_name="looply-${arch}-build${{ github.run_number }}.apk"
            cp "$apk" "$OUT_DIR/$new_name"
          done

          echo "asset_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Assets prontos para release:"
          ls -lh "$OUT_DIR"

      - name: Publish release with APK assets
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Looply build #${{ github.run_number }}"
          body: |
            Build automático do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Escolhe o APK pela arquitetura do teu telemóvel:
            - `arm64-v8a` — cobre praticamente todos os Android modernos (recomendado).
            - `armeabi-v7a` — para aparelhos antigos de 32-bit.
            - `x86_64` — só para emuladores/Chromebooks Intel, não instala em celular normal.
          files: ${{ steps.rename.outputs.asset_dir }}/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Write download links to summary
        shell: bash
        run: |
          set -euo pipefail

          echo "## APKs disponíveis para download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arquitetura | Link direto |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for apk in "${{ steps.rename.outputs.asset_dir }}"/*.apk; do
            name="$(basename "$apk")"
            url="https://github.com/${{ github.repository }}/releases/download/latest-build/${name}"
            echo "| $name | [Baixar]($url) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name -> $url"
          done