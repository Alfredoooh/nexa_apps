name: Looply Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Looply APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            echo "Flutter project found at repository root."

          elif [[ -f "looply/pubspec.yaml" ]]; then
            echo "PROJECT_DIR=looply" >> "$GITHUB_ENV"
            echo "Flutter project found in looply/."

          else
            echo "ERROR: pubspec.yaml not found."
            echo "Expected pubspec.yaml at the root or inside looply/."
            exit 1
          fi

      - name: Display Flutter version
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Android APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Looply APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload Looply APK
        uses: actions/upload-artifact@v7
        with:
          name: looply-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14