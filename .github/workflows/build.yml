name: Nexa Apps Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

# Serializa todas as execuções deste workflow: nunca executa duas builds
# do Nexa Apps ao mesmo tempo. Uma execução em curso não é cancelada.
concurrency:
  group: nexa-apps-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Nexa Apps APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Gradle 9.3.1 requer Java 17 ou superior. Fixamos Java 17 para
      # impedir que o runner selecione Java 25 automaticamente.
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: false

      - name: Configure Flutter to use Java 17
        shell: bash
        run: |
          set -euo pipefail

          flutter config --jdk-dir="$JAVA_HOME"

          echo "=== JAVA ==="
          java -version

          echo "=== FLUTTER ==="
          flutter --version

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            PROJECT_DIR="."
          elif [[ -f "nexa_apps/pubspec.yaml" ]]; then
            PROJECT_DIR="nexa_apps"
          else
            echo "ERROR: pubspec.yaml not found in repository root or nexa_apps/."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project directory: $PROJECT_DIR"

      # O projeto carregado usa Gradle 8.14, mas o Flutter 3.50.0 deste
      # workflow exige no mínimo Gradle 9.3.1. Atualizamos o wrapper antes
      # de iniciar a compilação. Não é necessário executar ./gradlew aqui.
      - name: Set Gradle Wrapper to 9.3.1
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLE_VERSION="9.3.1"

          if [[ ! -d "$PROJECT_DIR/android" ]]; then
            echo "ERROR: Android project directory not found."
            exit 1
          fi

          mkdir -p "$(dirname "$WRAPPER")"

          if [[ ! -f "$WRAPPER" ]]; then
            cat > "$WRAPPER" <<'PROPERTIES'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPERTIES
          fi

          python3 - "$WRAPPER" "$GRADLE_VERSION" <<'PY'
          import pathlib
          import sys

          wrapper = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          lines = wrapper.read_text(encoding="utf-8").splitlines()
          url = (
              "distributionUrl=https\\://services.gradle.org/distributions/"
              f"gradle-{version}-bin.zip"
          )
          output = []
          replaced = False

          for line in lines:
              if line.startswith("distributionUrl="):
                  if not replaced:
                      output.append(url)
                      replaced = True
              elif not line.startswith("distributionSha256Sum="):
                  output.append(line)

          if not replaced:
              output.append(url)

          wrapper.write_text("\n".join(output).rstrip() + "\n", encoding="utf-8")
          PY

          echo "=== EFFECTIVE GRADLE WRAPPER CONFIGURATION ==="
          cat "$WRAPPER"

          grep -Fq "gradle-${GRADLE_VERSION}-bin.zip" "$WRAPPER"

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Verify build toolchain configuration
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE DISTRIBUTION ==="
          grep '^distributionUrl=' "$WRAPPER"

          grep -Fq 'gradle-9.3.1-bin.zip' "$WRAPPER" || {
            echo "ERROR: Gradle wrapper is not configured for 9.3.1."
            exit 1
          }

      # Uma única chamada Flutter. --split-per-abi gera os APKs por
      # arquitetura no mesmo build, sem matrix nem jobs concorrentes.
      - name: Build Nexa Apps APK
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "=================================="
          echo "       NEXA APPS ANDROID BUILD"
          echo "=================================="

          flutter build apk --release --split-per-abi

          APK_DIR="build/app/outputs/flutter-apk"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: Flutter did not generate any split APKs."
            exit 1
          fi

          echo "=== GENERATED APK FILES ==="
          for apk in "${APKS[@]}"; do
            ls -lh "$apk"
          done

          echo "APK_COUNT=${#APKS[@]}" >> "$GITHUB_OUTPUT"

      - name: Prepare APK release assets
        id: rename
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"
          OUT_DIR="$APK_DIR/release-assets"

          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"

          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No APKs available for publication."
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            name="$(basename "$apk")"
            arch="${name#app-}"
            arch="${arch%-release.apk}"
            new_name="nexa-app-${arch}.apk"

            cp "$apk" "$OUT_DIR/$new_name"
            echo "Prepared: $new_name"
          done

          echo "asset_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "=== RELEASE ASSETS ==="
          ls -lh "$OUT_DIR"

      - name: Publish Nexa Apps GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Nexa Apps Build #${{ github.run_number }}"
          body: |
            # Nexa Apps — Android

            Automatic release build.

            **Build:** #${{ github.run_number }}
            **Commit:** `${{ github.sha }}`
            **Branch:** `${{ github.ref_name }}`

            ## Downloads

            - `arm64-v8a` — most modern Android phones.
            - `armeabi-v7a` — 32-bit Android devices.
            - `x86_64` — compatible emulators and Intel devices.
          files: ${{ steps.rename.outputs.asset_dir }}/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Write APK download links to workflow summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk/release-assets"
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No published APK assets found."
            exit 1
          fi

          {
            echo "# Nexa Apps — APK downloads"
            echo
            echo "Build: #${{ github.run_number }}"
            echo
            echo "| Architecture | APK | Download |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in "${APKS[@]}"; do
            name="$(basename "$apk")"
            arch="${name#nexa-app-}"
            arch="${arch%.apk}"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-build/${name}"
            echo "| $arch | $name | [Download APK]($url) |" >> "$GITHUB_STEP_SUMMARY"
          done

          {
            echo
            echo "[Open all Nexa Apps releases](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest-build)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write pull request build summary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Nexa Apps — build validation"
            echo
            echo "The Android split-APK build completed. No GitHub Release was published for this pull request."
          } >> "$GITHUB_STEP_SUMMARY"
