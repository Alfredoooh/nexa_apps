name: Looply Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looply-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Looply APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          # Cache removido temporariamente: um Gradle 8.13 cacheado de uma run
          # anterior pode estar sendo restaurado por cima do wrapper editado.
          # cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [[ -f "looply/pubspec.yaml" ]]; then
            echo "PROJECT_DIR=looply" >> "$GITHUB_ENV"

          else
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

      - name: Update Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          if [[ ! -f "$WRAPPER" ]]; then
            echo "ERROR: Gradle wrapper properties not found."
            exit 1
          fi

          sed -i \
            's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.6-bin.zip#' \
            "$WRAPPER"

          sed -i '/^distributionSha256Sum=/d' "$WRAPPER"

          echo "Gradle Wrapper configuration:"
          cat "$WRAPPER"

          if ! grep -q 'gradle-8.14.6-bin.zip' "$WRAPPER"; then
            echo "ERROR: Gradle wrapper update failed - distributionUrl not updated."
            exit 1
          fi

      - name: Debug Gradle Wrapper resolution
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Conteudo do wrapper no momento da build ==="
          cat "$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"

          echo "=== Gradle que o wrapper realmente resolve ==="
          cd "$PROJECT_DIR/android"
          chmod +x ./gradlew
          ./gradlew --version

          echo "=== Caches de Gradle existentes no runner ==="
          find "$HOME/.gradle/wrapper/dists" -maxdepth 1 -type d 2>/dev/null || echo "Nenhum cache de wrapper encontrado."

      - name: Display build environment
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Looply APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          flutter build apk --release

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "ERROR: Looply APK was not generated."
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      - name: Upload Looply APK
        uses: actions/upload-artifact@v7
        with:
          name: looply-android-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14