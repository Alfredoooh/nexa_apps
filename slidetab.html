<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Handheld Console — Write-on Animation</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background: #fff;
    display: grid;
    place-items: center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .stage {
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
    display: grid;
    place-items: center;
    background: #fff;
    position: relative;
  }
  svg {
    width: 94%;
    height: 96%;
    overflow: visible;
    display: block;
    filter: drop-shadow(0 15px 12px rgba(0,0,0,.10));
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .draw {
    stroke: #090a0c;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    fill-opacity: 0;
  }
  .thin { stroke-width: 4.5; }
  .fine { stroke-width: 3.4; }
  .no-fill { fill: none !important; }
  .detail-line { fill: none !important; }
  .display-message { opacity: 0; }
  .display-message .icon-ring { fill: none; stroke: #252a30; stroke-width: 7; }
  .display-message .bang { fill: #252a30; font-size: 65px; font-weight: 800; text-anchor: middle; }
  .display-message .message { fill: #303840; font-size: 34px; font-weight: 700; letter-spacing: .5px; text-anchor: middle; }
  .screen-glint { opacity: .58; }
  .shine {
    opacity: 0;
    pointer-events: none;
  }
  .console-float {
    transform-box: fill-box;
    transform-origin: center;
    animation: float 5.2s ease-in-out infinite;
  }
  .stage.ready .display-message { animation: screenIn .75s cubic-bezier(.2,.8,.2,1) forwards; }
  .stage.ready .screen-glint { animation: glint 4.8s ease-in-out 1.2s infinite; }
  .stage.ready .shine { animation: shineIn 1.2s ease-out .4s forwards; }
  .stage.ready .console-float { animation: float 5.2s ease-in-out infinite; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-7px) rotate(-.45deg); }
  }
  @keyframes screenIn {
    0% { opacity: 0; transform: translateY(8px) scale(.92); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes glint {
    0%,68%,100% { opacity: .38; }
    82% { opacity: .78; }
  }
  @keyframes shineIn { to { opacity: .36; } }
  @media (max-width: 520px) {
    svg { width: 99%; height: 96%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
<svg id="console" viewBox="0 0 900 1000" role="img" aria-label="A turquoise handheld game console with an exclamation mark and the message Try it later on its screen">
  <defs>
    <linearGradient id="bodyBlue" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#18b5d0"/>
      <stop offset=".55" stop-color="#13a9c5"/>
      <stop offset="1" stop-color="#0796b5"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343438"/>
      <stop offset="1" stop-color="#202024"/>
    </linearGradient>
    <linearGradient id="screenGlass" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#dce5d0"/>
      <stop offset=".5" stop-color="#cbd6bf"/>
      <stop offset="1" stop-color="#b9c9b3"/>
    </linearGradient>
    <linearGradient id="buttonYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd15b"/><stop offset="1" stop-color="#e9a923"/>
    </linearGradient>
    <linearGradient id="buttonGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10a46c"/><stop offset="1" stop-color="#087948"/>
    </linearGradient>
    <linearGradient id="buttonRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f04b52"/><stop offset="1" stop-color="#c92e3c"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="278" y="166" width="344" height="264" rx="30"/>
    </clipPath>
  </defs>

  <g transform="rotate(22 450 500)">
  <g class="console-float">
    <!-- Shoulder tabs -->
    <path class="draw" data-fill="1" fill="#29292d" d="M330 78 Q337 59 357 61 L431 67 Q449 69 454 85 L462 111 L321 105 Z"/>
    <path class="draw" data-fill="1" fill="#29292d" d="M596 100 Q604 82 623 86 L682 105 Q700 111 703 129 L705 151 L586 125 Z"/>

    <!-- Main turquoise casing -->
    <path class="draw" data-fill="1" fill="url(#bodyBlue)" stroke-width="13"
      d="M310 65 Q245 66 226 132 L119 757 Q104 822 155 857 L600 938 Q668 950 691 885 L793 264 Q806 198 746 168 L367 76 Q337 68 310 65 Z"/>
    <!-- Inner raised rim -->
    <path class="draw thin" data-fill="1" fill="none" stroke="#007d9b"
      d="M316 91 Q265 90 250 147 L145 757 Q132 808 175 835 L594 913 Q648 922 670 867 L770 267 Q780 218 731 192 L368 102 Q339 94 316 91 Z"/>
    <!-- Long painted highlights on the casing -->
    <path class="draw thin detail-line" stroke="#74d9e8" d="M278 116 Q250 131 240 186 L151 727 Q143 771 170 791"/>
    <path class="draw fine detail-line" stroke="#72d9e7" d="M368 92 L723 181 Q768 195 774 233"/>
    <path class="draw fine detail-line" stroke="#045f78" d="M159 832 Q183 867 235 879 L594 945"/>

    <!-- Screen surround -->
    <path class="draw" data-fill="1" fill="url(#bezel)" stroke-width="12"
      d="M319 139 Q292 132 281 160 L229 431 Q220 469 253 484 L604 589 Q645 601 661 563 L720 294 Q729 257 696 243 Z"/>
    <path class="draw thin" data-fill="1" fill="#151518" stroke="#090a0b"
      d="M337 166 Q314 158 305 184 L264 414 Q257 440 282 452 L591 548 Q619 557 630 530 L682 296 Q690 271 665 260 Z"/>

    <!-- Screen glass -->
    <rect class="draw" data-fill="1" x="286" y="181" width="338" height="254" rx="29" fill="url(#screenGlass)" stroke-width="8"/>
    <g clip-path="url(#screenClip)">
      <path class="draw screen-glint" data-fill=".56" fill="#ffffff" stroke="none"
        d="M266 363 L623 207 L646 250 L289 411 Z"/>
      <path class="draw thin detail-line" stroke="#eef4e9" opacity=".75" d="M293 199 Q306 185 328 192 L597 279"/>
      <path class="draw fine detail-line" stroke="#aebda8" opacity=".7" d="M288 407 L607 277"/>
    </g>

    <!-- Warning icon and message on the display -->
    <g class="display-message">
      <circle class="icon-ring" cx="455" cy="265" r="38"/>
      <text class="bang" x="455" y="288">!</text>
      <text class="message" x="455" y="365">Try it later</text>
    </g>

    <!-- D-pad: dark cross with inset and centre -->
    <path class="draw" data-fill="1" fill="#242428" stroke-width="9"
      d="M307 568 L359 579 L372 524 Q375 511 390 516 L427 527 Q440 531 435 545 L422 594 L471 609 Q485 614 479 628 L467 663 Q462 678 448 673 L399 658 L386 708 Q382 722 367 718 L331 709 Q316 705 321 689 L334 640 L285 625 Q270 621 276 606 L288 579 Q293 565 307 568 Z"/>
    <path class="draw thin detail-line" stroke="#56565b" d="M301 584 L348 597 L362 541 L411 553 L397 608 L454 625 L440 660 L384 642 L370 697 L335 687 L349 630 L294 613 Z"/>
    <circle class="draw thin" data-fill="1" cx="377" cy="620" r="17" fill="#1b1b1f"/>

    <!-- Select / start pill buttons -->
    <path class="draw" data-fill="1" fill="#252529" stroke-width="8" d="M328 764 Q321 748 338 741 L389 723 Q410 716 417 733 Q424 751 405 758 L354 777 Q336 783 328 764 Z"/>
    <path class="draw thin detail-line" stroke="#66666b" d="M344 755 L395 737"/>
    <path class="draw" data-fill="1" fill="#252529" stroke-width="8" d="M431 794 Q424 778 441 771 L491 753 Q512 746 519 764 Q526 782 507 789 L456 807 Q439 813 431 794 Z"/>
    <path class="draw thin detail-line" stroke="#66666b" d="M448 785 L498 767"/>

    <!-- Four action buttons -->
    <circle class="draw" data-fill="1" cx="558" cy="670" r="37" fill="url(#buttonYellow)" stroke-width="9"/>
    <ellipse class="draw fine detail-line" cx="548" cy="658" rx="18" ry="7" stroke="#ffe28a" transform="rotate(-18 548 658)"/>
    <circle class="draw" data-fill="1" cx="642" cy="695" r="37" fill="url(#buttonYellow)" stroke-width="9"/>
    <ellipse class="draw fine detail-line" cx="632" cy="683" rx="18" ry="7" stroke="#ffe28a" transform="rotate(-18 632 683)"/>
    <circle class="draw" data-fill="1" cx="558" cy="766" r="37" fill="url(#buttonGreen)" stroke-width="9"/>
    <ellipse class="draw fine detail-line" cx="547" cy="754" rx="17" ry="7" stroke="#69d4a4" transform="rotate(-18 547 754)"/>
    <circle class="draw" data-fill="1" cx="642" cy="791" r="37" fill="url(#buttonRed)" stroke-width="9"/>
    <ellipse class="draw fine detail-line" cx="631" cy="779" rx="17" ry="7" stroke="#ff9292" transform="rotate(-18 631 779)"/>

    <!-- Speaker grille -->
    <g id="speaker" fill="#101216" stroke="#090a0b" stroke-width="2">
      <circle class="draw" data-fill="1" cx="514" cy="865" r="4.2"/>
      <circle class="draw" data-fill="1" cx="535" cy="870" r="4.2"/>
      <circle class="draw" data-fill="1" cx="556" cy="875" r="4.2"/>
      <circle class="draw" data-fill="1" cx="577" cy="880" r="4.2"/>
      <circle class="draw" data-fill="1" cx="598" cy="885" r="4.2"/>
      <circle class="draw" data-fill="1" cx="619" cy="890" r="4.2"/>
      <circle class="draw" data-fill="1" cx="640" cy="895" r="4.2"/>
      <circle class="draw" data-fill="1" cx="505" cy="883" r="4.2"/>
      <circle class="draw" data-fill="1" cx="526" cy="888" r="4.2"/>
      <circle class="draw" data-fill="1" cx="547" cy="893" r="4.2"/>
      <circle class="draw" data-fill="1" cx="568" cy="898" r="4.2"/>
      <circle class="draw" data-fill="1" cx="589" cy="903" r="4.2"/>
      <circle class="draw" data-fill="1" cx="610" cy="908" r="4.2"/>
      <circle class="draw" data-fill="1" cx="631" cy="913" r="4.2"/>
      <circle class="draw" data-fill="1" cx="496" cy="901" r="4.2"/>
      <circle class="draw" data-fill="1" cx="517" cy="906" r="4.2"/>
      <circle class="draw" data-fill="1" cx="538" cy="911" r="4.2"/>
      <circle class="draw" data-fill="1" cx="559" cy="916" r="4.2"/>
      <circle class="draw" data-fill="1" cx="580" cy="921" r="4.2"/>
      <circle class="draw" data-fill="1" cx="601" cy="926" r="4.2"/>
      <circle class="draw" data-fill="1" cx="622" cy="931" r="4.2"/>
    </g>

    <!-- Final edge shine -->
    <path class="shine detail-line" d="M277 123 Q245 148 231 218 L137 757 Q127 805 166 837" fill="none" stroke="#d8f8ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
</div>
<script>
(() => {
  const stage = document.getElementById('stage');
  const svg = document.getElementById('console');
  const paths = [...svg.querySelectorAll('.draw')];
  let timers = [];
  let animationToken = 0;

  function play() {
    animationToken++;
    const token = animationToken;
    timers.forEach(clearTimeout);
    timers = [];
    stage.classList.remove('ready');

    // Reset every line so the illustration is genuinely traced, not simply faded in.
    paths.forEach(el => {
      el.style.animation = 'none';
      el.style.transition = 'none';
      const length = Math.max(1, el.getTotalLength());
      el.style.strokeDasharray = length;
      el.style.strokeDashoffset = length;
      el.style.fillOpacity = '0';
      el.style.opacity = '1';
    });

    // Draw in reading order. Longer contours receive proportionally more time.
    let cursor = 100;
    const drawSpeed = 760; // SVG units per second
    paths.forEach((el, index) => {
      const length = Math.max(1, el.getTotalLength());
      const duration = Math.max(0.16, length / drawSpeed);
      const delay = cursor / 1000;
      const fillDelay = delay + duration * 0.78;
      const fill = Number(el.dataset.fill || 0);
      el.style.animation = `trace ${duration}s cubic-bezier(.45,0,.25,1) ${delay}s forwards`;
      if (fill > 0) {
        const t = setTimeout(() => {
          if (token !== animationToken) return;
          el.style.transition = `fill-opacity .32s ease ${Math.max(0, duration * .55)}s`;
          el.style.fillOpacity = String(fill);
        }, delay * 1000 + duration * 1000 * .42);
        timers.push(t);
      }
      cursor += duration * 1000 * 0.78 + 28;
    });

    const total = cursor + 380;
    const readyTimer = setTimeout(() => {
      if (token !== animationToken) return;
      stage.classList.add('ready');
    }, total);
    timers.push(readyTimer);
  }

  const style = document.createElement('style');
  style.textContent = `@keyframes trace { to { stroke-dashoffset: 0; } }`;
  document.head.appendChild(style);

  svg.addEventListener('click', play);
  window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') play();
  });
  play();
})();
</script>
</body>
</html>
